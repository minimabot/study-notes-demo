  label: { ko: "이 장의 DynamoDB 요금 수치를 읽은 가격표. AWS Price List API AmazonDynamoDB 오퍼 파일 버전 20260911124422" }
  source_en: https://aws.amazon.com/dynamodb/pricing/
  source_ko: https://aws.amazon.com/ko/dynamodb/pricing/
  checked: 2026-11-02
  volatile: true


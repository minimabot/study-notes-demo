# 요금 숫자는 요금 페이지(JS로 그려짐) 대신 AWS Price List API 가격표에서 읽었다.
#   https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonDynamoDB/20260911124422/{ap-northeast-2,us-east-1}/index.json
#   (region_index.json의 currentVersionUrl, 2026-11-02 확인)
# 재사용: RCU 4 KB(dynamodb.rcu.item-size), WCU 1 KB(dynamodb.wcu.item-size), 최종적 일관성 2회(dynamodb.read.eventual-per-unit),
#   트랜잭션 2배(dynamodb.txn.unit-multiplier), 예약 용량 단위·기간(dynamodb.reserved.*), Auto Scaling 목표 70%(dynamodb.autoscaling.target.recommended),
#   us-east-1 PITR·백업·복원 단가(dynamodb.price.*.us-east-1, dynamodb-backup-restore.yaml).

- id: dynamodb.price.offer-version
  value: "2026-09-11"

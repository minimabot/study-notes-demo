# IAM 역할 장(iam/roles) 전용 사실 항목. 역할 세션 상한(iam.role.session.max), 역할 수 할당량은 iam-core.yaml을 재사용한다. STS 최소 세션 길이는 iam-temporary-credentials.yaml의 iam.sts.duration.min을 쓴다. 2026-11-03 대조.

- id: iam.role.chaining.max-session
  value: 3600
  unit: s
  display: { ko: "1시간" }
  label: { ko: "역할 체인으로 얻은 역할 세션의 최대 길이 (역할의 최대 세션 기간 설정과 무관)" }
  source_en: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html
  source_ko: https://docs.aws.amazon.com/ko_kr/IAM/latest/UserGuide/id_roles.html
  checked: 2026-11-03
  volatile: false

- id: iam.role.max-session.default
  value: 3600
  unit: s
  display: { ko: "1시간" }
  label: { ko: "역할 최대 세션 기간 설정의 기본값 (설정할 수 있는 가장 작은 값이기도 하다)" }
  source_en: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_update-role-settings.html
  source_ko: https://docs.aws.amazon.com/ko_kr/IAM/latest/UserGuide/id_roles_update-role-settings.html
  checked: 2026-11-03
  volatile: false

- id: iam.role.revoke.future-buffer
  value: 30
  unit: s
  display: { ko: "약 30초" }
  label: { ko: "'활성 세션 취소' 시 거부 정책이 누른 시점 이후까지 덮는 대략의 여유 시간 (전파 지연 대비)" }
  source_en: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_revoke-sessions.html
  source_ko: https://docs.aws.amazon.com/ko_kr/IAM/latest/UserGuide/id_roles_use_revoke-sessions.html
  checked: 2026-11-03
  volatile: false

- id: iam.instance-profile.role-removal-delay
  value: 3600
  unit: s
  display: { ko: "최대 1시간" }
  label: { ko: "인스턴스 프로파일에서 역할을 뺐을 때 반영까지 걸릴 수 있는 지연" }
  source_en: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html
  source_ko: https://docs.aws.amazon.com/ko_kr/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html
  checked: 2026-11-03
  volatile: false

- id: iam.instance-profile.roles.max
  value: 1
  unit: count
  display: { ko: "1개 (상향 불가)" }
  label: { ko: "인스턴스 프로파일 하나에 담을 수 있는 역할 수" }
  source_en: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html
  source_ko: https://docs.aws.amazon.com/ko_kr/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html
  checked: 2026-11-03
  volatile: false

- id: iam.quota.instance-profiles
  value: 1000
  unit: count
  display: { ko: "1,000개 (최대 10,000개)" }
  label: { ko: "계정당 인스턴스 프로파일 수 기본 할당량" }
  source_en: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_iam-quotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/IAM/latest/UserGuide/reference_iam-quotas.html
  checked: 2026-11-03
  volatile: true

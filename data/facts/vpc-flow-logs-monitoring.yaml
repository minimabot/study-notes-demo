# VPC 흐름 로그·모니터링 장(vpc/flow-logs-monitoring) 전용 사실 항목. 2026-11-03 대조.

- id: vpc.flowlogs.aggregation.default
  value: 600
  unit: s
  display: { ko: "10분" }
  label: { ko: "흐름 로그의 최대 집계 간격 기본값" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/flow-log-records.html
  checked: 2026-11-03
  volatile: false

- id: vpc.flowlogs.aggregation.short
  value: 60
  unit: s
  display: { ko: "1분" }
  label: { ko: "흐름 로그를 만들 때 고를 수 있는 짧은 최대 집계 간격. Nitro 기반 인스턴스의 네트워크 인터페이스는 설정과 관계없이 늘 이 값 이하로 집계된다" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/flow-log-records.html
  checked: 2026-11-03
  volatile: false

- id: vpc.flowlogs.delivery.cwl
  value: 300
  unit: s
  display: { ko: "약 5분" }
  label: { ko: "집계 뒤 흐름 로그가 CloudWatch Logs에 전달되기까지 보통 걸리는 시간 (최선 노력, 더 늦을 수 있음)" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/flow-log-records.html
  checked: 2026-11-03
  volatile: false

- id: vpc.flowlogs.delivery.s3
  value: 600
  unit: s
  display: { ko: "약 10분" }
  label: { ko: "집계 뒤 흐름 로그가 Amazon S3에 전달되기까지 보통 걸리는 시간 (최선 노력, 더 늦을 수 있음)" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/flow-log-records.html
  checked: 2026-11-03
  volatile: false

- id: vpc.flowlogs.s3.file-interval
  value: 300
  unit: s
  display: { ko: "5분" }
  label: { ko: "흐름 로그가 레코드를 로그 파일로 묶어 S3 버킷에 올리는 간격" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-s3-path.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/flow-logs-s3-path.html
  checked: 2026-11-03
  volatile: false

- id: vpc.flowlogs.setup-delay
  value: 600
  unit: s
  display: { ko: "10분 이상" }
  label: { ko: "흐름 로그를 만든 뒤 로그 그룹이 생기고 데이터가 보이기까지 걸릴 수 있는 시간" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-troubleshooting.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/flow-logs-troubleshooting.html
  checked: 2026-11-03
  volatile: false

- id: vpc.flowlogs.subscriptions-per-resource
  value: 250
  unit: count
  display: { ko: "250개" }
  label: { ko: "계정당 리소스 하나에 만들 수 있는 흐름 로그 구독 수" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-limitations.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/flow-logs-limitations.html
  checked: 2026-11-03
  volatile: true

- id: vpc.cw.nau-metric-interval
  value: 86400
  unit: s
  display: { ko: "24시간마다" }
  label: { ko: "VPC가 네트워크 주소 사용량(NAU) 지표를 CloudWatch에 보내는 주기" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-cloudwatch.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/vpc-cloudwatch.html
  checked: 2026-11-03
  volatile: false

# vpc/network-cost 장 전용 사실 항목. ID 접두어 vpc.price.
# 요금 숫자는 요금 페이지(JS로 그려짐) 대신 AWS Price List API 가격표에서 읽었다 (2026-11-03 확인).
#   NAT 게이트웨이: AmazonEC2 오퍼 20261029175634 (usagetype APN2-NatGateway-Hours / -Bytes, us-east-1은 NatGateway-Hours / -Bytes)
#   인터페이스 엔드포인트·전송 게이트웨이·퍼블릭 IPv4·Reachability Analyzer: AmazonVPC 오퍼 20261016224321
#   영역 간 전송·인터넷 송신·리전 간 전송: AWSDataTransfer 오퍼 20260916132208 (같은 값이 AmazonEC2 오퍼의 DataTransfer-Regional-Bytes에도 있다)
#   https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/<서비스>/current/region_index.json → currentVersionUrl
# 요금 항목의 뜻(영역 간 전송은 들어가는 쪽·나가는 쪽 각각, 무료 송신 제공량, 같은 영역 피어링 무료, 게이트웨이 엔드포인트 무료)은
#   https://aws.amazon.com/ec2/pricing/on-demand/ 와 https://aws.amazon.com/vpc/pricing/ 본문에서 확인했다.
# 재사용: NAT 게이트웨이 할당량(vpc.quota.natgw-per-az), 엔드포인트 할당량(vpc.endpoint.*), 전송 게이트웨이 한도(vpc.tgw.*).


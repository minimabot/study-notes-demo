# DynamoDB 보안 장 전용 수치 (2026-11-02 대조). 공용 수치는 dynamodb-core.yaml에 있다.

- id: dynamodb.rbp.max-size
  value: 20
  unit: "KB"
  display: { ko: "20KB" }
  label: { ko: "DynamoDB 리소스 하나에 붙일 수 있는 리소스 기반 정책의 최대 크기" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/access-control-resource-based.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/access-control-resource-based.html
  checked: 2026-11-02
  volatile: false

- id: dynamodb.privatelink.max-rps
  value: 50000
  unit: "requests/s"
  display: { ko: "초당 요청 50,000" }
  label: { ko: "DynamoDB PrivateLink 엔드포인트 하나에 보낼 수 있는 최대 요청 수" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/privatelink-interface-endpoints.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/privatelink-interface-endpoints.html
  checked: 2026-11-02
  volatile: true

- id: dynamodb.tls.min-version
  value: "1.2"
  unit: "version"
  display: { ko: "TLS 1.2" }
  label: { ko: "DynamoDB API 클라이언트가 지원해야 하는 최소 TLS 버전 (TLS 1.3 권장)" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/inter-network-traffic-privacy.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/inter-network-traffic-privacy.html
  checked: 2026-11-02
  volatile: true

- id: dynamodb.cmk.inaccessible-grace
  value: 7
  unit: "days"
  display: { ko: "7일" }
  label: { ko: "고객 관리형 키에 접근할 수 없게 된 테이블이 보관 처리되기 전까지 키 접근을 되돌려야 하는 기간" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/encryption.howitworks.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/encryption.howitworks.html
  checked: 2026-11-02
  volatile: false

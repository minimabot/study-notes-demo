# iam/temporary-credentials 장 전용 수치. 2026-11-03 Compare AWS STS credentials 등 대조.

- id: iam.sts.duration.min
  value: 900
  unit: s
  display: { ko: "15분" }
  label: { ko: "STS가 발급하는 임시 자격 증명의 최소 유효 기간 (모든 STS 발급 API 공통)" }
  source_en: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_sts-comparison.html
  source_ko: https://docs.aws.amazon.com/ko_kr/IAM/latest/UserGuide/id_credentials_sts-comparison.html
  checked: 2026-11-03
  volatile: false

- id: iam.sts.role-session.default

# sqs/cost 장 전용 사실 항목.
# 요금 숫자는 요금 페이지(JS로 그려짐) 대신 AWS Price List API 가격표에서 읽었다.
#   SQS: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AWSQueueService/20260911124607/{ap-northeast-2,us-east-1}/index.json
#   KMS: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/awskms/20261026201814/{ap-northeast-2,us-east-1}/index.json
# 64 KB 단위 과금(sqs.billing.chunk-size)과 1 MiB = 16건(sqs.billing.requests-per-max-message)은 sqs-large-messages.yaml을 재사용한다.
# kms.* 항목은 원래 data/facts/kms.yaml에 두어야 한다(AUTHORING 8절). 이 작업에서 만들 수 있는 파일이 이것뿐이라 임시로 여기에 둔다. ID는 옮겨도 그대로 쓸 수 있게 kms. 접두어를 붙였다.


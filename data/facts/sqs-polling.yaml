# sqs/polling 장 전용 사실 항목. 공용 값(긴 폴링 대기 최댓값 등)은 sqs-core.yaml을 재사용한다.


- id: sqs.longpoll.wait.min
  value: 1
  unit: s
  display: { ko: "1초" }
  label: { ko: "긴 폴링 대기 시간으로 둘 수 있는 가장 짧은 값" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/best-practices-setting-up-long-polling.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/best-practices-setting-up-long-polling.html
  checked: 2026-11-01
  volatile: false

- id: sqs.shortpoll.small-queue
  value: 1000
  unit: count
  display: { ko: "1,000개" }
  label: { ko: "짧은 폴링 설명에서 '메시지가 적은 큐'의 기준 (이보다 적으면 한 번의 요청에 요청한 수보다 적게 올 수 있음)" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-short-and-long-polling.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-short-and-long-polling.html
  checked: 2026-11-01
  volatile: false

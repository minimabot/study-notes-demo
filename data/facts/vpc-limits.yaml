  value: 5
  unit: count
  display: { ko: "5개 (리전당 VPC 할당량을 올리면 같이 오름)" }
  label: { ko: "리전당 인터넷 게이트웨이 수 기본 할당량" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/amazon-vpc-limits.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/amazon-vpc-limits.html
  checked: 2026-11-03
  volatile: true


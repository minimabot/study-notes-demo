# Lambda 권 공용 수치. 다른 장은 이 파일을 고치지 않는다. 2026-11-03 Lambda quotas 대조. (lambda.timeout.max, lambda.payload.sync.max는 lambda.yaml/lambda-sqs-integration.yaml에 이미 있음)

- id: lambda.concurrency.account.default
  value: 1000
  unit: count
  display: { ko: "1,000개 (수만 개까지 상향 가능)" }
  label: { ko: "리전당 동시 실행 수 기본 할당량" }
  source_en: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
  source_ko: https://docs.aws.amazon.com/ko_kr/lambda/latest/dg/gettingstarted-limits.html
  checked: 2026-11-03
  volatile: true


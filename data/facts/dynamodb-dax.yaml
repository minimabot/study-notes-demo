# DynamoDB DAX 장 전용 수치 (2026-11-02 대조). 공용 수치는 dynamodb-core.yaml에 있다.

- id: dynamodb.dax.item-ttl.default
  value: 5
  unit: "min"
  display: { ko: "5분" }
  label: { ko: "DAX 항목 캐시 TTL 기본값" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.concepts.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/DAX.concepts.html
  checked: 2026-11-02
  volatile: false

- id: dynamodb.dax.cluster.max-nodes
  value: 11
  unit: "nodes"
  display: { ko: "노드 11개(기본 노드 1개 + 읽기 복제본 최대 10개)" }
  label: { ko: "DAX 클러스터 하나의 최대 노드 수" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.concepts.cluster.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/DAX.concepts.cluster.html
  checked: 2026-11-02
  volatile: false

- id: dynamodb.dax.cluster.min-prod-nodes
  value: 3
  unit: "nodes"
  display: { ko: "노드 3개" }
  label: { ko: "운영 환경에 AWS가 권장하는 DAX 클러스터 최소 노드 수 (각각 다른 가용 영역)" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.concepts.cluster.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/DAX.concepts.cluster.html
  checked: 2026-11-02
  volatile: false

- id: dynamodb.dax.cluster.max-tables
  value: 500
  unit: "tables"
  display: { ko: "테이블 500개" }
  label: { ko: "DAX 클러스터 하나가 지원하는 최대 DynamoDB 테이블 수" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.concepts.cluster.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/DAX.concepts.cluster.html
  checked: 2026-11-02
  volatile: false

- id: dynamodb.dax.port
  value: 8111
  unit: "port"
  display: { ko: "TCP 포트 8111" }
  label: { ko: "DAX 클러스터 보안 그룹 인바운드 규칙에 여는 포트" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.concepts.cluster.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/DAX.concepts.cluster.html
  checked: 2026-11-02
  volatile: false

- id: dynamodb.dax.replication.typical
  value: 1
  unit: "s"
  display: { ko: "보통 1초 미만" }
  label: { ko: "DAX 기본 노드에서 다른 노드로 변경이 복제되는 데 걸리는 시간(보통)" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.consistency.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/DAX.consistency.html
  checked: 2026-11-02
  volatile: false

- id: dynamodb.dax.hit-rate.best
  value: 90
  unit: "%"
  display: { ko: "90% 초과" }
  label: { ko: "DAX가 가장 잘 동작하는 캐시 적중률" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/DAX.html
  checked: 2026-11-02
  volatile: false

- id: dynamodb.dax.hit-rate.typical
  value: "85-95"
  unit: "%"
  display: { ko: "85~95%" }
  label: { ko: "DAX를 쓰는 애플리케이션의 일반적인 캐시 적중률" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.sizing-guide.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/DAX.sizing-guide.html
  checked: 2026-11-02
  volatile: false

- id: dynamodb.dax.read-write-ratio
  value: 10
  unit: "ratio"
  display: { ko: "10:1 이상" }
  label: { ko: "DAX가 효과를 보는 읽기 대 쓰기 비율의 예" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/evaluate-dax-suitability.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/evaluate-dax-suitability.html
  checked: 2026-11-02
  volatile: false

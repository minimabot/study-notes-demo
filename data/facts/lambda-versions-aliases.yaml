# lambda/versions-aliases 장 전용 사실. CodeDeploy의 Lambda용 미리 정의된 배포 구성 값도 여기 둔다(시뮬레이터 lambda-alias-shift가 쓴다).

- id: lambda.alias.routing.max-versions
  value: 2
  unit: count
  display: { ko: "버전 2개" }
  label: { ko: "가중치 별칭(weighted alias) 하나가 트래픽을 나눠 보낼 수 있는 함수 버전 수" }
  source_en: https://docs.aws.amazon.com/lambda/latest/dg/configuring-alias-routing.html
  source_ko: https://docs.aws.amazon.com/ko_kr/lambda/latest/dg/configuring-alias-routing.html
  checked: 2026-11-03
  volatile: false


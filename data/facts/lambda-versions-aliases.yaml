  value: 10
  unit: "%"
  display: { ko: "10%" }
  label: { ko: "CodeDeploy의 미리 정의된 Lambda 카나리·선형 배포 구성이 한 단계에 옮기는 트래픽 비율" }
  source_en: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
  source_ko: https://docs.aws.amazon.com/ko_kr/codedeploy/latest/userguide/deployment-configurations.html

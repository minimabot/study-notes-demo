# lambda/packaging-runtimes 장 전용 사실. .zip 직접 업로드 50 MB(lambda.zip.max-zipped), 이미지 10 GB(lambda.image.max-size)는 lambda-core.yaml을 재사용한다.

- id: lambda.zip.max-unzipped
  value: 262144000
  unit: byte
  display: { ko: "250 MB" }
  label: { ko: ".zip 배포 패키지의 압축 해제 크기 상한. 함수 코드, 계층, 사용자 지정 런타임, 익스텐션을 모두 합한 값" }
  source_en: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
  source_ko: https://docs.aws.amazon.com/ko_kr/lambda/latest/dg/gettingstarted-limits.html
  checked: 2026-11-03
  volatile: false

- id: lambda.console-editor.max
  value: 3
  unit: MB
  display: { ko: "3 MB" }
  label: { ko: "콘솔 코드 편집기로 직접 고칠 수 있는 함수 코드 크기 (넘으면 .zip으로 올림)" }
  source_en: https://docs.aws.amazon.com/lambda/latest/dg/configuration-function-zip.html
  source_ko: https://docs.aws.amazon.com/ko_kr/lambda/latest/dg/configuration-function-zip.html
  checked: 2026-11-03
  volatile: false

- id: lambda.code-storage.max
  value: 300
  unit: GB
  display: { ko: "300 GB" }
  label: { ko: "Lambda 관리형 스토리지에 올린 함수(.zip)·계층 코드 저장 한도 (함수 버전·계층 버전마다 차지, 늘릴 수 없음)" }
  source_en: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
  source_ko: https://docs.aws.amazon.com/ko_kr/lambda/latest/dg/gettingstarted-limits.html
  checked: 2026-11-03
  volatile: true

- id: lambda.runtime.deprecation.notice
  value: 180
  unit: day
  display: { ko: "180일" }
  label: { ko: "런타임 지원 종료(사용 중단) 전에 이메일·Health Dashboard·Trusted Advisor로 알리기 시작하는 최소 기간" }
  source_en: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html
  source_ko: https://docs.aws.amazon.com/ko_kr/lambda/latest/dg/lambda-runtimes.html
  checked: 2026-11-03
  volatile: false

- id: lambda.runtime.block-create.after
  value: 30
  unit: day
  display: { ko: "30일" }
  label: { ko: "런타임 사용 중단 뒤 새 함수 생성을 막기 시작하기까지의 최소 기간 (런타임에 따라 더 늦춰지기도 함)" }
  source_en: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html
  source_ko: https://docs.aws.amazon.com/ko_kr/lambda/latest/dg/lambda-runtimes.html
  checked: 2026-11-03
  volatile: true

- id: lambda.runtime.block-update.after
  value: 60
  unit: day
  display: { ko: "60일" }
  label: { ko: "런타임 사용 중단 뒤 기존 함수의 코드·구성 업데이트를 막기 시작하기까지의 최소 기간 (런타임에 따라 더 늦춰지기도 함)" }
  source_en: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html
  source_ko: https://docs.aws.amazon.com/ko_kr/lambda/latest/dg/lambda-runtimes.html
  checked: 2026-11-03
  volatile: true

# Kinesis Data Streams 리샤딩 장(kinesis/resharding) 전용 사실 항목. ID 접두어 kinesis.
# 출처: Reshard a stream, UpdateShardCount API 참조, Quotas and limits. 2026-11-02 대조.

- id: kinesis.reshard.pairwise
  value: 2
  unit: count
  display: { ko: "2개" }
  label: { ko: "분할·병합 작업 한 번이 다루는 샤드 수 (분할은 하나를 둘로, 병합은 둘을 하나로)" }
  source_en: https://docs.aws.amazon.com/streams/latest/dev/kinesis-using-sdk-java-resharding.html
  source_ko: https://docs.aws.amazon.com/ko_kr/streams/latest/dev/kinesis-using-sdk-java-resharding.html
  checked: 2026-11-02
  volatile: false


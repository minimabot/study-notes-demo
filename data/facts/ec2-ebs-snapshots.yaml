# ec2/ebs-snapshots 장 전용 수치. 2026-11-03 EBS 사용 설명서 대조.

- id: ec2.snap.copy.concurrent
  value: 20
  unit: "count"
  display: { ko: "20개" }
  label: { ko: "대상(destination)당 동시 스냅샷 복사 요청 수" }
  source_en: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-copy-snapshot.html
  source_ko: https://docs.aws.amazon.com/ko_kr/ebs/latest/userguide/ebs-copy-snapshot.html
  checked: 2026-11-03
  volatile: false

- id: ec2.fsr.per-region
  value: 5
  unit: "count"
  display: { ko: "5개" }
  label: { ko: "리전당 빠른 스냅샷 복원을 켤 수 있는 스냅샷 수(공유받은 스냅샷 포함)" }
  source_en: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-fast-snapshot-restore.html
  source_ko: https://docs.aws.amazon.com/ko_kr/ebs/latest/userguide/ebs-fast-snapshot-restore.html

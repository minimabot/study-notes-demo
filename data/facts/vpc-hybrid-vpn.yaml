  value: 2
  unit: count
  display: { ko: "2개" }
  label: { ko: "Site-to-Site VPN 연결 하나에 들어 있는 터널 수 (각각 다른 가용 영역에서 끝남)" }
  source_en: https://docs.aws.amazon.com/vpn/latest/s2svpn/VPNTunnels.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpn/latest/s2svpn/VPNTunnels.html
  checked: 2026-11-03
  volatile: false


# VPC 하이브리드 연결 장(vpc/hybrid-vpn) 전용 사실 항목. Site-to-Site VPN과 Direct Connect 수치. 전송 게이트웨이 VPN MTU는 vpc-transit-gateway.yaml을, VPC 전파 경로 한도는 vpc-core.yaml을 재사용한다. 2026-11-03 대조.


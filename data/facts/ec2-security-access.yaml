# ec2/security-access 장 전용 수치. 2026-11-03 EC2 사용 설명서 대조.

- id: ec2.key.rsa.bits
  value: 2048
  unit: bit
  display: { ko: "2048비트" }
  label: { ko: "EC2가 지원하는 SSH-2 RSA 키 길이(Linux·Windows). ED25519는 Linux만" }
  source_en: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/create-key-pairs.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSEC2/latest/UserGuide/create-key-pairs.html
  checked: 2026-11-03
  volatile: false

- id: ec2.eic.key.ttl
  value: 60
  unit: s
  display: { ko: "60초" }
  label: { ko: "EC2 Instance Connect가 인스턴스 메타데이터에 넣은 SSH 공개 키가 남아 있는 시간" }
  source_en: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/connect-linux-inst-eic.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSEC2/latest/UserGuide/connect-linux-inst-eic.html
  checked: 2026-11-03
  volatile: false

- id: ec2.eice.per-region
  value: 5
  unit: count
  display: { ko: "5개" }
  label: { ko: "계정·리전당 EC2 Instance Connect 엔드포인트 수 (조정 불가)" }
  source_en: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/eice-quotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSEC2/latest/UserGuide/eice-quotas.html
  checked: 2026-11-03
  volatile: false

- id: ec2.eice.per-vpc
  value: 1
  unit: count
  display: { ko: "1개" }
  label: { ko: "VPC당, 그리고 서브넷당 EC2 Instance Connect 엔드포인트 수 (조정 불가)" }
  source_en: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/eice-quotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSEC2/latest/UserGuide/eice-quotas.html
  checked: 2026-11-03
  volatile: false

- id: ec2.eice.conns
  value: 20
  unit: count
  display: { ko: "20개" }
  label: { ko: "EC2 Instance Connect 엔드포인트 하나당 동시 연결 수 (조정 불가)" }
  source_en: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/eice-quotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSEC2/latest/UserGuide/eice-quotas.html
  checked: 2026-11-03
  volatile: false

- id: ec2.eice.tcp.max
  value: 3600
  unit: s
  display: { ko: "1시간" }
  label: { ko: "EC2 Instance Connect 엔드포인트로 맺은 TCP 연결의 최대 지속 시간 (IAM 정책으로 더 짧게 정할 수 있음)" }
  source_en: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/connect-with-ec2-instance-connect-endpoint.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSEC2/latest/UserGuide/connect-with-ec2-instance-connect-endpoint.html
  checked: 2026-11-03
  volatile: false

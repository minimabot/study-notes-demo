# 사실 항목 (단일 원본). 값·출처·확인 날짜는 언어와 무관하게 한 벌만 둔다.
# 본문·퀴즈·시뮬레이터는 {{fact:ID}}로 참조한다. 이 파일 밖에 수치를 직접 쓰지 않는다.

- id: sqs.visibility.default
  value: 30
  unit: s
  display: { ko: "30초" }
  label: { ko: "가시성 제한 시간 기본값" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
  checked: 2026-11-01
  volatile: false

- id: sqs.visibility.min
  value: 0
  unit: s
  display: { ko: "0초" }
  label: { ko: "가시성 제한 시간 최솟값" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
  checked: 2026-11-01
  volatile: false

- id: sqs.visibility.max
  value: 43200
  unit: s
  display: { ko: "12시간" }
  label: { ko: "가시성 제한 시간 최댓값" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
  checked: 2026-11-01
  volatile: false

- id: sqs.visibility.max-from-first-receive
  value: 43200
  unit: s
  display: { ko: "첫 수신 시점부터 12시간" }
  label: { ko: "연장해도 넘을 수 없는 한도 (연장해도 초기화되지 않음)" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html
  checked: 2026-11-01
  volatile: false

- id: sqs.visibility.initial-suggestion
  value: 120
  unit: s
  display: { ko: "2분" }
  label: { ko: "처리 시간을 모를 때 AWS가 예로 든 시작값" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html
  checked: 2026-11-01
  volatile: false

- id: sqs.inflight.standard.max
  value: 120000
  unit: count
  display: { ko: "약 120,000개" }
  label: { ko: "Standard 큐의 처리 중(in-flight) 메시지 한도" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-queues.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-queues.html
  checked: 2026-11-01
  volatile: true

- id: lambda.sqs.vt-multiplier
  value: 6
  unit: x
  display: { ko: "6배" }
  label: { ko: "Lambda 연동 시 큐 가시성 제한 시간 권장 배수 (함수 제한 시간 기준)" }
  source_en: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
  source_ko: https://docs.aws.amazon.com/ko_kr/lambda/latest/dg/services-sqs-configure.html
  checked: 2026-11-01
  volatile: false

- id: lambda.timeout.max
  value: 900
  unit: s
  display: { ko: "900초(15분)" }
  label: { ko: "Lambda 함수 제한 시간 최댓값 (Managed Instances 제외)" }
  source_en: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
  source_ko: https://docs.aws.amazon.com/ko_kr/lambda/latest/dg/gettingstarted-limits.html
  checked: 2026-11-01
  volatile: true

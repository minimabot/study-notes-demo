# iam/limits 장 전용 사실 항목. 역할·그룹·정책 수, 정책 크기, 세션 수치는 iam-core.yaml 등 기존 파일을 재사용한다. 2026-11-03 IAM and AWS STS quotas 대조.

- id: iam.quota.oidc-providers
  value: 100
  unit: count
  display: { ko: "100개 (최대 700개)" }
  label: { ko: "계정당 OpenID Connect 공급자 수 기본 할당량" }
  source_en: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_iam-quotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/IAM/latest/UserGuide/reference_iam-quotas.html
  checked: 2026-11-03
  volatile: true

- id: iam.quota.server-certificates
  value: 20
  unit: count
  display: { ko: "20개" }
  label: { ko: "계정당 서버 인증서 수 (기본값과 최대값이 같다)" }
  source_en: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_iam-quotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/IAM/latest/UserGuide/reference_iam-quotas.html
  checked: 2026-11-03
  volatile: false


# VPC DNS·DHCP 장(vpc/dns-dhcp) 전용 사실 항목. 링크 로컬 서비스 패킷 한도는 vpc-core.yaml의 vpc.dns.pps-per-eni를 재사용한다. 2026-11-03 대조.

- id: vpc.dhcp.dns-servers.max
  value: 8
  unit: count
  display: { ko: "IPv4 4개 + IPv6 4개 (IPv4 쪽은 사용자 지정 3개 + AmazonProvidedDNS도 가능)" }
  label: { ko: "DHCP 옵션 세트의 도메인 이름 서버 항목에 넣을 수 있는 서버 수" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/DHCPOptionSet.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/DHCPOptionSet.html
  checked: 2026-11-03
  volatile: false

- id: vpc.dhcp.ntp-servers.max
  value: 8
  unit: count
  display: { ko: "8개 (IPv4 4개 + IPv6 4개)" }
  label: { ko: "DHCP 옵션 세트의 NTP 서버 항목에 넣을 수 있는 서버 수" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/DHCPOptionSet.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/DHCPOptionSet.html
  checked: 2026-11-03
  volatile: false

- id: vpc.dhcp.netbios-servers.max
  value: 4
  unit: count
  display: { ko: "4개" }
  label: { ko: "DHCP 옵션 세트의 NetBIOS 이름 서버 항목에 넣을 수 있는 서버 수" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/DHCPOptionSet.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/DHCPOptionSet.html
  checked: 2026-11-03
  volatile: false

- id: vpc.dhcp.ipv6-lease.default
  value: 140
  unit: s
  display: { ko: "140초" }
  label: { ko: "DHCP 옵션 세트의 IPv6 기본 설정 임대 시간(IPv6 Preferred Lease Time) 기본값이자 최솟값. 갱신은 보통 절반이 지났을 때 일어난다" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/DHCPOptionSetConcepts.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/DHCPOptionSetConcepts.html
  checked: 2026-11-03
  volatile: false

- id: vpc.dns.non-rfc1918-cutoff
  value: "2016-10"
  unit: date
  display: { ko: "2016년 10월" }
  label: { ko: "이 시점 이전에 만든 VPC는 CIDR이 RFC 1918 범위 밖이면 Amazon DNS 서버가 프라이빗 DNS 호스트 이름을 풀지 않는다 (지원 요청으로 켬)" }
  source_en: https://docs.aws.amazon.com/vpc/latest/userguide/AmazonDNS-concepts.html
  source_ko: https://docs.aws.amazon.com/ko_kr/vpc/latest/userguide/AmazonDNS-concepts.html
  checked: 2026-11-03
  volatile: false

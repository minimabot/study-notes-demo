# DynamoDB 용량 모드 장 전용 수치 (2026-11-01 대조). 공용 수치는 dynamodb-core.yaml에 있다.

- id: dynamodb.ondemand.new-table.write
  value: 4000
  unit: units/s
  display: { ko: "초당 쓰기 4,000" }
  label: { ko: "새 온디맨드 테이블이 바로 감당하는 쓰기 처리량" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
  checked: 2026-11-01
  volatile: true

- id: dynamodb.ondemand.new-table.read
  value: 12000
  unit: units/s
  display: { ko: "초당 읽기 12,000" }
  label: { ko: "새 온디맨드 테이블이 바로 감당하는 읽기 처리량" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
  checked: 2026-11-01
  volatile: true

- id: dynamodb.ondemand.peak-multiplier
  value: 2
  unit: x
  display: { ko: "2배" }
  label: { ko: "온디맨드 테이블이 즉시 받아 주는 트래픽 (이전 최고치 대비)" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
  checked: 2026-11-01
  volatile: true

- id: dynamodb.ondemand.peak-growth-window
  value: 1800
  unit: s
  display: { ko: "30분" }
  label: { ko: "온디맨드에서 이전 최고치의 2배를 넘길 때 증가를 나눠야 하는 최소 기간 (이보다 빠르면 스로틀 가능)" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
  checked: 2026-11-01
  volatile: true

- id: dynamodb.throughput.table-default
  value: 40000
  unit: units/s
  display: { ko: "초당 40,000 단위 (읽기·쓰기 각각)" }
  label: { ko: "테이블 하나의 기본 처리량 한도 (온디맨드·프로비저닝 공통, 증가 요청 가능)" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/ServiceQuotas.html
  checked: 2026-11-01
  volatile: true

- id: dynamodb.capacity.switch-to-ondemand.max
  value: 4
  unit: count
  display: { ko: "24시간(롤링) 동안 4회" }
  label: { ko: "프로비저닝 모드에서 온디맨드 모드로 바꿀 수 있는 횟수 (반대 방향은 제한 없음)" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-switching-capacity-modes.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/bp-switching-capacity-modes.html
  checked: 2026-11-01
  volatile: true


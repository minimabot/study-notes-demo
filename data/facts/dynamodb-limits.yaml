# DynamoDB 한도 장 전용 수치 (2026-11-02 대조). 이미 있는 한도는 dynamodb-core.yaml 등에서 재사용한다.

- id: dynamodb.throughput.account-default
  value: 80000
  unit: units/s
  display: { ko: "초당 80,000 단위 (읽기·쓰기 각각)" }
  label: { ko: "리전별 계정 처리량 기본 한도 (프로비저닝된 모드 테이블·GSI 합계에만 적용)" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/ServiceQuotas.html
  checked: 2026-11-02
  volatile: true

- id: dynamodb.throughput.provisioned-min
  value: 1
  unit: units/s
  display: { ko: "읽기 1단위, 쓰기 1단위" }
  label: { ko: "프로비저닝된 테이블·GSI에 둘 수 있는 최소 처리량" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/ServiceQuotas.html
  checked: 2026-11-02
  volatile: false

- id: dynamodb.capacity.decrease.available
  value: 4
  unit: count
  display: { ko: "4회" }
  label: { ko: "프로비저닝 용량 감소: 하루(UTC)를 시작할 때 쓸 수 있고, 한 시간에 1회씩 다시 채워지는 감소 횟수의 최대치" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/ServiceQuotas.html
  checked: 2026-11-02
  volatile: true

- id: dynamodb.capacity.decrease.daily-max
  value: 27
  unit: count
  display: { ko: "27회" }
  label: { ko: "테이블(또는 GSI) 하나의 프로비저닝 용량을 하루(UTC) 동안 줄일 수 있는 최대 횟수" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/ServiceQuotas.html
  checked: 2026-11-02
  volatile: true

- id: dynamodb.reserved.account-max
  value: 1000000
  unit: units
  display: { ko: "1,000,000 단위" }
  label: { ko: "계정이 가질 수 있는 활성 예약 용량(RCU+WCU 합계) 기본 한도" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/ServiceQuotas.html
  checked: 2026-11-02
  volatile: true

- id: dynamodb.tables.per-region.default
  value: 2500
  unit: count
  display: { ko: "2,500개" }
  label: { ko: "계정·리전별 테이블 수 초기 한도" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/ServiceQuotas.html
  checked: 2026-11-02
  volatile: true

- id: dynamodb.tables.per-region.max
  value: 10000
  unit: count
  display: { ko: "10,000개" }
  label: { ko: "AWS 계정 팀과 협의해 늘릴 수 있는 계정·리전별 테이블 수 최대치" }
  source_en: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html
  source_ko: https://docs.aws.amazon.com/ko_kr/amazondynamodb/latest/developerguide/ServiceQuotas.html
  checked: 2026-11-02
  volatile: true


# sqs/best-practices 장 전용 사실 항목. 공용 값(배치 한도, 긴 폴링 최댓값 등)은 sqs-core.yaml을 재사용한다.

- id: sqs.bp.heartbeat.interval
  value: 60
  unit: s
  display: { ko: "1분" }
  label: { ko: "하트비트 예시: 가시성 제한 시간을 연장하는 주기 (AWS 예시 값)" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/best-practices-processing-messages-timely-manner.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/best-practices-processing-messages-timely-manner.html
  checked: 2026-11-01
  volatile: false

- id: sqs.bp.heartbeat.extend-by
  value: 120
  unit: s
  display: { ko: "2분" }
  label: { ko: "하트비트 예시: 한 번에 늘리는 가시성 제한 시간 (AWS 예시 값)" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/best-practices-processing-messages-timely-manner.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/best-practices-processing-messages-timely-manner.html
  checked: 2026-11-01
  volatile: false

- id: sqs.bp.retry.pause.first
  value: 200
  unit: ms
  display: { ko: "200ms" }
  label: { ko: "SDK 재시도를 쓰지 않을 때 ReceiveMessage 재시도 전 첫 대기 (AWS 예시 값)" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/handling-request-errors.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/handling-request-errors.html
  checked: 2026-11-01
  volatile: false

- id: sqs.bp.retry.pause.next
  value: 400
  unit: ms
  display: { ko: "400ms" }
  label: { ko: "같은 결과가 이어질 때 늘린 다음 대기 (AWS 예시 값)" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/handling-request-errors.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/handling-request-errors.html
  checked: 2026-11-01
  volatile: false

- id: sqs.bp.single-thread.latency-example
  value: 20
  unit: ms
  display: { ko: "평균 20ms" }
  label: { ko: "같은 리전 EC2에서 SQS까지 요청 지연 예시 (AWS 예시 값)" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-throughput-horizontal-scaling-and-batching.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-throughput-horizontal-scaling-and-batching.html
  checked: 2026-11-01
  volatile: false

- id: sqs.bp.single-thread.tps-example
  value: 50
  unit: tps
  display: { ko: "평균 초당 50건" }
  label: { ko: "위 지연에서 스레드 하나·연결 하나로 낼 수 있는 처리량 (AWS 예시 값)" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-throughput-horizontal-scaling-and-batching.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-throughput-horizontal-scaling-and-batching.html
  checked: 2026-11-01
  volatile: false

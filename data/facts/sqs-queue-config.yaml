# 장 sqs/queue-config 전용 사실 항목. 가시성·보관·지연·크기 등 공용 값은 sqs-core.yaml을 재사용한다.

- id: sqs.queue.max-message-size.min
  value: 1024
  unit: byte
  display: { ko: "1 KiB" }
  label: { ko: "큐 속성 '최대 메시지 크기'에 설정할 수 있는 가장 작은 값" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-configure-queue-parameters.html
  checked: 2026-11-01
  volatile: false

- id: sqs.receive-wait.default
  value: 0
  unit: s
  display: { ko: "0초" }
  label: { ko: "메시지 수신 대기 시간 기본값이자 최솟값 (0이면 짧은 폴링)" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-configure-queue-parameters.html
  checked: 2026-11-01
  volatile: false

- id: sqs.attributes.propagation
  value: 60
  unit: s
  display: { ko: "최대 60초" }
  label: { ko: "큐 속성 변경이 시스템 전체에 반영되는 시간 (대부분의 속성)" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html
  checked: 2026-11-01
  volatile: false

- id: sqs.attributes.retention-propagation
  value: 900
  unit: s
  display: { ko: "최대 15분" }
  label: { ko: "메시지 보존 기간(MessageRetentionPeriod) 변경이 반영되는 시간" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html
  checked: 2026-11-01
  volatile: false

- id: sqs.purge.duration
  value: 60
  unit: s
  display: { ko: "최대 60초" }
  label: { ko: "제거(PurgeQueue)가 끝나기까지 걸리는 시간. 이 시간 안에 다시 요청하면 PurgeQueueInProgress 오류" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_PurgeQueue.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-using-purge-queue.html
  checked: 2026-11-01
  volatile: false

- id: sqs.delete-queue.duration
  value: 60
  unit: s
  display: { ko: "최대 60초" }
  label: { ko: "대기열 삭제(DeleteQueue)가 끝나기까지 걸리는 시간" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_DeleteQueue.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/APIReference/API_DeleteQueue.html
  checked: 2026-11-01
  volatile: false

- id: sqs.delete-queue.name-reuse-wait
  value: 60
  unit: s
  display: { ko: "60초 이상" }
  label: { ko: "삭제한 대기열과 같은 이름으로 새 대기열을 만들기 전에 기다려야 하는 시간" }
  source_en: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_DeleteQueue.html
  source_ko: https://docs.aws.amazon.com/ko_kr/AWSSimpleQueueService/latest/APIReference/API_DeleteQueue.html
  checked: 2026-11-01
  volatile: false

# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: ec2.q.spot-notice
  type: quiz
  chapter: ec2/spot
  topic: ec2/spot/interruptions
  question: { ko: "스팟 인스턴스에서 도는 작업자가 중단 직전에 진행 상황을 S3에 저장하도록 하려 한다. 중단 동작은 기본값이다. 맞는 설계는?" }
  choices:
    - { id: a, text: { ko: "EventBridge 규칙으로 `EC2 Spot Instance Interruption Warning` 이벤트를 받거나, 인스턴스 안에서 메타데이터 `spot/instance-action`을 짧은 주기로 확인해 저장을 시작한다" } }
    - { id: b, text: { ko: "중단 알림은 종료 직전에 오지 않으므로 CloudWatch CPU 경보로 중단을 짐작한다" } }
    - { id: c, text: { ko: "스팟 요청에 낮은 최고 가격을 주면 중단 전에 충분한 시간이 주어진다" } }
    - { id: d, text: { ko: "중단 동작을 최대 절전으로 바꾸면 알림 뒤 같은 여유 시간을 얻고 메모리도 보존된다" } }
  answer: a
  explanation: { ko: "EC2는 스팟 인스턴스를 중지·종료하기 {{fact:ec2.spot.notice}} 전에 EventBridge 이벤트와 인스턴스 메타데이터 `spot/instance-action`으로 알린다. 문서는 메타데이터를 {{fact:ec2.spot.notice.poll}} 확인하라고 권한다. 기본 동작은 종료이므로 이 알림을 받아 저장하면 된다. b: 알림이 있으므로 짐작할 필요가 없다. c: 최고 가격을 주면 오히려 더 자주 중단되고 알림 시간은 그대로다. d: 최대 절전은 바로 시작되어 알림은 오지만 그만큼의 여유 시간이 없다." }
  facts: [ec2.spot.notice, ec2.spot.notice.poll]

- id: ec2.q.spot-allocation
  type: quiz
  chapter: ec2/spot
  topic: ec2/spot/allocation
  question: { ko: "상태 없는 컨테이너 작업을 EC2 Fleet으로 스팟에 돌린다. 여러 유형과 가용 영역을 허용했는데 중단이 잦다. AWS CLI로 만들며 할당 전략은 따로 지정하지 않았다. 먼저 바꿀 것은?" }
  choices:
    - { id: a, text: { ko: "할당 전략을 `price-capacity-optimized`로 지정한다" } }
    - { id: b, text: { ko: "허용 유형을 가장 싼 유형 하나로 줄인다" } }
    - { id: c, text: { ko: "요청에 최고 가격을 낮게 지정한다" } }
    - { id: d, text: { ko: "`RequestSpotInstances` API로 바꾼다" } }
  answer: a
  explanation: { ko: "CLI로 만든 EC2 Fleet의 스팟 할당 전략 기본값은 최저 가격이다. 최저 가격은 용량을 보지 않아 중단 위험이 가장 높다. 가격 용량 최적화는 가용 용량이 많은 풀들 가운데 싼 풀을 골라 중단 가능성을 낮춘다. b: 유형을 줄이면 쓸 수 있는 풀이 줄어 중단과 용량 부족이 늘어난다. c: 최고 가격을 주면 더 자주 중단된다. d: RequestSpotInstances는 레거시 API라 쓰지 말라고 문서가 권한다." }
  facts: []

- id: ec2.q.spot-rebalance
  type: quiz
  chapter: ec2/spot
  topic: ec2/spot/interruptions
  question: { ko: "Auto Scaling 그룹이 스팟 인스턴스로 웹 작업자를 돌린다. 중단 알림을 받은 뒤 대체 인스턴스를 띄우면 새 인스턴스가 준비되기 전에 용량이 비는 일이 생긴다. 알맞은 조치는?" }
  choices:
    - { id: a, text: { ko: "그룹의 용량 재조정(Capacity Rebalancing)을 켜서, 리밸런싱 권고가 오면 위험이 높은 인스턴스를 미리 교체하게 한다" } }
    - { id: b, text: { ko: "중단 동작을 중지로 바꾼다" } }
    - { id: c, text: { ko: "중단이 오면 온디맨드로 장애 조치하도록 바꾼다" } }
    - { id: d, text: { ko: "스팟 배치 점수가 높은 가용 영역 하나에만 그룹을 둔다" } }
  answer: a
  explanation: { ko: "리밸런싱 권고는 중단 위험이 높아졌다는 신호로, {{fact:ec2.spot.notice}} 중단 알림보다 먼저 올 수 있다. 용량 재조정을 켜면 그룹이 이 신호를 받아 대체 인스턴스를 미리 띄운다(늘 먼저 오지는 않는다). b: 중지는 상태를 남길 뿐 용량 공백을 메우지 않는다. c: 문서는 스팟 중단을 온디맨드로 장애 조치하는 설계를 말린다. 다른 스팟의 중단을 부르고 같은 조합의 온디맨드도 구하기 어려울 수 있다. d: 점수는 그 시점의 추천일 뿐이고, 한 가용 영역으로 줄이면 쓸 수 있는 풀이 줄어든다." }
  facts: [ec2.spot.notice]

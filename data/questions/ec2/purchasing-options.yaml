# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: ec2.q.purchasing-compute-sp
  type: quiz
  chapter: ec2/purchasing-options
  topic: ec2/purchasing-options/savings-plans-ri
  question: { ko: "회사는 EC2 사용량이 몇 년째 꾸준하다. 다만 내년에 c5에서 Graviton 기반 c7g로 옮기고, 일부 워크로드는 다른 리전과 Lambda로 옮길 계획이다. 약정 할인을 받으면서 이런 변경에도 할인이 계속 적용되게 하려면?" }
  choices:
    - { id: a, text: { ko: "c5에 대한 표준형 예약 인스턴스를 산다" } }
    - { id: b, text: { ko: "현재 리전의 c5 패밀리에 EC2 Instance Savings Plans를 산다" } }
    - { id: c, text: { ko: "Compute Savings Plans를 산다" } }
    - { id: d, text: { ko: "온디맨드 용량 예약을 만든다" } }
  answer: c
  explanation: { ko: "Compute Savings Plans는 시간당 사용 금액에 약정하고, 인스턴스 패밀리·크기·리전·OS·테넌시와 상관없이 EC2에 적용되며 Fargate와 Lambda에도 적용된다. a: 표준형 RI는 특정 구성에 묶이고 교환할 수 없다. b: EC2 Instance Savings Plans는 한 리전의 한 패밀리에만 적용되어 c7g나 다른 리전으로 옮기면 할인이 따라가지 않는다(할인 폭은 더 크다). d: 용량 예약은 용량을 확보할 뿐 할인이 없다." }
  facts: []

- id: ec2.q.purchasing-capacity-discount
  type: quiz
  chapter: ec2/purchasing-options
  topic: ec2/purchasing-options/capacity
  question: { ko: "재해 복구 규정 때문에 다른 가용 영역에 특정 유형의 용량이 늘 확보되어 있어야 한다. 동시에 비용 할인도 받고 싶다. 알맞은 조합은?" }
  choices:
    - { id: a, text: { ko: "리전 예약 인스턴스만 산다. 리전 RI가 모든 가용 영역에 용량을 예약한다" } }
    - { id: b, text: { ko: "그 가용 영역에 온디맨드 용량 예약을 만들고, Savings Plans로 할인을 받는다" } }
    - { id: c, text: { ko: "온디맨드 용량 예약을 만들면 온디맨드보다 싼 요금이 자동 적용된다" } }
    - { id: d, text: { ko: "스팟 인스턴스로 용량을 잡아 두고 필요할 때 온디맨드로 바꾼다" } }
  answer: b
  explanation: { ko: "온디맨드 용량 예약은 특정 가용 영역의 용량을 확보하지만 할인은 없고, 쓰지 않아도 온디맨드 요금이 나간다. Savings Plans와 리전 RI의 할인은 용량 예약에 적용되므로 둘을 조합한다. a: 리전 RI는 용량을 예약하지 않는다. 용량을 예약하는 것은 영역 RI다. c: 용량 예약 자체에는 할인이 없다. d: 스팟은 EC2가 회수할 수 있어 용량 보장이 되지 않는다." }
  facts: []

- id: ec2.q.purchasing-dedicated-host
  type: quiz
  chapter: ec2/purchasing-options
  topic: ec2/purchasing-options/dedicated
  question: { ko: "물리 코어 수로 매기는 기존 소프트웨어 라이선스를 AWS로 가져오려 한다. 라이선스 감사 때문에 인스턴스가 어떤 서버의 몇 개 코어에서 도는지 확인할 수 있어야 하고, 같은 서버에 계속 두고 싶다. 무엇을 쓰는가?" }
  choices:
    - { id: a, text: { ko: "전용 인스턴스" } }
    - { id: b, text: { ko: "전용 호스트" } }
    - { id: c, text: { ko: "기본 테넌시 인스턴스에 영역 예약 인스턴스 적용" } }
    - { id: d, text: { ko: "Compute Savings Plans를 적용한 기본 테넌시 인스턴스" } }
  answer: b
  explanation: { ko: "전용 호스트는 물리 서버를 통째로 쓰고 소켓·물리 코어 수와 호스트 ID가 보인다. 호스트 선호도로 인스턴스를 같은 서버에 계속 둘 수 있어 소켓·코어·VM 단위 BYOL을 폭넓게 지원한다. a: 전용 인스턴스도 다른 계정과 하드웨어를 나누지 않지만 소켓·코어가 보이지 않고 호스트 선호도가 없으며 BYOL은 일부만 된다. c, d: 기본 테넌시는 다른 계정과 하드웨어를 나눌 수 있어 요구에 맞지 않는다." }
  facts: []

- id: ec2.d.purchasing-mixed-workload
  type: design
  chapter: ec2/purchasing-options
  topic: ec2/purchasing-options/compare
  scenario: { ko: "한 서비스가 세 부분으로 이뤄져 있다. (가) 웹 계층: 하루 내내 최소 {{raw:12대}}가 돌고, 낮 피크에는 Auto Scaling으로 {{raw:30대}}까지 는다. 내년에 다른 패밀리(Graviton)로 옮길 계획이다. (나) 야간 배치: 매일 밤 몇 시간 도는 데이터 변환 작업이다. 작업은 조각으로 나뉘어 있어 중간에 끊기면 그 조각만 다시 돌리면 되고, 아침까지만 끝나면 된다. (다) 데이터베이스 서버: 물리 코어 수로 매기는 상용 DB 라이선스를 이미 갖고 있고, 감사 때 코어 수를 증명해야 한다. 비용을 낮추면서 요구를 지키는 구매 방식을 모두 고르라." }
  choices:
    - { id: a, text: { ko: "웹 계층의 늘 도는 기준 대수 사용량만큼 Compute Savings Plans를 약정하고, 피크 증가분은 온디맨드로 받는다" } }
    - { id: b, text: { ko: "웹 계층 피크 대수({{raw:30대}})만큼 현재 패밀리의 표준형 예약 인스턴스를 장기로 산다" } }
    - { id: c, text: { ko: "야간 배치는 여러 인스턴스 유형과 가용 영역을 허용한 스팟 인스턴스로 돌리고, 조각 단위로 결과를 저장해 끊기면 다시 돌린다" } }
    - { id: d, text: { ko: "야간 배치용으로 온디맨드 용량 예약을 하루 내내 잡아 둔다" } }
    - { id: e, text: { ko: "DB는 전용 호스트에서 돌리고, 기존 코어 단위 라이선스를 가져온다(BYOL)" } }
    - { id: f, text: { ko: "DB는 전용 인스턴스로 돌린다" } }
    - { id: g, text: { ko: "DB도 비용을 위해 스팟 인스턴스로 돌린다" } }
  answer_set: [a, c, e]
  rubric:
    ko:
      - "a, c, e를 모두 고르면 정답이다."
      - "a: 기준 부하는 늘 쓰므로 약정 할인이 맞다. 패밀리를 옮길 계획이 있으므로 패밀리·리전에 묶이지 않는 Compute Savings Plans가 맞다. 약정은 늘 쓰는 만큼만 잡고, 변하는 피크는 온디맨드로 받아야 약정이 남지 않는다."
      - "c: 시점이 유연하고 끊겨도 다시 돌리면 되는 일은 스팟이 맞다. 여러 유형과 가용 영역을 허용하면 용량을 얻을 가능성이 높아지고 중단도 줄어든다({{ch:ec2/spot}}). 결과를 조각마다 저장해 두면 중단돼도 잃는 작업이 작다."
      - "e: 물리 코어 단위 라이선스를 쓰고 코어 수를 증명하려면 소켓·코어가 보이는 전용 호스트가 필요하다. 전용 호스트에도 Savings Plans나 전용 호스트 예약으로 할인을 받을 수 있다."
      - "b는 감점: 피크 대수만큼 약정하면 피크가 아닐 때 약정이 남아 돈이 샌다. 또 표준형 RI는 교환할 수 없어 패밀리를 옮기면 할인이 따라가지 않는다."
      - "d는 감점: 용량 예약은 할인이 없고 쓰지 않는 시간에도 온디맨드 요금이 나간다. 아침까지만 끝나면 되는 배치에는 용량 보장이 필요 없다."
      - "f는 감점: 전용 인스턴스는 소켓·코어가 보이지 않고 BYOL 지원이 일부뿐이라 코어 단위 라이선스 요구를 맞추지 못한다."
      - "g는 감점: DB는 상태를 갖고 중단을 견디지 못하는 워크로드라 스팟에 맞지 않는다. 라이선스 요구도 풀지 못한다."
  facts: []

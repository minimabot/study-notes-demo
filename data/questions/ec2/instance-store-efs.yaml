# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: ec2.q.instance-store-efs-reboot
  type: quiz
  chapter: ec2/instance-store-efs
  topic: ec2/instance-store-efs/instance-store
  question: { ko: "i 계열 인스턴스의 NVMe 인스턴스 스토어에 정렬 작업용 임시 파일을 둔다. 다음 중 인스턴스 스토어의 데이터가 그대로 남는 경우는?" }
  choices:
    - { id: a, text: { ko: "인스턴스를 중지했다가 다시 시작했다" } }
    - { id: b, text: { ko: "인스턴스 안에서 OS를 재시작(reboot)했다" } }
    - { id: c, text: { ko: "인스턴스 유형을 같은 계열의 더 큰 크기로 바꿨다" } }
    - { id: d, text: { ko: "인스턴스를 최대 절전 모드로 두었다가 다시 시작했다" } }
  answer: b
  explanation: { ko: "인스턴스 스토어 데이터는 재부팅(사용자·OS·AWS 예정 재부팅)에는 남는다. 인스턴스가 호스트를 떠나는 중지, 최대 절전, 종료에서는 모든 블록이 암호학적으로 지워진다. a, d: 중지와 최대 절전은 데이터를 지운다. c: 유형을 바꾸려면 중지해야 하고, 새 유형이 인스턴스 스토어를 주더라도 데이터는 옮겨지지 않는다." }
  facts: []

- id: ec2.q.instance-store-efs-shared
  type: quiz
  chapter: ec2/instance-store-efs
  topic: ec2/instance-store-efs/comparison
  question: { ko: "세 가용 영역에 걸친 Auto Scaling 그룹의 Linux 웹 서버들이 사용자가 올린 이미지 파일을 함께 읽고 써야 한다. 서버는 수시로 늘고 준다. 가장 알맞은 스토리지는?" }
  choices:
    - { id: a, text: { ko: "각 인스턴스의 인스턴스 스토어에 저장하고 서로 복사한다" } }
    - { id: b, text: { ko: "gp3 EBS 볼륨 하나를 모든 인스턴스에 붙인다" } }
    - { id: c, text: { ko: "리전 EFS 파일 시스템을 만들고 가용 영역마다 탑재 대상을 둔 뒤 모든 인스턴스가 탑재한다" } }
    - { id: d, text: { ko: "FSx for Windows File Server로 SMB 공유를 만든다" } }
  answer: c
  explanation: { ko: "EFS는 여러 가용 영역의 많은 인스턴스가 NFS로 같은 파일을 동시에 쓰는 공유 파일 스토리지다. 리전 파일 시스템은 {{fact:ec2.efs.regional.az.min}} 가용 영역에 데이터를 나눠 두고, 탑재 대상은 {{fact:ec2.efs.mt.per-az}} 둔다. a: 인스턴스 스토어는 인스턴스가 사라지면 데이터도 사라지고 공유되지 않는다. b: EBS 볼륨은 한 가용 영역에 묶이고, 다중 연결도 io1·io2에서 같은 영역 안에서만 된다. gp3는 다중 연결이 안 된다. d: Linux 서버의 NFS 공유에는 EFS가 맞다. FSx for Windows File Server는 Windows SMB 작업용이다." }
  facts: [ec2.efs.regional.az.min, ec2.efs.mt.per-az]

- id: ec2.q.instance-store-efs-lifecycle
  type: quiz
  chapter: ec2/instance-store-efs
  topic: ec2/instance-store-efs/efs-classes-performance
  question: { ko: "EFS 파일 시스템의 데이터 대부분이 몇 달 동안 읽히지 않는다. 비용을 줄이려고 수명 주기 관리를 켰다. 기본 정책에서 일어나는 일로 옳은 것은?" }
  choices:
    - { id: a, text: { ko: "Standard에서 {{fact:ec2.efs.ia.default}} 동안 접근하지 않은 파일은 IA로, {{fact:ec2.efs.archive.default}} 동안 접근하지 않은 파일은 Archive로 옮겨진다" } }
    - { id: b, text: { ko: "IA의 파일을 한 번 읽으면 기본으로 바로 Standard로 돌아온다" } }
    - { id: c, text: { ko: "파일 이름과 디렉터리 구조 같은 메타데이터도 IA로 옮겨진다" } }
    - { id: d, text: { ko: "처리량 모드와 상관없이 Archive 클래스를 쓸 수 있다" } }
  answer: a
  explanation: { ko: "기본 수명 주기 정책은 Standard에서 마지막 접근 뒤 {{fact:ec2.efs.ia.default}}가 지나면 IA로, {{fact:ec2.efs.archive.default}}가 지나면 Archive로 옮긴다. b: 기본은 Standard로 되돌리지 않는다. 되돌리려면 '첫 접근 시' 정책을 따로 정한다. c: 메타데이터는 늘 Standard에 있다. d: Archive는 탄력적 처리량 모드에서만 지원된다." }
  facts: [ec2.efs.ia.default, ec2.efs.archive.default]

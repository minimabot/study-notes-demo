# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: ec2.q.networking-eni-failover
  type: quiz
  chapter: ec2/networking
  topic: ec2/networking/eni
  question: { ko: "라이선스가 MAC 주소에 묶인 상용 소프트웨어를 EC2 한 대에서 돌린다. 예산 때문에 로드 밸런서 없이, 인스턴스가 고장 나면 같은 가용 영역의 대기 인스턴스로 빨리 넘기고 싶다. 클라이언트는 프라이빗 IP로 접속한다. 가장 알맞은 방법은?" }
  choices:
    - { id: a, text: { ko: "보조 네트워크 인터페이스에 서비스 주소를 두고, 고장 나면 그 인터페이스를 대기 인스턴스에 붙인다" } }
    - { id: b, text: { ko: "고장 나면 기본 네트워크 인터페이스를 떼어 대기 인스턴스에 붙인다" } }
    - { id: c, text: { ko: "다른 가용 영역의 대기 인스턴스에 같은 네트워크 인터페이스를 붙인다" } }
    - { id: d, text: { ko: "고장 나면 DNS 레코드를 대기 인스턴스의 기본 프라이빗 IP로 바꾼다" } }
  answer: a
  explanation: { ko: "네트워크 인터페이스를 옮기면 프라이빗 IP, 탄력적 IP, MAC 주소가 함께 옮겨 가므로 라우팅이나 DNS를 바꾸지 않고 트래픽이 대기 인스턴스로 간다. b: 기본 네트워크 인터페이스는 떼어 낼 수 없다. c: 인터페이스는 같은 가용 영역의 인스턴스에만 붙는다. d: 동작은 하지만 MAC 주소가 바뀌어 라이선스 조건을 못 맞추고, DNS 캐시 때문에 전환이 늦을 수 있다." }
  facts: []

- id: ec2.q.networking-single-flow
  type: quiz
  chapter: ec2/networking
  topic: ec2/networking/bandwidth-ena
  question: { ko: "같은 가용 영역의 큰 인스턴스 두 대가 TCP 연결 하나로 대용량 파일을 복사한다. 두 인스턴스의 사양 대역폭은 훨씬 크지만 복사 속도가 {{fact:ec2.bw.single-flow}} 근처에서 멈춘다. 인스턴스는 배치 그룹에 없다. 설명과 대처로 가장 알맞은 것은?" }
  choices:
    - { id: a, text: { ko: "네트워크 인터페이스를 하나 더 붙이면 대역폭이 두 배가 된다" } }
    - { id: b, text: { ko: "배치 그룹 밖에서는 단일 흐름이 이 값으로 제한된다. 같은 클러스터 배치 그룹에 두거나, 지원 유형이면 ENA Express를 켜거나, 흐름을 여러 개로 나눈다" } }
    - { id: c, text: { ko: "인터넷 게이트웨이 한도에 걸린 것이므로 NAT 게이트웨이를 거치게 한다" } }
    - { id: d, text: { ko: "MTU를 {{fact:ec2.mtu.std}}로 낮추면 단일 흐름 한도가 풀린다" } }
  answer: b
  explanation: { ko: "클러스터 배치 그룹 밖 인스턴스 사이 단일 흐름(5-튜플)은 {{fact:ec2.bw.single-flow}}로 제한된다. 같은 클러스터 배치 그룹 안이면 {{fact:ec2.bw.single-flow.cpg}}, ENA Express를 켠 지원 인스턴스 사이면 {{fact:ec2.bw.single-flow.ena-express}}까지 오른다. 여러 흐름(멀티패스 TCP 등)으로 나누는 것도 문서가 든 방법이다. a: 인터페이스를 더 붙여도 대역폭은 늘지 않는다. c: 같은 가용 영역 사이 트래픽이라 인터넷 게이트웨이와 상관없다. d: MTU를 낮추는 것은 단일 흐름 한도와 상관없고 오히려 패킷 효율이 떨어진다." }
  facts: [ec2.bw.single-flow, ec2.bw.single-flow.cpg, ec2.bw.single-flow.ena-express]

- id: ec2.q.networking-spread-limit
  type: quiz
  chapter: ec2/networking
  topic: ec2/networking/placement-groups
  question: { ko: "한 리전의 가용 영역 하나에 분산 배치 그룹을 만들고 인스턴스를 하나씩 띄우는데, 몇 대째부터 시작이 실패한다. 이 가용 영역에 같은 역할의 인스턴스를 더 두되 하드웨어 고장이 겹치지 않게 하려면?" }
  choices:
    - { id: a, text: { ko: "같은 분산 배치 그룹에서 할당량 증가를 요청한다" } }
    - { id: b, text: { ko: "클러스터 배치 그룹으로 바꾼다" } }
    - { id: c, text: { ko: "분산 배치 그룹을 하나 더 만들어 나머지 인스턴스를 그곳에 띄운다" } }
    - { id: d, text: { ko: "인스턴스 유형을 하나로 통일하면 한도가 늘어난다" } }
  answer: c
  explanation: { ko: "랙 수준 분산 배치 그룹은 가용 영역마다 실행 중인 인스턴스를 최대 {{fact:ec2.pg.spread.per-az}}까지만 둔다. 더 필요하면 분산 배치 그룹을 여러 개 쓰라고 문서가 권한다. 그룹 사이의 분산은 보장되지 않지만 각 그룹 안에서는 분산된다. a: 이 한도는 할당량 증가로 늘리는 값으로 문서에 나오지 않는다. b: 클러스터는 한곳에 모으는 전략이라 목적과 반대다. d: 분산 배치 그룹은 유형을 섞어도 되며, 유형이 한도에 영향을 주지 않는다." }
  facts: [ec2.pg.spread.per-az]

- id: ec2.d.networking-placement
  type: design
  chapter: ec2/networking
  topic: ec2/networking/placement-groups
  scenario: { ko: "한 회사가 같은 리전에서 세 가지 워크로드를 EC2로 옮긴다. (가) 유체 해석 MPI 작업: 노드 {{raw:64대}}가 계산 내내 서로 작은 메시지를 주고받는다. 작업은 몇 시간 돌고, 노드 하나가 죽으면 체크포인트에서 다시 시작하면 된다. (나) HDFS와 비슷한 자체 분산 스토리지: 데이터 노드 수백 대, 복제본을 서로 다른 장애 영역에 두는 기능이 있다. 노드 수는 계속 늘어난다. (다) 사내 인증 서버 {{raw:3대}}: 셋 중 둘이 살아 있어야 서비스가 된다. 같은 하드웨어 고장으로 두 대가 함께 죽으면 안 된다. 알맞은 설계를 모두 고르라." }
  choices:
    - { id: a, text: { ko: "(가)는 한 가용 영역의 클러스터 배치 그룹에, 같은 인스턴스 유형으로 한 번의 시작 요청으로 띄운다. EFA를 지원하는 유형을 고른다" } }
    - { id: b, text: { ko: "(가)의 용량을 확실히 잡으려고 클러스터 배치 그룹 안에 온디맨드 용량 예약을 만든다" } }
    - { id: c, text: { ko: "(가)를 세 가용 영역에 걸친 분산 배치 그룹에 띄운다" } }
    - { id: d, text: { ko: "(나)는 파티션 배치 그룹에 띄우고, 인스턴스 메타데이터의 파티션 번호를 스토리지의 장애 영역 정보로 넘겨 복제본을 서로 다른 파티션에 둔다" } }
    - { id: e, text: { ko: "(나)를 분산 배치 그룹 하나에 모두 띄운다" } }
    - { id: f, text: { ko: "(다)는 분산 배치 그룹에 두고, 가능하면 서로 다른 가용 영역에 한 대씩 둔다" } }
    - { id: g, text: { ko: "(다)를 (가)와 같은 클러스터 배치 그룹에 넣어 지연을 줄인다" } }
  answer_set: [a, b, d, f]
  rubric:
    ko:
      - "a, b, d, f를 모두 고르면 정답이다."
      - "a: 결합이 강한 HPC는 노드 사이 지연이 가장 중요하다. 클러스터 배치 그룹은 한 가용 영역 안 같은 고대역 구간에 놓고, 단일 흐름 한도도 {{fact:ec2.bw.single-flow.cpg}}로 올린다. 같은 유형을 한 번에 띄우라는 것이 문서 권장이다. MPI 통신에는 EFA의 OS 우회가 맞다."
      - "b: 클러스터 배치 그룹은 용량 부족 오류가 나기 쉽다. 문서는 그룹 안에 온디맨드 용량 예약을 만들라고 권한다. 영역 예약 인스턴스로는 배치 그룹 안 용량을 잡지 못한다."
      - "d: 파티션 배치 그룹은 파티션마다 랙을 따로 쓰고, 어떤 인스턴스가 어느 파티션에 있는지 보여 준다. HDFS·Cassandra 같은 토폴로지 인식 시스템이 이를 복제 배치에 쓴다. 인스턴스 수는 계정 한도만 따르므로 계속 늘어나는 수백 대에도 맞다."
      - "f: 분산 배치 그룹은 소수의 중요한 인스턴스를 각각 다른 랙에 둔다. 가용 영역당 {{fact:ec2.pg.spread.per-az}} 한도 안이다. 여러 가용 영역에 걸치면 가용 영역 장애도 견딘다."
      - "c는 감점: 분산 배치는 노드를 떨어뜨려 놓아 MPI의 지연이 커진다. 노드 수도 가용 영역당 한도를 넘는다."
      - "e는 감점: 분산 배치 그룹은 가용 영역당 {{fact:ec2.pg.spread.per-az}}까지라 수백 대를 담지 못한다."
      - "g는 감점: 인스턴스는 한 배치 그룹에만 속하고, 클러스터는 한곳에 모아 상관 장애가 커진다. 인증 서버의 요구와 반대다."
  facts: [ec2.bw.single-flow.cpg, ec2.pg.spread.per-az, ec2.pg.partition.per-az]

# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: ec2.q.ebs-snapshots-share-encrypted
  type: quiz
  chapter: ec2/ebs-snapshots
  topic: ec2/ebs-snapshots/copy-share
  question: { ko: "기본 암호화(aws/ebs 키)가 켜진 계정의 EBS 스냅샷을 감사용 백업 계정과 공유하려는데 공유가 되지 않는다. 가장 알맞은 조치는?" }
  choices:
    - { id: a, text: { ko: "스냅샷을 공개로 공유한 뒤 백업 계정에서 복사한다" } }
    - { id: b, text: { ko: "스냅샷을 고객 관리형 KMS 키로 다시 암호화해 복사하고, 그 복사본과 키를 백업 계정에 공유한다" } }
    - { id: c, text: { ko: "스냅샷의 암호화를 해제한 뒤 공유한다" } }
    - { id: d, text: { ko: "aws/ebs 키의 키 정책에 백업 계정을 추가한다" } }
  answer: b
  explanation: { ko: "AWS 관리형 키로 암호화된 스냅샷은 공유할 수 없고, 고객 관리형 키로 암호화된 스냅샷만 공유된다. 복사할 때 다른 KMS 키를 지정해 다시 암호화할 수 있고(이때 전체 복사), 공유받는 계정에 그 키도 공유해야 한다. a: 암호화된 스냅샷은 공개 공유가 안 되고, 공개는 데이터 노출 위험이 크다. c: 암호화된 스냅샷의 암호화는 없앨 수 없다. d: AWS 관리형 키의 정책은 고객이 바꿀 수 없다." }
  facts: []

- id: ec2.q.ebs-snapshots-archive
  type: quiz
  chapter: ec2/ebs-snapshots
  topic: ec2/ebs-snapshots/archive-protect
  question: { ko: "규정상 매달 말 스냅샷을 몇 년 보관해야 하고, 거의 복원하지 않는다. 복원이 필요하면 며칠 기다려도 된다. 매일 스냅샷은 일주일만 둔다. 비용을 가장 줄이는 방법은?" }
  choices:
    - { id: a, text: { ko: "매일 스냅샷까지 모두 아카이브 계층으로 옮긴다" } }
    - { id: b, text: { ko: "월말 스냅샷만 스냅샷 아카이브로 옮기고, 매일 스냅샷은 표준 계층에 둔 뒤 기간이 지나면 지운다" } }
    - { id: c, text: { ko: "월말 스냅샷에 빠른 스냅샷 복원을 켜 둔다" } }
    - { id: d, text: { ko: "월말 스냅샷을 휴지통에 넣어 둔다" } }
  answer: b
  explanation: { ko: "스냅샷 아카이브는 {{fact:ec2.archive.min-days}} 이상 보관하고 거의 꺼내지 않는 스냅샷의 저장 비용을 크게 낮춘다. 복원에는 최대 {{fact:ec2.archive.restore.max}} 걸릴 수 있다. 문서는 월·분기·연 단위 스냅샷을 아카이브하라고 권한다. a: 아카이브하면 전체 스냅샷으로 바뀌고 최소 보관 기간 요금도 있어, 짧게 두는 매일 스냅샷은 오히려 비싸질 수 있다. c: 빠른 스냅샷 복원은 켜 둔 시간만큼 과금되는 복원 성능 기능이다. d: 휴지통은 지운 리소스를 잠시 되살리는 기능이고 보존 기간도 최대 {{fact:ec2.rbin.ami.retention.max}}다." }
  facts: [ec2.archive.min-days, ec2.archive.restore.max, ec2.rbin.ami.retention.max]

- id: ec2.q.ebs-snapshots-app-consistent
  type: quiz
  chapter: ec2/ebs-snapshots
  topic: ec2/ebs-snapshots/automation
  question: { ko: "EC2의 자체 관리 PostgreSQL을 매일 백업한다. 운영팀은 스냅샷을 수동으로 만들고 있고, 복원했을 때 데이터베이스가 복구 모드로 오래 도는 일이 있었다. 운영 부담을 줄이면서 애플리케이션 일관성 스냅샷을 자동으로 만들려면?" }
  choices:
    - { id: a, text: { ko: "Data Lifecycle Manager의 인스턴스 대상 정책에서 사전·사후 스크립트(Systems Manager 문서)를 켜 스냅샷 전후로 데이터베이스를 멈추고 푼다" } }
    - { id: b, text: { ko: "볼륨을 st1으로 바꾸면 스냅샷이 애플리케이션 일관성을 갖는다" } }
    - { id: c, text: { ko: "다중 볼륨 스냅샷을 쓰면 애플리케이션 캐시까지 스냅샷에 들어간다" } }
    - { id: d, text: { ko: "스냅샷을 다른 리전으로 복사하면 일관성이 맞춰진다" } }
  answer: a
  explanation: { ko: "DLM은 Systems Manager 명령 문서의 사전·사후 스크립트로 스냅샷 전에 앱을 멈추고 끝나면 다시 푸는 방식으로 애플리케이션 일관성 스냅샷을 자동화한다. MySQL·PostgreSQL 같은 자체 관리 데이터베이스용 템플릿이 있다. b: 볼륨 유형은 일관성과 상관없다. c: 다중 볼륨 스냅샷은 여러 볼륨을 같은 시점으로 맞춘 크래시 일관성 스냅샷이고, 메모리 캐시는 들어가지 않는다. d: 복사는 내용을 그대로 옮길 뿐이다." }
  facts: []

# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: kinesis.q.consumers-shared-limit
  type: quiz
  chapter: kinesis/consumers
  topic: kinesis/consumers/shared-vs-efo
  question: { ko: "샤드 하나짜리 스트림을 공유 처리량 소비자 애플리케이션 {{raw:4개}}가 각자 GetRecords로 읽는다. 다섯 번째 애플리케이션을 더하자 모든 애플리케이션의 지연이 늘고 ProvisionedThroughputExceededException이 보이기 시작했다. 기존 애플리케이션의 성능을 건드리지 않고 새 애플리케이션을 더하려면?" }
  choices:
    - { id: a, text: { ko: "새 애플리케이션의 폴링 간격을 줄여 더 자주 읽게 한다" } }
    - { id: b, text: { ko: "새 애플리케이션을 향상된 팬아웃 소비자로 등록해 SubscribeToShard로 읽게 한다" } }
    - { id: c, text: { ko: "새 애플리케이션의 GetRecords 한 번에 읽는 레코드 수를 최대로 올린다" } }
    - { id: d, text: { ko: "KCL 작업자 수를 샤드 수보다 많게 늘린다" } }
  answer: b
  explanation: { ko: "공유 처리량에서는 샤드당 {{fact:kinesis.shard.read}}와 GetRecords {{fact:kinesis.getrecords.tps}}를 모든 애플리케이션이 나눠 쓴다. 향상된 팬아웃 소비자는 샤드마다 {{fact:kinesis.efo.throughput}}를 따로 받으므로 기존 소비자의 몫을 줄이지 않는다. 더 자주 폴링하면(a) 호출 한도에 더 빨리 걸린다. 한 번에 많이 읽으면(c) 바이트 몫을 더 가져가고, 최대 크기를 받으면 {{fact:kinesis.getrecords.cooldown}} 동안 다음 호출이 막힌다. 작업자를 샤드보다 많이 두어도(d) 남는 작업자는 놀 뿐이다." }
  facts: [kinesis.shard.read, kinesis.getrecords.tps, kinesis.efo.throughput, kinesis.getrecords.cooldown]

- id: kinesis.q.consumers-lambda-poison
  type: quiz
  chapter: kinesis/consumers
  topic: kinesis/consumers/lambda
  question: { ko: "Kinesis 이벤트 소스 매핑을 기본 설정으로 둔 Lambda 함수가 형식이 깨진 레코드 하나 때문에 계속 오류를 낸다. 그 샤드의 IteratorAge만 계속 오르고 다른 샤드는 정상이다. 나쁜 레코드를 따로 남기고 샤드 처리를 다시 흐르게 하는 설정 조합은?" }
  choices:
    - { id: a, text: { ko: "배치 크기를 최대로 올리고 배치 기간을 늘린다" } }
    - { id: b, text: { ko: "BisectBatchOnFunctionError를 켜고, 최대 재시도 횟수를 제한하고, 실패 시 대상(SQS 큐 등)을 지정한다" } }
    - { id: c, text: { ko: "병렬화 계수를 최댓값으로 올리면 나쁜 레코드를 건너뛰고 나머지를 처리한다" } }
    - { id: d, text: { ko: "시작 위치를 LATEST로 바꿔 매핑을 다시 만든다" } }
  answer: b
  explanation: { ko: "Lambda는 샤드의 레코드를 순서대로 처리하므로 오류가 난 배치를 다시 시도하는 동안 그 샤드는 멈춘다. 기본값은 재시도와 레코드 나이에 제한이 없다. 배치 이등분은 나쁜 레코드를 좁혀 가고(재시도 횟수를 쓰지 않는다), 재시도 제한(최대 {{fact:kinesis.lambda.retry.max}} 범위에서 작게)으로 결국 배치를 버리게 하며, 실패 시 대상에 그 배치 정보를 남긴다. 배치를 키우면(a) 나쁜 레코드가 섞인 배치만 커진다. 병렬화 계수(c)는 처리 속도를 올릴 뿐 오류 배치를 건너뛰지 않는다. LATEST(d)는 밀린 레코드를 통째로 버린다." }
  facts: [kinesis.lambda.retry.max, kinesis.lambda.record-age.max, kinesis.lambda.parallelization.max]

- id: kinesis.q.consumers-iterator-age
  type: quiz
  chapter: kinesis/consumers
  topic: kinesis/consumers/troubleshooting
  question: { ko: "보존 기간을 기본값으로 둔 스트림에서 GetRecords.IteratorAgeMilliseconds가 며칠째 꾸준히 오르고 있고, 이미 보존 기간의 절반을 넘었다. 가장 먼저 할 일은?" }
  choices:
    - { id: a, text: { ko: "보존 기간을 늘려 처리 전에 레코드가 만료되지 않게 한 뒤, 처리 병목을 찾는다" } }
    - { id: b, text: { ko: "소비자를 재시작해 이터레이터를 새로 받는다" } }
    - { id: c, text: { ko: "생산자의 PutRecords 재시도를 끈다" } }
    - { id: d, text: { ko: "일시적인 하류 장애이므로 지켜보기만 한다" } }
  answer: a
  explanation: { ko: "이터레이터 나이가 {{fact:kinesis.iterator-age.risk}}를 넘으면 레코드가 처리 전에 만료될 위험이 있다. 기본 보존 기간은 {{fact:kinesis.retention.default}}다. 급한 대로 보존 기간을 늘리고(최대 {{fact:kinesis.retention.max}}), 그다음 처리 시간·블로킹 호출·자원·샤드 수를 살핀다. 재시작(b)은 체크포인트부터 다시 읽을 뿐 처리 속도를 올리지 않는다. 생산자 재시도(c)는 소비 지연과 관계없다. 꾸준한 증가는 일시적 문제가 아니라 처리 속도가 따라가지 못한다는 신호다(d)." }
  facts: [kinesis.iterator-age.risk, kinesis.retention.default, kinesis.retention.max]

- id: kinesis.d.consumers-clickstream-fanout
  type: design
  chapter: kinesis/consumers
  topic: kinesis/consumers/shared-vs-efo
  scenario: { ko: "웹사이트 클릭스트림이 Kinesis 데이터 스트림(프로비저닝 모드)에 들어온다. 네 팀이 같은 데이터를 읽어야 한다. (1) 추천팀: 클릭 직후 개인화 결과를 바꿔야 해서 지연이 가장 짧아야 한다. (2) 사기 탐지팀: Lambda로 의심 패턴을 실시간으로 찾는다. 역시 지연이 짧아야 한다. (3) 분석팀: 원본을 S3 데이터 레이크에 쌓으면 되고, 몇 분 늦어도 괜찮다. (4) 운영팀: 대시보드용으로 가끔 읽는다. 팀이 늘 때마다 다른 팀의 지연이 늘어나서는 안 된다. 알맞은 구성을 모두 고르라." }
  choices:
    - { id: a, text: { ko: "추천팀은 향상된 팬아웃 소비자로 등록하고 KCL 2.x 이상으로 SubscribeToShard를 쓴다" } }
    - { id: b, text: { ko: "사기 탐지팀의 Lambda 이벤트 소스 매핑은 등록한 향상된 팬아웃 소비자의 ARN으로 만든다" } }
    - { id: c, text: { ko: "분석팀은 이 스트림을 원본으로 하는 Amazon Data Firehose로 S3에 전달한다" } }
    - { id: d, text: { ko: "모든 팀을 공유 처리량 소비자로 두고, 각 팀이 폴링 간격을 {{fact:kinesis.poll.min-safe-interval}}보다 짧게 잡아 지연을 줄인다" } }
    - { id: e, text: { ko: "팀마다 생산자가 같은 데이터를 별도 스트림에 한 번씩 더 쓴다" } }
    - { id: f, text: { ko: "추천팀의 지연을 줄이려고 Firehose를 거쳐 데이터를 받게 한다" } }
  answer_set: [a, b, c]
  rubric:
    ko:
      - "a, b, c를 모두 고르면 정답이다."
      - "a: 향상된 팬아웃 소비자는 샤드마다 {{fact:kinesis.efo.throughput}}를 따로 받고, 푸시 방식이라 전파 지연이 소비자 수와 상관없이 {{fact:kinesis.efo.latency}} 수준이다. 팀이 늘어도 다른 팀에 영향이 없다."
      - "b: Lambda도 향상된 팬아웃 소비자를 이벤트 소스로 쓸 수 있다. 공유 처리량 매핑은 다른 소비자와 읽기 처리량을 나눠 쓴다."
      - "c: 몇 분 늦어도 되는 S3 적재는 코드 없이 Firehose로 충분하다. Firehose를 공유 처리량 쪽에 두면 향상된 팬아웃 비용도 아낀다. 운영팀의 가끔 하는 읽기도 공유 처리량으로 둘 수 있다."
      - "향상된 팬아웃 등록은 스트림당 {{fact:kinesis.efo.consumers.max}}까지이고, 데이터 검색 요금과 소비자-샤드 시간 요금이 든다. 지연이 중요한 팀에만 쓰는 것이 설계의 핵심이다."
      - "d는 감점: 공유 처리량 소비자는 샤드당 {{fact:kinesis.shard.read}}와 GetRecords {{fact:kinesis.getrecords.tps}}를 합으로 나눠 쓴다. 폴링을 {{fact:kinesis.poll.min-safe-interval}}보다 짧게 하면 호출 한도에 걸려 예외와 백오프로 지연이 오히려 커진다. 소비자가 다섯이면 평균 지연이 {{fact:kinesis.shared.latency.five}}까지 오른다."
      - "e는 감점: 같은 데이터를 여러 번 쓰면 쓰기 용량과 비용이 늘고, 스트림 사이 일관성을 따로 맞춰야 한다. 팬아웃은 소비자 쪽에서 푼다."
      - "f는 감점: Firehose는 버퍼링한 뒤 전달하는 서비스라 지연이 가장 짧아야 하는 용도에 맞지 않는다."
  facts: [kinesis.efo.throughput, kinesis.efo.latency, kinesis.efo.consumers.max, kinesis.shard.read, kinesis.getrecords.tps, kinesis.poll.min-safe-interval, kinesis.shared.latency.five]

# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: kinesis.q.cost-put-units
  type: quiz
  chapter: kinesis/cost
  topic: kinesis/cost/checklist
  question: { ko: "서울 리전 프로비저닝 스트림에 평균 {{raw:1 KB}}짜리 센서 레코드를 초당 {{raw:3,000건}} PutRecords로 넣는다. 데이터 양은 그대로 두고 비용을 가장 확실하게 줄이는 변경은?" }
  choices:
    - { id: a, text: { ko: "생산자를 KPL로 바꾸고 집계를 켜서 작은 레코드를 묶어 보낸다" } }
    - { id: b, text: { ko: "PutRecords를 PutRecord 단건 호출로 바꾼다" } }
    - { id: c, text: { ko: "소비자를 향상된 팬아웃으로 바꾼다" } }
    - { id: d, text: { ko: "보존 기간을 {{fact:kinesis.retention.extended-tier}}로 늘린다" } }
  answer: a
  explanation: { ko: "PUT 페이로드 단위는 레코드마다 {{fact:kinesis.price.put-unit.size}} 조각으로 세므로 작은 레코드도 한 건에 한 단위다. 집계로 묶으면 단위 수가 크게 줄고, 레코드 수 한도({{fact:kinesis.shard.write-records}})에 걸려 늘렸던 샤드도 줄일 수 있다(a). PutRecord 단건(b)은 레코드 수가 같아 단위 수가 줄지 않고 호출만 는다. 향상된 팬아웃(c)은 소비자-샤드 시간과 조회 요금이 더 붙는다. 보존 기간을 늘리면(d) 모든 샤드 시간에 연장 보존 요금이 붙는다." }
  facts: [kinesis.price.put-unit.size, kinesis.price.put-unit.apne2, kinesis.shard.write-records, kinesis.price.extended-shard-hour.apne2]

- id: kinesis.q.cost-efo-charges
  type: quiz
  chapter: kinesis/cost
  topic: kinesis/cost/fanout-retention
  question: { ko: "샤드 {{raw:10개}}인 프로비저닝 스트림에 향상된 팬아웃 소비자 {{raw:3개}}를 등록했다. 새로 붙는 요금을 옳게 설명한 것은?" }
  choices:
    - { id: a, text: { ko: "소비자 수만큼 스트림 시간 요금이 붙는다" } }
    - { id: b, text: { ko: "소비자 {{raw:3개}} × 샤드 {{raw:10개}}의 소비자-샤드 시간 요금과, 소비자들이 읽은 GB만큼의 조회 요금이 붙는다" } }
    - { id: c, text: { ko: "추가 요금은 없고, 읽기 용량이 모자라 샤드를 늘려야 한다" } }
    - { id: d, text: { ko: "읽은 GB만큼 조회 요금만 붙고 시간 요금은 없다" } }
  answer: b
  explanation: { ko: "프로비저닝 모드의 향상된 팬아웃은 소비자-샤드 시간({{fact:kinesis.price.efo-shard-hour.apne2}}, 서울)과 조회 GB({{fact:kinesis.price.efo-retrieval.apne2}}, 서울) 두 가지로 낸다(b). 스트림 시간(a)은 온디맨드 표준의 항목이다. 향상된 팬아웃 소비자는 샤드마다 {{fact:kinesis.efo.throughput}}를 따로 받으므로 읽기 때문에 샤드를 늘릴 필요가 없다(c). 시간 요금이 없는 것(d)은 온디맨드 표준의 향상된 팬아웃이다." }
  facts: [kinesis.price.efo-shard-hour.apne2, kinesis.price.efo-retrieval.apne2, kinesis.efo.throughput, kinesis.price.od.efo-retrieval.apne2]

- id: kinesis.q.cost-retention
  type: quiz
  chapter: kinesis/cost
  topic: kinesis/cost/fanout-retention
  question: { ko: "프로비저닝 스트림의 보존 기간을 기본값({{fact:kinesis.retention.default}})에서 {{raw:3일}}로 늘렸다. 요금은 어떻게 바뀌는가?" }
  choices:
    - { id: a, text: { ko: "늘어난 기간에 저장된 GB만큼 GB-월 요금이 붙는다" } }
    - { id: b, text: { ko: "스트림의 모든 샤드 시간에 연장 보존 요금이 추가로 붙는다" } }
    - { id: c, text: { ko: "보존 기간 안의 데이터를 GetRecords로 읽을 때마다 조회 요금이 붙는다" } }
    - { id: d, text: { ko: "{{fact:kinesis.retention.extended-tier}}까지는 추가 요금이 없다" } }
  answer: b
  explanation: { ko: "프로비저닝 모드의 연장 보존은 저장량과 관계없이 모든 샤드 시간에 {{fact:kinesis.price.extended-shard-hour.apne2}}(서울)를 더한다(b). GB-월로 내는 것(a)은 온디맨드 표준의 연장 보존과 두 모드의 장기 보존이다. 기본·연장 보존 구간의 데이터 조회에는 요금이 없다(c). 장기 보존 데이터를 GetRecords로 읽을 때만 조회 요금이 붙는다. d는 연장 보존 요금을 빠뜨렸다." }
  facts: [kinesis.price.extended-shard-hour.apne2, kinesis.retention.default, kinesis.retention.extended-tier, kinesis.price.od.extended-retention.apne2]

- id: kinesis.d.cost-telemetry
  type: design
  chapter: kinesis/cost
  topic: kinesis/cost/checklist
  scenario: { ko: "서울 리전의 IoT 텔레메트리 스트림이다. 장치들이 평균 {{raw:0.5 KB}} 레코드를 하루 종일 초당 약 {{raw:4,000건}}으로 꾸준히 보낸다. 지난 석 달 동안 최고치가 평균의 {{raw:1.5배}}를 넘은 적이 없다. 지금은 온디맨드 표준 모드이고, 공유 처리량 소비자 애플리케이션 {{raw:2개}}가 읽는다. 혹시 몰라 보존 기간을 {{raw:7일}}로 늘려 두었는데, 소비자가 밀렸던 가장 긴 장애는 몇 시간이었다. 원본은 이미 Firehose로 S3에 따로 보관한다. 이 계정의 Kinesis 사용량은 이 스트림이 전부다. 기능 요구를 바꾸지 않고 비용을 줄이는 변경을 모두 고르라." }
  choices:
    - { id: a, text: { ko: "생산자에 KPL 집계를 적용해 작은 레코드를 묶어 보낸다" } }
    - { id: b, text: { ko: "트래픽이 꾸준하므로 최고치에 맞춘 샤드 수로 프로비저닝 모드로 바꾼다" } }
    - { id: c, text: { ko: "보존 기간을 장애 회복에 필요한 만큼(예: {{raw:1일}}이나 {{raw:2일}})으로 줄인다" } }
    - { id: d, text: { ko: "두 소비자를 모두 향상된 팬아웃으로 바꾼다" } }
    - { id: e, text: { ko: "On-demand Advantage를 켜서 단가를 낮춘다" } }
    - { id: f, text: { ko: "안전을 위해 프로비저닝 샤드를 최고치의 {{raw:4배}}로 잡아 둔다" } }
  answer_set: [a, b, c]
  rubric:
    ko:
      - "a, b, c를 모두 고르면 정답이다. a: 온디맨드에서는 레코드마다 {{fact:kinesis.price.od.ingest-rounding}}하므로 {{raw:0.5 KB}} 레코드는 두 배로 계산된다. 프로비저닝에서는 레코드마다 PUT 페이로드 단위를 하나씩 쓴다. 묶으면 두 경우 모두 청구량이 준다. 소비자는 집계 해제를 해야 한다."
      - "b: 트래픽이 꾸준하고 최고치가 낮아 샤드를 평균 가까이 맞출 수 있다. 샤드 시간({{fact:kinesis.price.shard-hour.apne2}})과 PUT 단위 요금이 수집·조회 GB 요금과 스트림 시간({{fact:kinesis.price.od.stream-hour.apne2}})보다 낮아진다. 공유 소비자 둘의 읽기도 샤드 읽기 용량({{fact:kinesis.shard.read}}) 안에서 샤드 시간에 들어 있다."
      - "c: 장애 회복에 필요한 기간보다 긴 보존은 연장 보존 요금만 늘린다. 프로비저닝으로 옮기면 연장 보존이 모든 샤드 시간에 붙으므로 효과가 더 크다. 원본은 S3에 있으므로 긴 보존이 필요 없다."
      - "d는 감점: 지연 요구가 없고 읽기 용량도 모자라지 않다. 향상된 팬아웃은 소비자-샤드 시간과 조회 요금을 더한다."
      - "e는 감점: 계정 사용량이 약정({{fact:kinesis.advantage.commit}})보다 작아 차액을 내게 된다."
      - "f는 감점: 최고치가 안정적인데 여유를 크게 잡으면 쓰지 않는 샤드 시간을 계속 낸다. 필요하면 UpdateShardCount로 늘린다."
  facts: [kinesis.price.od.ingest-rounding, kinesis.price.shard-hour.apne2, kinesis.price.od.stream-hour.apne2, kinesis.price.od.ingest.apne2, kinesis.advantage.commit]

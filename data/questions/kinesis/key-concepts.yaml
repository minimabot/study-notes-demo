# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: kinesis.q.key-concepts-ordering
  type: quiz
  chapter: kinesis/key-concepts
  topic: kinesis/key-concepts/partition-key
  question: { ko: "주문 이벤트(생성, 결제, 배송)를 KDS에 넣는다. 같은 주문의 이벤트는 넣은 순서대로 처리되어야 하고, 주문끼리는 나란히 처리해도 된다. 파티션 키로 가장 알맞은 것은?" }
  choices:
    - { id: a, text: { ko: "레코드마다 무작위 값" } }
    - { id: b, text: { ko: "주문 ID" } }
    - { id: c, text: { ko: "모든 레코드에 같은 고정 문자열" } }
    - { id: d, text: { ko: "이벤트 종류(생성, 결제, 배송)" } }
  answer: b
  explanation: { ko: "같은 파티션 키는 MD5 해시 값이 같아 늘 같은 샤드로 가고, 샤드 안에서는 시퀀스 번호 순으로 읽힌다. 주문 ID를 키로 쓰면 주문별 순서를 지키면서 주문들은 여러 샤드에 퍼진다. 무작위 값(a)은 한 주문의 이벤트가 여러 샤드로 흩어져 순서가 깨진다. 고정 문자열(c)은 모든 레코드가 샤드 하나에 몰려 그 샤드의 쓰기 한도({{fact:kinesis.shard.write}})가 스트림 전체의 한도가 된다. 이벤트 종류(d)는 키가 셋뿐이라 몰리고, 한 주문의 생성·결제·배송이 서로 다른 샤드로 가서 순서도 보장되지 않는다." }
  facts: [kinesis.shard.write]

- id: kinesis.q.key-concepts-shard-write
  type: quiz
  chapter: kinesis/key-concepts
  topic: kinesis/key-concepts/stream-shard
  question: { ko: "프로비저닝된 모드 스트림의 샤드 하나에 대한 설명으로 옳은 것은?" }
  choices:
    - { id: a, text: { ko: "최대 레코드 크기를 {{fact:kinesis.record.max-size}}로 올리면 샤드의 지속 쓰기 용량도 그만큼 늘어난다" } }
    - { id: b, text: { ko: "쓰기 한도는 {{fact:kinesis.shard.write}}이고, 두 조건 중 먼저 닿는 쪽에서 스로틀된다. 큰 레코드는 일시 버스트로 받지만 이 한도는 그대로다" } }
    - { id: c, text: { ko: "쓰기 한도는 파티션 키를 빼고 데이터 blob 크기만 센다" } }
    - { id: d, text: { ko: "공유 팬아웃 소비자는 소비자마다 {{fact:kinesis.shard.read}}의 전용 읽기 용량을 받는다" } }
  answer: b
  explanation: { ko: "샤드 쓰기 한도는 {{fact:kinesis.shard.write}}이며 파티션 키도 포함해 센다(c는 틀림). 큰 레코드(최대 {{fact:kinesis.record.max-size}})는 잠깐 버스트해서 받고 용량이 다시 차오르는 방식이라, 샤드 처리량 한도는 바뀌지 않는다(a는 틀림). 공유 팬아웃 소비자들은 샤드의 읽기 용량을 나눠 쓴다. 소비자별 전용 용량({{fact:kinesis.efo.throughput}})은 향상된 팬아웃 소비자의 특징이다(d는 틀림)." }
  facts: [kinesis.shard.write, kinesis.shard.read, kinesis.record.max-size, kinesis.efo.throughput]

- id: kinesis.q.key-concepts-retention
  type: quiz
  chapter: kinesis/key-concepts
  topic: kinesis/key-concepts/retention
  question: { ko: "보존 기간을 기본값으로 둔 스트림에서, 소비자 애플리케이션이 장애로 {{raw:3일}} 동안 멈췄다가 복구되었다. 무슨 일이 생기나?" }
  choices:
    - { id: a, text: { ko: "소비자가 멈춘 동안 Kinesis가 레코드를 지우지 않고 기다리므로 잃은 데이터가 없다" } }
    - { id: b, text: { ko: "보존 기간({{fact:kinesis.retention.default}})이 지난 레코드는 읽기 전이라도 사라졌다. 이런 공백을 견디려면 보존 기간을 미리 늘려 둔다" } }
    - { id: c, text: { ko: "시퀀스 번호로 지워진 레코드를 되살릴 수 있다" } }
    - { id: d, text: { ko: "보존 기간은 스트림을 만든 뒤에는 바꿀 수 없다" } }
  answer: b
  explanation: { ko: "레코드는 소비 여부와 관계없이 보존 기간이 지나면 사라진다(a는 틀림). 기본 보존 기간은 {{fact:kinesis.retention.default}}이고, IncreaseStreamRetentionPeriod로 최대 {{fact:kinesis.retention.max}}까지 늘릴 수 있다(d는 틀림, 기본값보다 길면 추가 요금). 시퀀스 번호는 순서 표시일 뿐 지워진 데이터를 되살리지 못한다(c)." }
  facts: [kinesis.retention.default, kinesis.retention.max]

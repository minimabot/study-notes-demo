# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: kinesis.q.capacity-modes-shard-math
  type: quiz
  chapter: kinesis/capacity-modes
  topic: kinesis/capacity-modes/provisioned
  question: { ko: "프로비저닝 모드 스트림에 평균 {{raw:3.2 KB}} 레코드를 초당 {{raw:600건}} 쓴다. GetRecords를 쓰는 공유 처리량 소비자 애플리케이션 {{raw:3개}}가 모든 데이터를 읽는다. 키 분포가 고르다면 필요한 샤드 수는?" }
  choices:
    - { id: a, text: { ko: "{{raw:2개}}" } }
    - { id: b, text: { ko: "{{raw:3개}}" } }
    - { id: c, text: { ko: "{{raw:4개}}" } }
    - { id: d, text: { ko: "{{raw:8개}}" } }
  answer: c
  explanation: { ko: "레코드 크기를 올림해 {{raw:4 KB}}로 본다. 쓰기는 {{raw:4 KB}} × {{raw:600건}} = {{raw:2,400 KB/s}}이고, 샤드 쓰기 용량({{fact:kinesis.shard.write}})으로 나누면 올림해 {{raw:3개}}가 필요하다. 레코드 수({{fact:kinesis.shard.write-records}} 기준)로는 {{raw:1개}}면 된다. 읽기는 공유 소비자 셋이 함께 쓰므로 {{raw:2,400 KB/s}} × 소비자 셋 = {{raw:7,200 KB/s}}이고, 샤드 공유 읽기 용량({{fact:kinesis.shard.read}})으로 나누면 올림해 {{raw:4개}}다. 가장 큰 값인 {{raw:4개}}가 답이다. b는 읽기를 빠뜨렸고, a는 레코드 크기를 올림하지 않고 쓰기만 본 값에 가깝다. d는 소비자마다 샤드를 따로 잡은 값이다." }
  facts: [kinesis.shard.write, kinesis.shard.write-records, kinesis.shard.read]

- id: kinesis.q.capacity-modes-ondemand-peak
  type: quiz
  chapter: kinesis/capacity-modes
  topic: kinesis/capacity-modes/on-demand
  question: { ko: "온디맨드 표준 모드 스트림의 쓰기가 최근 한 달 내내 {{raw:20~50 MB/s}}였다. 어느 날 {{raw:5분}} 만에 {{raw:150 MB/s}}로 뛰었고, 파티션 키는 고르게 퍼져 있다. 가장 그럴듯한 결과와 대응은?" }
  choices:
    - { id: a, text: { ko: "온디맨드는 한도 없이 즉시 늘어나므로 아무 일도 없다" } }
    - { id: b, text: { ko: "이전 최고치의 {{fact:kinesis.ondemand.peak-multiplier}}를 짧은 시간에 넘었으므로 한동안 쓰기 예외가 날 수 있고, 생산자는 실패한 요청을 재시도해야 한다" } }
    - { id: c, text: { ko: "온디맨드 스트림에 UpdateShardCount를 호출해 샤드를 즉시 늘린다" } }
    - { id: d, text: { ko: "키가 고르게 퍼져 있으므로 예외는 날 수 없고, 났다면 IAM 권한 문제다" } }
  answer: b
  explanation: { ko: "온디맨드 표준은 최근 {{fact:kinesis.ondemand.peak-lookback}}의 최고 쓰기 처리량의 {{fact:kinesis.ondemand.peak-multiplier}}까지만 바로 받는다. 그보다 큰 증가가 {{fact:kinesis.ondemand.throttle-window}} 안에 오면 키가 고르게 퍼져 있어도 예외가 날 수 있고, AWS는 이런 요청을 재시도하라고 권장한다(a, d는 틀림). UpdateShardCount는 프로비저닝 모드 전용이다(c는 틀림)." }
  facts: [kinesis.ondemand.peak-lookback, kinesis.ondemand.peak-multiplier, kinesis.ondemand.throttle-window]

- id: kinesis.q.capacity-modes-hot-key
  type: quiz
  chapter: kinesis/capacity-modes
  topic: kinesis/capacity-modes/on-demand
  question: { ko: "온디맨드 스트림에서 몇몇 파티션 키에 트래픽이 크게 몰려 쓰기 예외가 계속 난다. 키 하나의 트래픽은 샤드 한도 안에 있다. AWS 문서가 권장하는 방향은?" }
  choices:
    - { id: a, text: { ko: "프로비저닝 모드로 바꾸고, 트래픽이 몰리는 샤드를 원하는 해시 키 지점에서 나눈다" } }
    - { id: b, text: { ko: "온디맨드는 뜨거운 해시 키를 찾아 따로 떼어 내므로 기다린다" } }
    - { id: c, text: { ko: "보존 기간을 늘려 샤드 용량을 키운다" } }
    - { id: d, text: { ko: "공유 처리량 소비자를 향상된 팬아웃 소비자로 바꾼다" } }
  answer: a
  explanation: { ko: "온디맨드는 샤드 트래픽이 {{fact:kinesis.ondemand.split-threshold}}를 넘으면 샤드의 해시 키 범위를 똑같이 나눌 뿐, 트래픽을 몰고 오는 해시 키를 떼어 내지 않는다(b는 틀림). 그래서 키가 심하게 치우친 경우 AWS는 세밀한 분할이 되는 프로비저닝 모드를 권장한다. 보존 기간은 처리량과 무관하고(c), 향상된 팬아웃은 읽기 쪽 대책이라 쓰기 예외를 풀지 못한다(d)." }
  facts: [kinesis.ondemand.split-threshold, kinesis.shard.write]

- id: kinesis.d.capacity-modes-choose-mode
  type: design
  chapter: kinesis/capacity-modes
  topic: kinesis/capacity-modes/modes
  scenario: { ko: "회사에 Kinesis 데이터 스트림이 두 개 있다. (1) 모바일 앱의 클릭 이벤트 스트림은 푸시 알림이나 방송 노출 때마다 예고 없이 몇 배로 뛰고, 밤에는 거의 비어 있다. (2) 공장 센서 텔레메트리 스트림은 하루 내내 거의 일정하고, 센서 증설 계획이 분기별로 정해져 있어 증가를 예측할 수 있다. 다만 (2)에서는 장비 몇 대의 파티션 키로 트래픽이 몰려 특정 샤드에서 쓰기 예외가 난다(키 하나의 양은 샤드 한도 안이다). 운영팀은 비용 예측 가능성과 운영 부담을 모두 고려한다. 알맞은 설정을 모두 고르라." }
  choices:
    - { id: a, text: { ko: "(1)은 온디맨드 모드로 두고, 생산자가 스로틀된 요청을 재시도하도록 한다" } }
    - { id: b, text: { ko: "(2)는 프로비저닝 모드로 두고, 최고치 기준으로 계산한 샤드 수에 여유를 더해 시작한 뒤 증설 일정에 맞춰 UpdateShardCount로 단계적으로 늘린다" } }
    - { id: c, text: { ko: "(2)의 뜨거운 샤드는 SplitShard로 그 샤드만 골라 나누고, 차가운 샤드는 이웃 샤드와 병합한다" } }
    - { id: d, text: { ko: "(1)을 평균 트래픽에 맞춘 프로비저닝으로 두고, 급증이 올 때마다 UpdateShardCount로 샤드를 크게 늘렸다 줄인다" } }
    - { id: e, text: { ko: "(2)는 비용을 맞추려고 하루에도 여러 번 온디맨드와 프로비저닝을 오간다" } }
    - { id: f, text: { ko: "(2)의 뜨거운 샤드 문제는 UpdateShardCount로 전체 샤드 수를 두 배로 늘리는 것이 가장 비용 효율적이다" } }
  answer_set: [a, b, c]
  rubric:
    ko:
      - "a, b, c를 모두 고르면 정답이다."
      - "a: 예측하기 어렵고 놀고 있는 시간이 긴 트래픽은 샤드를 관리하지 않는 온디맨드가 맞다. 다만 이전 최고치의 {{fact:kinesis.ondemand.peak-multiplier}}를 {{fact:kinesis.ondemand.throttle-window}} 안에 넘으면 스로틀될 수 있으므로 재시도가 필요하다."
      - "b: 꾸준하고 예측 가능한 트래픽은 프로비저닝이 비용 예측에 유리하다. UpdateShardCount는 한 번에 {{fact:kinesis.usc.scale-up-max}}까지만 늘리므로 계획에 따라 단계적으로 올린다."
      - "c: 키가 치우친 스트림은 프로비저닝에서 뜨거운 샤드만 골라 나누는 것이 맞다. 온디맨드는 해시 키 범위를 똑같이 나눌 뿐 뜨거운 키를 떼어 내지 않는다."
      - "d는 감점: UpdateShardCount는 {{fact:kinesis.usc.daily-max}}, 한 번에 {{fact:kinesis.usc.scale-up-max}}로 제한되고 반영에 몇 분이 걸린다. 예고 없는 급증을 따라가지 못한다."
      - "e는 감점: 모드 전환은 {{fact:kinesis.mode-switch.max}}로 제한된다. 잦은 전환은 설계가 아니다."
      - "f는 감점: 모든 샤드를 늘리면 필요 없는 샤드까지 비용이 든다. 또 UpdateShardCount는 샤드를 균등하게 만들 뿐이라, 뜨거운 구간만 겨냥하지 못한다."
  facts: [kinesis.ondemand.peak-multiplier, kinesis.ondemand.throttle-window, kinesis.usc.scale-up-max, kinesis.usc.daily-max, kinesis.mode-switch.max]

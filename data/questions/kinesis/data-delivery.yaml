# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: kinesis.q.data-delivery-firehose-vs-s3
  type: quiz
  chapter: kinesis/data-delivery
  topic: kinesis/data-delivery/firehose
  question: { ko: "프로비저닝 모드 Kinesis 스트림의 이벤트를 Amazon Redshift에 적재하려 한다. 적재 전에 Lambda로 필드 몇 개를 가공해야 하고, 소비자 코드는 운영하고 싶지 않다. 알맞은 방법은?" }
  choices:
    - { id: a, text: { ko: "스트림에 CreateChannel로 S3 전송을 만들고 Redshift가 S3를 읽게 한다" } }
    - { id: b, text: { ko: "스트림을 원본으로 하는 Firehose 전송 스트림을 만들고, 변환을 켠 뒤 Redshift를 대상으로 지정한다" } }
    - { id: c, text: { ko: "스트리밍 테이블 전송으로 Iceberg 테이블을 만들고 그 테이블에서 필드를 가공한다" } }
    - { id: d, text: { ko: "EC2에 KCL 애플리케이션을 직접 띄워 Redshift에 쓴다" } }
  answer: b
  explanation: { ko: "Firehose는 Kinesis 스트림을 원본으로 받아 전달 전에 레코드를 변환하고 Redshift 같은 대상에 적재한다. 스트리밍 테이블·S3 전송은 온디맨드 스트림 전용이고 변환을 하지 않는다(a, c는 틀림). KCL 애플리케이션은 소비자 코드를 직접 운영하는 방법이라 요구에 맞지 않는다(d)." }
  facts: []

- id: kinesis.q.data-delivery-managed-key
  type: quiz
  chapter: kinesis/data-delivery
  topic: kinesis/data-delivery/managed-delivery
  question: { ko: "온디맨드 스트림에서 S3 전송을 만들려고 CreateChannel을 불렀더니 바로 실패했다. 스트림은 aws/kinesis 키로 암호화돼 있고, 대상 버킷은 같은 리전 같은 계정에 있다. 해결 방법은?" }
  choices:
    - { id: a, text: { ko: "스트림 암호화를 끈다. 전송은 암호화된 스트림을 지원하지 않는다" } }
    - { id: b, text: { ko: "StartStreamEncryption으로 스트림을 고객 관리형 키로 바꾼 뒤 다시 만든다" } }
    - { id: c, text: { ko: "스트림을 프로비저닝 모드로 바꾼다" } }
    - { id: d, text: { ko: "대상 버킷 암호화를 aws/kinesis 키로 맞춘다" } }
  answer: b
  explanation: { ko: "원본 스트림이 AWS 관리형 키(aws/kinesis)로 암호화돼 있으면 CreateChannel이 동기적으로 실패한다. 고객 관리형 키로 암호화한 스트림은 지원하므로 키만 바꾸면 된다(a는 틀림). 전송은 온디맨드 스트림 전용이라 프로비저닝으로 바꾸면 오히려 쓸 수 없다(c). aws/kinesis 키는 대상 암호화에도 쓸 수 없다(d)." }
  facts: []

- id: kinesis.q.data-delivery-backfill
  type: quiz
  chapter: kinesis/data-delivery
  topic: kinesis/data-delivery/managed-delivery
  question: { ko: "보존 기간에 걸쳐 데이터가 쌓여 있는 온디맨드 스트림에 오늘 스트리밍 테이블 전송을 만들었다. 데이터 최신성은 기본값이다. 다음 중 맞는 설명은?" }
  choices:
    - { id: a, text: { ko: "스트림에 남아 있는 과거 레코드부터 차례로 테이블에 채워진다" } }
    - { id: b, text: { ko: "전송이 활성 상태가 된 뒤 쓰인 레코드만, 최대 {{fact:kinesis.delivery.freshness.default}} 정도 버퍼링된 뒤 테이블에 들어간다" } }
    - { id: c, text: { ko: "기존 Iceberg 테이블을 대상으로 지정하면 과거 데이터를 이어서 받을 수 있다" } }
    - { id: d, text: { ko: "스키마를 나중에 바꾸면 테이블 스키마가 자동으로 진화한다" } }
  answer: b
  explanation: { ko: "전송은 백필을 하지 않으며, 활성 상태가 된 뒤의 레코드만 전달한다(a는 틀림). 데이터 최신성은 전달 전 최대 버퍼링 시간이고 기본값은 {{fact:kinesis.delivery.freshness.default}}, 범위는 {{fact:kinesis.delivery.freshness.range}}다. 스트리밍 테이블 전송은 늘 새 테이블을 만들며 기존 테이블에 쓸 수 없다(c). 스키마 진화는 지원하지 않아 전송을 지우고 다시 만들어야 한다(d)." }
  facts: [kinesis.delivery.freshness.default, kinesis.delivery.freshness.range]

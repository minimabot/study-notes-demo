# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: lambda.q.cost-memory-up
  type: quiz
  chapter: lambda/cost
  topic: lambda/cost/memory-duration
  question: { ko: "이미지 크기를 바꾸는 함수가 {{raw:512 MB}}에서 평균 {{raw:2,000 ms}} 걸린다. {{raw:1,536 MB}}로 올렸더니 평균 {{raw:600 ms}}가 됐다. 요청 수와 아키텍처는 같다. 실행 시간 요금은 어떻게 되는가?" }
  choices:
    - { id: a, text: { ko: "메모리가 세 배라 실행 시간 요금도 세 배가 된다" } }
    - { id: b, text: { ko: "GB-초가 {{raw:1 GB-초}}에서 {{raw:0.9 GB-초}}로 줄어 요금이 약간 줄고 응답도 빨라진다" } }
    - { id: c, text: { ko: "실행 시간 요금은 메모리와 관계없이 호출 시간으로만 정해지므로 크게 준다" } }
    - { id: d, text: { ko: "메모리를 늘리면 요청 단가가 오른다" } }
  answer: b
  explanation: { ko: "요금은 메모리(GB) × 실행 시간(초)이다. {{raw:0.5 GB}} × {{raw:2초}} = {{raw:1 GB-초}}, {{raw:1.5 GB}} × {{raw:0.6초}} = {{raw:0.9 GB-초}}다(b). 메모리에 비례해 CPU가 늘어 CPU를 많이 쓰는 작업은 실행 시간이 더 크게 줄 수 있다. 메모리만 보고 세 배라고 하면 실행 시간 감소를 빠뜨린다(a). 실행 시간 요금은 메모리를 곱한 값이다(c). 요청 단가({{fact:lambda.price.request.apne2}}, 서울)는 메모리와 관계없다(d)." }
  facts: [lambda.price.duration.x86.apne2, lambda.price.request.apne2, lambda.memory.one-vcpu]

- id: lambda.q.cost-provisioned
  type: quiz
  chapter: lambda/cost
  topic: lambda/cost/arm64-provisioned
  question: { ko: "서울 리전의 사내용 API 함수에 프로비저닝된 동시성 {{raw:20}}을 하루 종일 켜 두었다. 실제 호출은 업무 시간에만 몰리고 밤에는 거의 없다. 요금을 옳게 설명한 것은?" }
  choices:
    - { id: a, text: { ko: "호출이 없는 밤에는 프로비저닝된 동시성 요금이 붙지 않는다" } }
    - { id: b, text: { ko: "켜 둔 시간 내내 동시성 × 메모리만큼 유지 요금이 붙고, 무료 등급도 적용되지 않는다. 필요한 시간대에만 켜도록 일정을 거는 것이 맞다" } }
    - { id: c, text: { ko: "프로비저닝된 동시성을 쓰면 실행 시간 단가가 낮아지므로 서울에서도 항상 일반 호출보다 싸다" } }
    - { id: d, text: { ko: "프로비저닝된 동시성은 $LATEST에 걸어야 요금이 적게 나온다" } }
  answer: b
  explanation: { ko: "유지 요금({{fact:lambda.price.pc.x86.apne2}}, 서울 x86)은 호출과 관계없이 켜 둔 동안 붙고 {{fact:lambda.price.pc.rounding}}한다. 이 함수에는 무료 등급도 없다(b, a가 틀린 이유). 서울에서는 유지 요금과 PC 실행 단가({{fact:lambda.price.pc-duration.x86.apne2}})를 합하면 일반 실행 단가({{fact:lambda.price.duration.x86.apne2}})보다 조금 높아, 다 채워 써도 싸지지 않는다(c). 프로비저닝된 동시성은 버전이나 별칭에만 걸 수 있다(d)." }
  facts: [lambda.price.pc.x86.apne2, lambda.price.pc-duration.x86.apne2, lambda.price.duration.x86.apne2, lambda.price.pc.rounding]

- id: lambda.q.cost-arm64
  type: quiz
  chapter: lambda/cost
  topic: lambda/cost/arm64-provisioned
  question: { ko: "x86_64 Python 함수를 arm64로 바꿔 비용을 줄이려 한다. 함수는 이미지 처리용 네이티브 라이브러리가 든 계층을 쓴다. 먼저 할 일은?" }
  choices:
    - { id: a, text: { ko: "아키텍처 설정만 바꾸면 계층의 바이너리도 Lambda가 자동으로 변환한다" } }
    - { id: b, text: { ko: "계층의 네이티브 라이브러리를 arm64용으로 다시 빌드하고, 새 버전에 일부 트래픽만 보내 오류와 실행 시간을 비교한다" } }
    - { id: c, text: { ko: "Compute Optimizer의 arm64 메모리 권장값을 먼저 적용한다" } }
    - { id: d, text: { ko: "arm64는 요청 단가가 낮으므로 호출 수가 많을수록 효과가 크다는 점만 확인한다" } }
  answer: b
  explanation: { ko: "네이티브 바이너리가 든 의존성과 계층은 arm64용으로 다시 빌드해야 한다. 별칭 가중치로 일부 트래픽만 보내 비교하면 안전하다(b). 자동 변환은 없다(a). Compute Optimizer의 Lambda 메모리 권장은 x86_64 함수만 지원한다(c). arm64가 낮은 것은 GB-초 단가({{fact:lambda.price.duration.arm.apne2}}, 서울)이고 요청 단가는 같다(d)." }
  facts: [lambda.price.duration.arm.apne2, lambda.price.duration.x86.apne2, lambda.price.request.apne2]

- id: lambda.d.cost-api-backend
  type: design
  chapter: lambda/cost
  topic: lambda/cost/checklist
  scenario: { ko: "서울 리전의 주문 조회 API 함수다(Python, x86_64, 네이티브 의존성 없음). 메모리를 넉넉하게 {{raw:3,008 MB}}로 잡아 두었다. 로그의 REPORT 줄을 보면 Max Memory Used는 {{raw:180 MB}} 안팎이고, 평균 {{raw:120 ms}} 중 대부분은 DynamoDB 응답을 기다리는 시간이다. 콜드 스타트를 걱정해 프로비저닝된 동시성 {{raw:50}}을 하루 종일 켜 두었는데, 동시 실행 수는 업무 시간에도 {{raw:10}}을 넘지 않고 밤에는 거의 {{raw:0}}이다. 응답 지연 목표는 느슨해서 가끔 생기는 콜드 스타트는 받아들일 수 있다. 기능을 바꾸지 않고 비용을 줄이는 변경을 모두 고르라." }
  choices:
    - { id: a, text: { ko: "Power Tuning으로 여러 메모리 값을 재 보고, 실행 시간이 거의 변하지 않는 가장 작은 값으로 줄인다" } }
    - { id: b, text: { ko: "의존성을 확인한 뒤 arm64 버전을 만들어 일부 트래픽으로 시험하고 옮긴다" } }
    - { id: c, text: { ko: "프로비저닝된 동시성을 끄거나, 꼭 필요하면 업무 시간에 실제 사용량 수준으로만 켜도록 일정을 건다" } }
    - { id: d, text: { ko: "CPU를 더 받도록 메모리를 최댓값({{fact:lambda.memory.max}})으로 올린다" } }
    - { id: e, text: { ko: "제한 시간을 최댓값({{fact:lambda.timeout.max}})으로 늘려 재시도를 줄인다" } }
    - { id: f, text: { ko: "임시 스토리지를 늘려 DynamoDB 응답을 /tmp에 캐시한다" } }
  answer_set: [a, b, c]
  rubric:
    ko:
      - "a, b, c를 모두 고르면 정답이다. a: 기다리는 시간이 대부분이라 메모리를 줄여도 실행 시간이 거의 늘지 않는다. GB-초가 메모리에 비례해 줄어든다. Compute Optimizer도 x86_64 함수라 권장값을 볼 수 있다."
      - "b: 순수 Python이라 옮기기 쉽고 arm64의 GB-초 단가({{fact:lambda.price.duration.arm.apne2}})가 x86_64({{fact:lambda.price.duration.x86.apne2}})보다 낮다. 프로비저닝된 동시성 단가도 arm64가 낮다."
      - "c: 유지 요금({{fact:lambda.price.pc.x86.apne2}})은 쓰지 않아도 켜 둔 내내 붙는다. 사용률이 낮고 지연 목표가 느슨하므로 끄는 것이 가장 크다. 끄면 무료 등급도 다시 적용된다."
      - "d는 감점: 기다리는 시간이 대부분인 함수라 메모리를 늘려도 실행 시간이 줄지 않고 GB-초만 는다."
      - "e는 감점: 제한 시간은 비용을 줄이지 않는다. 멈춘 호출이 오래 돌며 요금을 쌓을 위험만 커진다."
      - "f는 감점: /tmp 기본 {{fact:lambda.tmp.min}}를 넘는 몫은 추가 요금이 붙고, 실행 환경마다 따로라 캐시 효과도 보장되지 않는다. 요구 사항에 없는 변경이다."
  facts: [lambda.price.duration.arm.apne2, lambda.price.duration.x86.apne2, lambda.price.pc.x86.apne2, lambda.memory.max, lambda.timeout.max, lambda.tmp.min]

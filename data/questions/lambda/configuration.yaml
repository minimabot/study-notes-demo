# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: lambda.q.configuration-cpu
  type: quiz
  chapter: lambda/configuration
  topic: lambda/configuration/memory-architecture
  question: { ko: "이미지 변환 함수가 CPU를 많이 써서 느리다. 메모리 사용량은 설정값의 절반도 안 된다. 실행 시간을 줄이려면 무엇을 바꾸는가?" }
  choices:
    - { id: a, text: { ko: "함수 구성에서 vCPU 수를 늘린다" } }
    - { id: b, text: { ko: "메모리 설정을 늘린다. CPU가 메모리에 비례해 함께 늘어난다" } }
    - { id: c, text: { ko: "임시 스토리지(/tmp) 크기를 늘린다" } }
    - { id: d, text: { ko: "메모리를 쓰지 않으므로 메모리를 최솟값으로 줄인다" } }
  answer: b
  explanation: { ko: "Lambda에는 CPU를 따로 고르는 설정이 없고(a), CPU는 메모리 설정에 비례해 배정된다. 메모리를 {{fact:lambda.memory.one-vcpu}}로 두면 vCPU 하나에 해당한다. 메모리 사용량이 낮아도 CPU 병목이면 메모리를 늘리는 것이 해법이다. /tmp 크기(c)는 디스크 공간일 뿐 CPU와 무관하다. 메모리를 줄이면(d) CPU도 줄어 더 느려진다." }
  facts: [lambda.memory.one-vcpu]

- id: lambda.q.configuration-secrets
  type: quiz
  chapter: lambda/configuration
  topic: lambda/configuration/envvars-secrets
  question: { ko: "함수가 RDS DB 암호를 환경 변수로 받고 있다. 보안 검토에서 암호를 더 안전하게 관리하고, 호출마다 API를 부르지 않도록 하라는 요구가 나왔다. 문서가 권하는 방법은?" }
  choices:
    - { id: a, text: { ko: "환경 변수를 고객 관리형 KMS 키로 암호화하고 그대로 둔다" } }
    - { id: b, text: { ko: "암호를 함수 코드에 넣고 배포 패키지를 암호화한다" } }
    - { id: c, text: { ko: "암호를 Secrets Manager에 두고 AWS Parameters and Secrets Lambda Extension으로 캐시해 읽는다" } }
    - { id: d, text: { ko: "암호를 /tmp에 파일로 저장해 두고 재사용한다" } }
  answer: c
  explanation: { ko: "문서는 DB 자격 증명 같은 민감한 값은 환경 변수 대신 Secrets Manager에 두라고 권한다. 확장은 값을 로컬에 캐시하므로(기본 {{fact:lambda.secrets-extension.cache-ttl}}) 호출마다 Secrets Manager를 부르지 않는다. a는 저장 시 암호화를 바꿀 뿐 값은 여전히 환경 변수에 있다. 코드에 비밀을 넣는 것(b)은 피해야 한다. /tmp(d)는 실행 환경마다 따로 있고 사라질 수 있으며, 처음 값을 어디서 가져올지도 해결하지 못한다." }
  facts: [lambda.secrets-extension.cache-ttl]

- id: lambda.q.configuration-timeout
  type: quiz
  chapter: lambda/configuration
  topic: lambda/configuration/timeout-storage
  question: { ko: "새 함수를 만들고 다른 설정은 건드리지 않았다. 함수가 외부 API를 부르고 응답을 기다리는데, 응답이 늦을 때마다 호출이 실패한다. 가장 먼저 의심할 것은?" }
  choices:
    - { id: a, text: { ko: "제한 시간이 기본값({{fact:lambda.timeout.default}})이라 응답을 기다리다 시간 초과가 난다" } }
    - { id: b, text: { ko: "임시 스토리지가 부족하다" } }
    - { id: c, text: { ko: "환경 변수 크기 한도를 넘었다" } }
    - { id: d, text: { ko: "x86_64 아키텍처는 외부 API 호출을 지원하지 않는다" } }
  answer: a
  explanation: { ko: "제한 시간 기본값은 {{fact:lambda.timeout.default}}이고 최대 {{fact:lambda.timeout.max}}까지 늘릴 수 있다. 문서는 다른 서비스의 응답이 늦는 것을 시간 초과의 흔한 원인으로 든다. 응답 대기는 디스크(b)나 환경 변수(c)와 관계없고, 아키텍처(d)는 네트워크 호출 가능 여부와 무관하다." }
  facts: [lambda.timeout.default, lambda.timeout.max]

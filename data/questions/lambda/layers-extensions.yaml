# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: lambda.q.layers-extensions-image
  type: quiz
  chapter: lambda/layers-extensions
  topic: lambda/layers-extensions/layers
  question: { ko: "여러 함수가 함께 쓰는 공용 라이브러리를 계층으로 관리하고 있다. 새로 만든 함수는 컨테이너 이미지로 배포한다. 이 함수에서 공용 라이브러리를 쓰는 방법으로 맞는 것은?" }
  choices:
    - { id: a, text: { ko: "함수 구성에 계층 버전 ARN을 추가한다. 이미지 함수도 계층을 {{fact:lambda.layers.max}}까지 붙일 수 있다" } }
    - { id: b, text: { ko: "이미지 빌드 때 라이브러리를 이미지 안에 넣는다" } }
    - { id: c, text: { ko: "계층의 리소스 기반 정책에 이미지 리포지토리를 추가한다" } }
    - { id: d, text: { ko: "함수 실행 시점에 계층 .zip을 내려받아 /opt에 푼다" } }
  answer: b
  explanation: { ko: "계층은 .zip으로 배포한 함수에만 쓸 수 있다. 컨테이너 이미지 함수는 런타임과 의존성을 이미지에 함께 넣는다. 그래서 a, c는 성립하지 않는다. d처럼 실행 중에 내려받으면 콜드 스타트가 늘고, 이미지 함수의 파일 시스템은 /tmp 외에는 읽기 전용이다." }
  facts: [lambda.layers.max]

- id: lambda.q.layers-extensions-share
  type: quiz
  chapter: lambda/layers-extensions
  topic: lambda/layers-extensions/layer-versions
  question: { ko: "공용 계층 버전 3을 조직 전체에 공유해 두었다. 버그를 고쳐 버전 4를 게시했는데, 다른 계정의 개발자가 버전 4를 붙이려 하자 권한 오류가 난다. 원인으로 맞는 것은?" }
  choices:
    - { id: a, text: { ko: "공유 권한은 계층 버전마다 따로 주므로 버전 4에 권한을 다시 추가해야 한다" } }
    - { id: b, text: { ko: "버전 3을 지우지 않아서 버전 4가 활성화되지 않았다" } }
    - { id: c, text: { ko: "다른 계정에서는 언제나 최신 버전이 아니라 처음 공유한 버전만 쓸 수 있다" } }
    - { id: d, text: { ko: "조직 단위 공유는 지원되지 않고 계정마다 따로 공유해야 한다" } }
  answer: a
  explanation: { ko: "계층 권한은 버전 하나에만 적용된다. 새 버전을 게시할 때마다 add-layer-version-permission으로 다시 공유해야 한다. 버전은 서로 독립이라 이전 버전을 지울 필요가 없다(b). 권한이 있으면 어느 버전이든 쓸 수 있다(c). 조직 ID로 조직 전체에 줄 수 있다(d)." }
  facts: []

- id: lambda.q.layers-extensions-latency
  type: quiz
  chapter: lambda/layers-extensions
  topic: lambda/layers-extensions/extensions
  question: { ko: "모니터링 파트너의 외부 익스텐션을 계층으로 붙인 뒤 콜드 스타트 지연과 함수 실행 시간이 늘었다. 설명으로 맞는 것은?" }
  choices:
    - { id: a, text: { ko: "외부 익스텐션은 별도 서버에서 돌기 때문에 함수 성능에 영향을 줄 수 없다. 다른 원인을 찾는다" } }
    - { id: b, text: { ko: "모든 익스텐션이 초기화를 마쳐야 함수가 호출되고, 익스텐션은 함수와 CPU·메모리를 나눠 쓴다. 응답 뒤 추가 시간은 PostRuntimeExtensionsDuration으로 본다" } }
    - { id: c, text: { ko: "익스텐션은 Shutdown 단계에서만 실행되므로 지연은 Shutdown 시간 상한 때문이다" } }
    - { id: d, text: { ko: "익스텐션은 실행 역할과 별도의 권한을 쓰므로 권한 확인 때문에 느려진다" } }
  answer: b
  explanation: { ko: "Init 단계에서 익스텐션 초기화가 런타임·함수 초기화보다 먼저 끝나야 하므로, 무거운 익스텐션은 콜드 스타트를 늘린다. 같은 실행 환경 안의 프로세스라 자원을 나눠 쓴다(a는 틀림). 외부 익스텐션은 Invoke 이벤트도 받고 호출 뒤에도 돈다(c는 틀림). 익스텐션은 함수와 같은 실행 역할 권한을 쓴다(d는 틀림)." }
  facts: []

# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: dynamodb.q.monitoring-systemerrors-alarm
  type: quiz
  chapter: dynamodb/monitoring
  topic: dynamodb/monitoring/alarms
  question: { ko: "운영자가 `SystemErrors` 지표에 CloudWatch 경보를 만들면서 차원으로 `TableName`만 지정했다. 경보를 만들 때 오류는 없었는데, 며칠째 `INSUFFICIENT_DATA` 상태다. 원인은?" }
  choices:
    - { id: a, text: { ko: "`SystemErrors`는 `TableName`과 `Operation` 차원 조합으로만 나오므로, `TableName`만 지정한 경보는 데이터를 받지 못한다" } }
    - { id: b, text: { ko: "`SystemErrors`는 계정 전체 합계라서 테이블 차원을 지정할 수 없다" } }
    - { id: c, text: { ko: "DynamoDB 지표는 기본으로 CloudWatch에 보내지지 않으므로 먼저 지표 전송을 켜야 한다" } }
    - { id: d, text: { ko: "경보는 SNS 주제를 연결해야만 상태를 계산한다" } }
  answer: a
  explanation: { ko: "`SystemErrors`는 `TableName`+`Operation` 쌍으로만 나온다. CloudWatch는 빠진 차원을 대신 합쳐 주지 않고, 차원이 빠져도 경보 생성은 성공하므로 이런 일이 생긴다. 계정·리전 전체 합계인 지표는 `UserErrors`다(b는 틀림). DynamoDB 지표는 자동으로 CloudWatch에 간다(c는 틀림). SNS 주제는 알림을 받을 곳일 뿐, 경보 상태 계산과는 상관없다(d는 틀림)." }
  facts: []

- id: dynamodb.q.monitoring-retry
  type: quiz
  chapter: dynamodb/monitoring
  topic: dynamodb/monitoring/errors
  question: { ko: "SDK 없이 DynamoDB API를 직접 호출하는 애플리케이션이 있다. 다음 중 같은 요청을 백오프를 두고 다시 보내도 되는 오류는?" }
  choices:
    - { id: a, text: { ko: "`ValidationException`" } }
    - { id: b, text: { ko: "`ConditionalCheckFailedException`" } }
    - { id: c, text: { ko: "`ProvisionedThroughputExceededException`" } }
    - { id: d, text: { ko: "`ResourceNotFoundException`" } }
  answer: c
  explanation: { ko: "스로틀 오류(`ProvisionedThroughputExceededException`, `ThrottlingException`)와 5xx는 재시도 대상이다. 지수 백오프로 간격을 늘려 가며 보낸다. `ValidationException`은 매개변수가 잘못된 것이고, `ConditionalCheckFailedException`은 조건이 거짓으로 평가된 것이며, `ResourceNotFoundException`은 테이블이 없거나 아직 만들어지는 중인 것이다. 셋 다 문서상 재시도 대상이 아니므로 요청을 고쳐야 한다." }
  facts: []

- id: dynamodb.q.monitoring-cloudtrail-data
  type: quiz
  chapter: dynamodb/monitoring
  topic: dynamodb/monitoring/logging
  question: { ko: "보안팀이 누가 특정 테이블의 항목을 지웠는지 알고 싶다. CloudTrail 추적에는 `CreateTable`과 `UpdateTable`은 보이는데 `DeleteItem`은 보이지 않는다. 무엇을 해야 하나?" }
  choices:
    - { id: a, text: { ko: "추적에서 DynamoDB 데이터 이벤트(데이터 플레인 API) 기록을 켠다" } }
    - { id: b, text: { ko: "CloudWatch Contributor Insights를 접근·스로틀된 키 모드로 켠다" } }
    - { id: c, text: { ko: "TTL을 켜면 삭제가 CloudTrail에 기록된다" } }
    - { id: d, text: { ko: "`UserErrors` 지표에 경보를 건다" } }
  answer: a
  explanation: { ko: "컨트롤 플레인 이벤트는 기본으로 기록되지만, `GetItem`·`PutItem`·`DeleteItem` 같은 데이터 플레인 이벤트는 추적에서 데이터 이벤트를 켜야 기록된다. Contributor Insights(b)는 많이 접근·스로틀된 키를 보여 줄 뿐 누가 호출했는지 남기지 않는다. TTL 삭제(c)는 CloudTrail에 기록되지 않는다. `UserErrors`(d)는 HTTP 400 수를 셀 뿐이다." }
  facts: []

- id: dynamodb.q.monitoring-throttled-requests
  type: quiz
  chapter: dynamodb/monitoring
  topic: dynamodb/monitoring/metrics
  question: { ko: "GSI가 {{raw:3개}} 있는 테이블에 `PutItem`을 하나 보냈다. 기본 테이블 용량은 넉넉했지만, GSI {{raw:2개}}가 갱신을 감당하지 못해 이 요청이 스로틀됐다. `ThrottledRequests`는 어떻게 변하나?" }
  choices:
    - { id: a, text: { ko: "스로틀된 GSI 수만큼 오른다" } }
    - { id: b, text: { ko: "요청 하나만큼 오른다. 실제 규모는 테이블·GSI별 `WriteThrottleEvents`로 본다" } }
    - { id: c, text: { ko: "기본 테이블 용량이 넉넉했으므로 오르지 않는다" } }
    - { id: d, text: { ko: "GSI 스로틀은 `SystemErrors`로 집계된다" } }
  answer: b
  explanation: { ko: "`ThrottledRequests`는 요청 안의 이벤트가 몇 개 스로틀되든 요청당 하나만 오른다(a는 틀림). GSI가 갱신을 감당하지 못하면 기본 테이블 쓰기가 스로틀되는 역압이 생기므로, 테이블 용량만 보고 괜찮다고 할 수 없다(c는 틀림). 스로틀은 HTTP 400 계열이고 `SystemErrors`는 HTTP 500 수다(d는 틀림)." }
  facts: []

- id: dynamodb.d.monitoring-peak-throttling
  type: design
  chapter: dynamodb/monitoring
  topic: dynamodb/monitoring/throttling
  scenario: { ko: "주문 서비스의 `Orders` 테이블은 온디맨드 모드이고, 파티션 키는 `orderId`다. 주문 상태별로 조회하려고 파티션 키가 `status`인 GSI를 두었다. `status` 값은 `PENDING`, `PAID`, `SHIPPED` 정도뿐이다. 매일 저녁 할인 시간에 주문 쓰기가 실패하고, 애플리케이션 로그에 스로틀 예외가 쌓인다. 테이블의 `ConsumedWriteCapacityUnits`는 테이블당 기본 한도({{fact:dynamodb.throughput.table-default}})보다 한참 낮고, 온디맨드 최대 처리량은 설정하지 않았다. 원인을 찾고 고치는 방법으로 알맞은 것을 모두 고르라." }
  choices:
    - { id: a, text: { ko: "예외의 `ThrottlingReasons`에서 이유와 자원 ARN을 확인하고, 그 이유에 맞는 지표(예: GSI의 `WriteKeyRangeThroughputThrottleEvents`)를 본다" } }
    - { id: b, text: { ko: "해당 GSI에 Contributor Insights를 스로틀된 키 모드로 켜서 가장 많이 스로틀된 키를 찾는다" } }
    - { id: c, text: { ko: "GSI 파티션 키를 값이 다양한 키로 바꾸거나 `status` 값에 접미사를 붙여 쓰기를 여러 파티션으로 흩는다" } }
    - { id: d, text: { ko: "GSI 차원(`TableName`+`GlobalSecondaryIndexName`)으로 쓰기 스로틀 지표에 경보를 걸어 SNS로 알림을 받는다" } }
    - { id: e, text: { ko: "Service Quotas에서 테이블당 쓰기 처리량 한도 증가를 요청한다" } }
    - { id: f, text: { ko: "프로비저닝된 모드로 바꾸고 Auto Scaling을 켠다" } }
    - { id: g, text: { ko: "스로틀 오류가 쌓이지 않도록 SDK 재시도를 끈다" } }
  answer_set: [a, b, c, d]
  rubric:
    ko:
      - "a, b, c, d를 모두 고르면 정답이다."
      - "a: 진단의 출발점은 예외 안의 이유다. 이 상황이면 `IndexWriteKeyRangeThroughputExceeded`와 GSI ARN이 나올 가능성이 크다. 자원 ARN이 GSI를 가리켜도 실패한 것은 기본 테이블 쓰기다(GSI 역압)."
      - "b: 키 범위 스로틀이면 Contributor Insights로 문제 키를 찾는다. 스로틀된 키 모드는 스로틀이 날 때만 이벤트를 처리하므로 늘 켜 두기에 비용이 적다."
      - "c: 값이 몇 개뿐인 GSI 파티션 키에 쓰기가 몰리면 파티션 하나의 한도({{fact:dynamodb.partition.write.max}})에 닿는다. 키 설계를 바꿔야 풀린다. 쓰기 분산은 {{ch:dynamodb/partitions}} 참고."
      - "d: 다음 저녁을 기다리지 않고 바로 알게 한다. GSI 지표는 GSI 차원을 함께 지정해야 데이터를 받는다."
      - "e는 감점: 소비량이 테이블당 한도보다 한참 낮으므로 계정 수준 한도 문제가 아니다. 한도를 올려도 파티션 한도는 그대로다."
      - "f는 감점: 파티션 한도는 두 모드에 모두 걸린다. 모드를 바꿔도 핫 파티션은 남고, Auto Scaling은 급증에 늦게 반응한다."
      - "g는 감점: 스로틀 오류는 백오프와 함께 재시도할 대상이다. 재시도를 끄면 실패한 주문이 그대로 사용자에게 돌아간다."
  facts: [dynamodb.throughput.table-default, dynamodb.partition.write.max]

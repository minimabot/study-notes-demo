# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: dynamodb.q.backup-restore-restored-settings
  type: quiz
  chapter: dynamodb/backup-restore
  topic: dynamodb/backup-restore/restore
  question: { ko: "PITR로 어제 오후 상태의 테이블을 전체 복원했다. 새 테이블에 별도 설정 없이 들어와 있는 것은?" }
  choices:
    - { id: a, text: { ko: "Auto Scaling 정책" } }
    - { id: b, text: { ko: "TTL 설정" } }
    - { id: c, text: { ko: "백업 당시의 GSI와 LSI" } }
    - { id: d, text: { ko: "태그와 스트림 설정" } }
  answer: c
  explanation: { ko: "전체 복원은 데이터와 함께 백업 당시의 GSI·LSI와 프로비저닝 용량을 복원한다. 인덱스는 빼고 복원할 수도 있다. Auto Scaling 정책(a), TTL 설정(b), 태그와 스트림 설정(d)은 복원되지 않으므로 새 테이블에 직접 다시 설정한다. IAM 정책, 경보, 삭제 방지, PITR 설정도 마찬가지다." }
  facts: []

- id: dynamodb.q.backup-restore-deleted-table
  type: quiz
  chapter: dynamodb/backup-restore
  topic: dynamodb/backup-restore/pitr
  question: { ko: "PITR이 켜진 운영 테이블을 운영자가 실수로 삭제했다. 온디맨드 백업은 만든 적이 없다. 옳은 설명은?" }
  choices:
    - { id: a, text: { ko: "PITR 백업은 테이블과 함께 지워지므로 복구할 수 없다" } }
    - { id: b, text: { ko: "DynamoDB가 삭제 직전 상태의 시스템 백업을 만들어 {{fact:dynamodb.pitr.deleted-system-backup.retention}} 동안 보관하므로, 이것으로 새 테이블에 복원한다" } }
    - { id: c, text: { ko: "삭제된 테이블을 그 이름 그대로 제자리에 되살린다(in-place)" } }
    - { id: d, text: { ko: "지난 {{fact:dynamodb.pitr.window.max}} 안의 아무 초로나 다시 복원할 수 있다" } }
  answer: b
  explanation: { ko: "PITR이 켜진 테이블을 지우면 `$DeletedTableBackup` 이름의 시스템 백업이 추가 요금 없이 {{fact:dynamodb.pitr.deleted-system-backup.retention}} 보관된다(a는 틀림). 복원은 언제나 새 테이블로 한다(c는 틀림). 시스템 백업은 삭제 직전 한 시점의 스냅샷이므로 아무 시점으로나 돌아가지는 못한다(d는 틀림). 삭제 자체를 막으려면 삭제 방지를 켠다." }
  facts: [dynamodb.pitr.deleted-system-backup.retention, dynamodb.pitr.window.max]

- id: dynamodb.q.backup-restore-aws-backup-copy
  type: quiz
  chapter: dynamodb/backup-restore
  topic: dynamodb/backup-restore/on-demand-aws-backup
  question: { ko: "규정상 DynamoDB 테이블의 백업을 매일 자동으로 만들고, 다른 리전과 별도 계정에 사본을 두고, 오래된 백업은 싼 저장소로 옮기고, 누구도 보존 기간 전에 지우지 못하게 해야 한다. 가장 적은 운영 부담으로 맞추는 방법은?" }
  choices:
    - { id: a, text: { ko: "PITR을 켜고 복구 기간을 최대로 둔다" } }
    - { id: b, text: { ko: "Lambda 함수로 매일 CreateBackup을 호출하고, 오래된 백업을 지우는 스크립트를 따로 돌린다" } }
    - { id: c, text: { ko: "AWS Backup 백업 계획으로 일정·보존을 정하고, 다른 리전·계정 볼트로 복사, 콜드 스토리지 전환, Vault Lock을 설정한다" } }
    - { id: d, text: { ko: "테이블을 글로벌 테이블로 바꿔 다른 리전에 복제본을 둔다" } }
  answer: c
  explanation: { ko: "예약 백업, 리전 간·계정 간 복사, 콜드 스토리지 수명 주기, Vault Lock(WORM)은 AWS Backup이 DynamoDB 백업에 더해 주는 기능이다. PITR(a)은 최대 {{fact:dynamodb.pitr.window.max}}의 원본 리전 보호로, 다른 계정 사본과 장기 보관이 없다. Lambda 스크립트(b)는 운영 부담이 크고 복사·잠금을 직접 만들어야 한다. 글로벌 테이블(d)은 백업이 아니라 복제라 잘못된 삭제도 그대로 퍼진다." }
  facts: [dynamodb.pitr.window.max]

- id: dynamodb.d.backup-restore-dr-plan
  type: design
  chapter: dynamodb/backup-restore
  topic: dynamodb/backup-restore/dr-strategy
  scenario: { ko: "회사에 DynamoDB 테이블이 세 개 있다. (1) 주문 테이블: 리전 전체 장애가 나도 주문을 거의 멈춤 없이 받아야 한다(RTO 거의 0). 몇 초 분량의 데이터 손실은 받아들인다. (2) 상품 카탈로그 테이블: 배치 작업이 잘못된 값을 쓰거나 운영자가 실수로 지우는 일이 가끔 있다. 이런 경우 사고 직전 초 단위 상태로 되돌려야 한다. 리전 장애 때는 몇 시간 멈춰도 된다. (3) 감사 기록 테이블: 규정상 매일 백업을 오래 보관하고, 다른 리전과 다른 계정에 사본을 두며, 보존 기간 전에는 아무도 지우지 못해야 한다. 비용은 낮을수록 좋다. 알맞은 구성을 모두 고르라." }
  choices:
    - { id: a, text: { ko: "(1)을 글로벌 테이블(MREC)로 만들어 두 번째 리전에 복제본을 두고, 장애 때 애플리케이션 트래픽을 그 리전으로 옮긴다" } }
    - { id: b, text: { ko: "(2)에 PITR과 삭제 방지를 켜고, 사고가 나면 사고 직전 시점으로 새 테이블에 복원하거나 증분 내보내기로 잘못된 쓰기만 되돌린다" } }
    - { id: c, text: { ko: "(3)에 AWS Backup 백업 계획을 걸어 매일 백업하고, 다른 리전·계정 볼트로 복사하며, 콜드 스토리지 전환과 Vault Lock을 설정한다" } }
    - { id: d, text: { ko: "(1)은 글로벌 테이블이므로 데이터가 여러 리전에 있어 PITR이 필요 없다" } }
    - { id: e, text: { ko: "(2)는 PITR만 켜 두면 원본 리전 전체가 멈춰도 PITR 백업으로 다른 리전에서 바로 복원할 수 있으니 따로 대책이 없어도 된다" } }
  answer_set: [a, b, c]
  rubric:
    ko:
      - "a, b, c를 모두 고르면 정답이다."
      - "a: 글로벌 테이블은 어느 복제본에서나 읽고 쓰므로 트래픽만 옮기면 바로 일한다. MREC의 RPO는 복제 지연만큼(보통 몇 초)이고, 가용성 SLA는 {{fact:dynamodb.gt.sla.availability}}다. 전환 판단과 라우팅은 애플리케이션이 맡는다."
      - "b: PITR은 테이블에 표시되는 가장 이른 복원 시점과 가장 늦은 복원 시점 사이의 아무 초로 되돌리므로 사람의 실수에 맞다. 범위는 최대 {{fact:dynamodb.pitr.window.max}}이고, 최근에 켰거나 복구 기간을 늘린 직후에는 더 짧을 수 있다. 복원은 새 테이블로 하고, Auto Scaling·TTL·태그·스트림 같은 설정은 다시 해야 한다. 잘못된 쓰기가 일부라면 증분 내보내기로 그 쓰기만 되돌리는 편이 빠르고 싸다."
      - "c: 일정, 리전 간·계정 간 사본, 수명 주기(콜드 스토리지), WORM 잠금을 한 곳에서 자동화하는 것은 AWS Backup이다. 몇 시간 단위 RPO·RTO를 받아들이므로 글로벌 테이블보다 싸다."
      - "d는 감점: 글로벌 테이블은 잘못된 쓰기와 삭제도 모든 리전에 복제한다. 리전 장애 대책과 실수 대책은 별개이므로 (1)에도 PITR을 켠다."
      - "e는 감점: DR 안내서는 PITR 백업을 원본 리전에만 있는 보호로 분류한다. 리전 장애 대책이 필요하면 AWS Backup 리전 간 복사나 다른 리전 버킷으로의 S3 내보내기를 더한다. (2)는 몇 시간 멈춤을 허용하므로 이 정도면 충분하다."
  facts: [dynamodb.gt.sla.availability, dynamodb.pitr.window.max, dynamodb.backup.aws-backup.min-frequency]

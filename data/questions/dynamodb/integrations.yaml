# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: dynamodb.q.integrations-fanout
  type: quiz
  chapter: dynamodb/integrations
  topic: dynamodb/integrations/events
  question: { ko: "주문 테이블의 스트림을 이미 Lambda 함수 두 개가 읽고 있다. 새로 서비스 다섯 곳이 주문 변경을 받아야 하고, 서비스마다 받는 조건이 다르다. 스트림 설정을 크게 바꾸지 않는 방법은?" }
  choices:
    - { id: a, text: { ko: "스트림에 Lambda 트리거 다섯 개를 더 붙인다" } }
    - { id: b, text: { ko: "기존 소비자 하나를 EventBridge 파이프로 바꿔 이벤트 버스로 보내고, 버스 규칙으로 서비스마다 나눠 보낸다" } }
    - { id: c, text: { ko: "각 서비스가 주기적으로 테이블을 스캔해 바뀐 항목을 찾는다" } }
    - { id: d, text: { ko: "스트림 보기 유형을 NEW_AND_OLD_IMAGES로 바꾼다" } }
  answer: b
  explanation: { ko: "DynamoDB Streams는 샤드마다 동시 소비자를 보통 {{fact:dynamodb.streams.readers-per-shard}}까지 둔다. 그래서 a처럼 소비자를 계속 늘리면 스로틀이 생긴다. EventBridge Pipes가 소비자 자리 하나를 쓰고 이벤트 버스로 넘기면, 규칙이 조건별로 여러 대상에 나눠 보낸다. c는 AWS가 하지 말라는 방식이다. d는 레코드에 담기는 내용만 바꿀 뿐 소비자 수와 상관없다." }
  facts: [dynamodb.streams.readers-per-shard]

- id: dynamodb.q.integrations-redshift-copy
  type: quiz
  chapter: dynamodb/integrations
  topic: dynamodb/integrations/analytics
  question: { ko: "프로비저닝 모드 운영 테이블을 Redshift COPY 명령으로 매일 밤 복사한다. 복사하는 동안 애플리케이션 읽기가 스로틀된다. 먼저 손볼 것은?" }
  choices:
    - { id: a, text: { ko: "COPY의 READRATIO를 낮춰 복사가 쓰는 읽기 용량 비율을 줄인다" } }
    - { id: b, text: { ko: "Redshift 쪽 쿼리 수를 줄인다" } }
    - { id: c, text: { ko: "테이블의 쓰기 용량을 늘린다" } }
    - { id: d, text: { ko: "테이블에 스트림을 켠다" } }
  answer: a
  explanation: { ko: "COPY는 원본 테이블의 읽기 용량을 쓴다. READRATIO가 쓸 비율을 정하고, AWS는 평소 남는 용량보다 낮게 잡으라고 권장한다. 복사가 끝난 뒤 Redshift 쿼리(b)는 사본을 읽으므로 DynamoDB에 영향이 없다. 문제는 읽기라서 쓰기 용량(c)은 상관없다. 스트림(d)은 복사의 읽기 소비를 줄이지 않는다. 처리량을 아예 쓰지 않으려면 S3 내보내기를 고려한다." }
  facts: []

- id: dynamodb.q.integrations-opensearch-prereq
  type: quiz
  chapter: dynamodb/integrations
  topic: dynamodb/integrations/analytics
  question: { ko: "OpenSearch Ingestion의 DynamoDB 플러그인으로 기존 데이터 적재와 이후 변경 반영을 모두 하는 파이프라인을 만들려 한다. 테이블에 미리 켜 둬야 하는 것은?" }
  choices:
    - { id: a, text: { ko: "TTL과 DynamoDB Streams" } }
    - { id: b, text: { ko: "PITR만" } }
    - { id: c, text: { ko: "PITR과 DynamoDB Streams" } }
    - { id: d, text: { ko: "Kinesis Data Streams for DynamoDB" } }
  answer: c
  explanation: { ko: "플러그인은 처음 스냅샷을 S3 내보내기로 만들고, 내보내기에는 PITR이 필요하다. 그 뒤 변경은 DynamoDB Streams로 따라가므로 스트림도 켜야 한다. TTL(a)은 필요 없다. PITR만(b) 켜면 스냅샷은 되지만 이후 변경을 받지 못한다. 이 플러그인은 Kinesis Data Streams(d)가 아니라 DynamoDB Streams를 읽는다." }
  facts: []

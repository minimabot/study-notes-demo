# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: dynamodb.q.labs-gsi-consistent
  type: quiz
  chapter: dynamodb/labs
  topic: dynamodb/labs/gsi
  question: { ko: "실습에서 AlbumTitle-index(GSI)에 --consistent-read를 붙여 쿼리했더니 ValidationException이 났다. 이유는?" }
  choices:
    - { id: a, text: { ko: "인덱스가 아직 CREATING 상태다" } }
    - { id: b, text: { ko: "GSI는 최종 일관성 읽기만 지원한다" } }
    - { id: c, text: { ko: "온디맨드 테이블은 강한 일관성 읽기를 지원하지 않는다" } }
    - { id: d, text: { ko: "GSI 쿼리에는 정렬 키 조건이 꼭 있어야 한다" } }
  answer: b
  explanation: { ko: "GSI는 기본 테이블에서 비동기로 갱신되므로 강한 일관성 읽기를 받지 않는다. 같은 쿼리에서 --consistent-read만 빼면 된다. a라면 인덱스를 아직 쓸 수 없다는 다른 오류가 난다. 온디맨드 테이블(c)도 기본 테이블에서는 강한 일관성 읽기를 쓸 수 있다. 정렬 키 조건(d)은 선택이고, 이 인덱스에는 정렬 키도 없다." }
  facts: []

- id: dynamodb.q.labs-ttl-still-visible
  type: quiz
  chapter: dynamodb/labs
  topic: dynamodb/labs/ttl-pitr
  question: { ko: "TTL을 켠 뒤 ExpiresAt을 이미 지난 Unix epoch 초(Number)로 넣었다. 바로 get-item을 했더니 항목이 그대로 나온다. 옳은 설명은?" }
  choices:
    - { id: a, text: { ko: "TTL 속성은 문자열이어야 하므로 설정이 잘못됐다" } }
    - { id: b, text: { ko: "TTL 삭제는 백그라운드에서 나중에 일어나므로, 그전까지 정확히 거르려면 필터 표현식을 쓴다" } }
    - { id: c, text: { ko: "TTL은 켠 뒤에 넣은 항목에는 적용되지 않는다" } }
    - { id: d, text: { ko: "강한 일관성 읽기로 바꾸면 만료된 항목은 나오지 않는다" } }
  answer: b
  explanation: { ko: "TTL은 만료 시각이 지나도 즉시 지우지 않는다. 백그라운드 작업이 나중에 지우고, 그전까지 항목은 읽기 결과에 나온다. 그래서 만료 시각 > 현재 시각 같은 필터로 거른다. TTL 속성은 Number 타입이어야 하므로 a는 거꾸로다. TTL은 켠 뒤의 항목에도 적용된다(c). 일관성 모델(d)은 삭제 시점과 상관없다." }
  facts: []

- id: dynamodb.q.labs-stream-images
  type: quiz
  chapter: dynamodb/labs
  topic: dynamodb/labs/streams
  question: { ko: "스트림 보기 유형을 NEW_AND_OLD_IMAGES로 켠 뒤 항목 하나를 delete-item으로 지웠다. 이 변경의 스트림 레코드에 대한 설명으로 옳은 것은?" }
  choices:
    - { id: a, text: { ko: "eventName이 REMOVE이고, 지우기 전 항목이 OldImage에 들어 있다" } }
    - { id: b, text: { ko: "eventName이 MODIFY이고, NewImage가 빈 항목이다" } }
    - { id: c, text: { ko: "삭제는 스트림에 기록되지 않는다" } }
    - { id: d, text: { ko: "레코드는 PITR 기간 동안 스트림에 남는다" } }
  answer: a
  explanation: { ko: "삭제는 REMOVE 레코드로 남고, 보기 유형에 이전 이미지가 들어 있으면 지우기 전 항목이 OldImage에 담긴다. 삭제 레코드에는 NewImage가 없다. MODIFY(b)는 기존 항목을 고친 경우다. 삭제도 기록되므로 c는 틀리다. 스트림 레코드 보관 기간은 PITR(d)과 관계없이 {{fact:dynamodb.streams.retention}}이다." }
  facts: [dynamodb.streams.retention]

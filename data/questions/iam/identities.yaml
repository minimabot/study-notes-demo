# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: iam.q.identities-root-tasks
  type: quiz
  chapter: iam/identities
  topic: iam/identities/root-user
  question: { ko: "Organizations에 속하지 않은 독립 계정을 운영한다. 다음 중 루트 사용자로 로그인해야만 할 수 있는 작업은?" }
  choices:
    - { id: a, text: { ko: "새 IAM 관리자 사용자를 만들고 AdministratorAccess 정책을 붙인다" } }
    - { id: b, text: { ko: "S3 버킷 정책을 잘못 써서 모든 위탁자가 거부된 버킷의 정책을 지운다" } }
    - { id: c, text: { ko: "CloudTrail 추적을 만든다" } }
    - { id: d, text: { ko: "계정의 대체 연락처(alternate contacts)를 바꾼다" } }
  answer: b
  explanation: { ko: "모든 위탁자를 거부하는 버킷 정책은 IAM 관리자도 고칠 수 없어 루트 사용자 작업 목록에 들어 있다(Organizations 멤버 계정이면 중앙 루트 액세스의 권한 있는 세션으로도 할 수 있다). IAM 사용자 생성(a)과 CloudTrail 설정(c)은 권한만 있으면 IAM 자격 증명으로 한다. 대체 연락처 같은 일반 계정 설정(d)은 루트 자격 증명이 필요 없다고 문서가 따로 밝힌다." }
  facts: []

- id: iam.q.identities-password-expiry
  type: quiz
  chapter: iam/identities
  topic: iam/identities/users-credentials
  question: { ko: "계정 암호 정책에 암호 만료 기간을 새로 설정했다. 오래전에 암호를 정한 IAM 사용자 Dana는 콘솔 암호와 액세스 키를 함께 쓴다. 맞는 설명은?" }
  choices:
    - { id: a, text: { ko: "만료 기간은 다음 암호 변경 때부터 적용되므로 Dana는 지금 영향이 없다" } }
    - { id: b, text: { ko: "Dana의 암호가 만료 기간을 넘겼다면 다음 콘솔 로그인 때 암호를 바꿔야 한다. 액세스 키는 계속 동작한다" } }
    - { id: c, text: { ko: "암호가 만료되면 Dana의 액세스 키도 함께 비활성화된다" } }
    - { id: d, text: { ko: "같은 정책이 루트 사용자 암호에도 적용된다" } }
  answer: b
  explanation: { ko: "길이·문자 규칙과 달리 만료 기간은 즉시 적용된다. 그래서 a는 틀렸다. 암호 정책은 액세스 키에 적용되지 않으므로 암호가 만료돼도 키는 계속 쓸 수 있다(c는 틀림). 암호 정책은 루트 사용자 암호에도 적용되지 않는다(d는 틀림)." }
  facts: []

- id: iam.q.identities-unique-id
  type: quiz
  chapter: iam/identities
  topic: iam/identities/identifiers
  question: { ko: "퇴사한 직원의 IAM 사용자 alex를 지웠다. 몇 달 뒤 다른 직원에게 같은 이름 alex로 새 사용자를 만들었다. 옛 alex만 읽을 수 있어야 하는 데이터가 새 alex에게 열리지 않게 하려면, 리소스 기반 정책의 위탁자를 무엇으로 지정해야 하는가?" }
  choices:
    - { id: a, text: { ko: "사용자 이름 alex" } }
    - { id: b, text: { ko: "alex가 속한 IAM 그룹의 ARN" } }
    - { id: c, text: { ko: "AIDA로 시작하는 옛 사용자의 고유 ID" } }
    - { id: d, text: { ko: "AKIA로 시작하는 옛 사용자의 액세스 키 ID" } }
  answer: c
  explanation: { ko: "IAM은 사용자를 만들 때마다 새 고유 ID를 주므로, 이름이 같아도 옛 alex와 새 alex의 ID는 다르다. 이름(a)으로 지정하면 새 alex에게도 권한이 간다. 그룹은 위탁자가 될 수 없다(b). 액세스 키 ID(d)는 사용자를 가리키는 위탁자 식별자가 아니다. IAM 사용자의 고유 ID 접두어는 AIDA다." }
  facts: []

# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: iam.q.temporary-credentials-mfa-cli
  type: quiz
  chapter: iam/temporary-credentials
  topic: iam/temporary-credentials/api-compare
  question: { ko: "IAM 사용자의 정책이 MFA로 인증한 요청만 EC2 인스턴스 종료를 허용한다. 이 사용자가 자기 액세스 키로 CLI에서 인스턴스를 종료하려 한다. 어떤 STS API를 어떻게 불러야 하는가?" }
  choices:
    - { id: a, text: { ko: "GetSessionToken에 MFA 장치 일련번호와 코드를 넣어 부르고, 받은 임시 자격 증명으로 종료한다" } }
    - { id: b, text: { ko: "GetFederationToken에 MFA 코드를 넣어 부른다" } }
    - { id: c, text: { ko: "AssumeRoleWithWebIdentity에 MFA 코드를 넣어 부른다" } }
    - { id: d, text: { ko: "GetCallerIdentity를 불러 MFA 상태를 세션에 기록한다" } }
  answer: a
  explanation: { ko: "MFA 정보를 넘길 수 있는 STS API는 AssumeRole과 GetSessionToken이다. 자기 사용자 권한을 MFA로 보호된 상태로 쓰려면 GetSessionToken이 맞다. GetFederationToken(b)과 AssumeRoleWithWebIdentity(c)는 MFA 정보를 받지 않는다. GetCallerIdentity(d)는 호출자 정보를 돌려줄 뿐 자격 증명을 만들지 않는다." }
  facts: []

- id: iam.q.temporary-credentials-chaining
  type: quiz
  chapter: iam/temporary-credentials
  topic: iam/temporary-credentials/session-policies-tags
  question: { ko: "역할 B의 최대 세션 기간은 {{fact:iam.role.session.max}}로 설정돼 있다. 배치 작업이 역할 A의 임시 자격 증명으로 역할 B를 수임하면서 DurationSeconds를 최대 세션 기간 값으로 넣었더니 요청이 실패한다. 이유는?" }
  choices:
    - { id: a, text: { ko: "역할 체인으로 얻는 세션은 {{fact:iam.role.chaining.max-session}}을 넘을 수 없다" } }
    - { id: b, text: { ko: "AssumeRole은 DurationSeconds를 받지 않는다" } }
    - { id: c, text: { ko: "역할 B의 신뢰 정책에 sts:TagSession이 없다" } }
    - { id: d, text: { ko: "역할 A의 세션 정책 크기가 한도를 넘었다" } }
  answer: a
  explanation: { ko: "한 역할의 자격 증명으로 다른 역할을 수임하는 것을 역할 체인이라 한다. 체인 세션은 역할의 최대 세션 기간 설정과 관계없이 {{fact:iam.role.chaining.max-session}}으로 묶인다. AssumeRole은 DurationSeconds를 받는다(b). sts:TagSession은 세션 태그를 넘길 때만 필요하다(c). 문제에 세션 정책을 넘긴다는 말이 없다(d)." }
  facts: [iam.role.session.max, iam.role.chaining.max-session]

- id: iam.q.temporary-credentials-revoke
  type: quiz
  chapter: iam/temporary-credentials
  topic: iam/temporary-credentials/revoke-caller
  question: { ko: "운영 역할의 임시 자격 증명이 외부에 노출된 것이 확인됐다. 세션 기간이 길어 만료까지 오래 남았다. 노출된 자격 증명을 바로 막으면서 정상 사용자는 다시 수임해 계속 일하게 하려면?" }
  choices:
    - { id: a, text: { ko: "역할을 삭제하고 같은 이름으로 다시 만든다" } }
    - { id: b, text: { ko: "IAM 콘솔에서 그 역할의 활성 세션 취소를 실행한다" } }
    - { id: c, text: { ko: "역할의 최대 세션 기간을 최솟값으로 줄인다" } }
    - { id: d, text: { ko: "역할 신뢰 정책에서 sts:GetCallerIdentity를 거부한다" } }
  answer: b
  explanation: { ko: "활성 세션 취소는 aws:TokenIssueTime 조건이 들어간 AWSRevokeOlderSessions 정책을 역할에 붙여, 그 시점 이전에 발급된 세션을 모두 거부한다. 그 뒤 새로 수임한 세션은 영향을 받지 않는다. 역할을 지우는 것(a)은 정상 사용자까지 끊고 신뢰 관계도 다시 만들어야 한다. 최대 세션 기간을 줄여도(c) 이미 발급된 자격 증명의 만료 시각은 바뀌지 않는다. GetCallerIdentity는 거부해도 호출되며 노출과 관계없다(d)." }
  facts: []

# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: iam.q.overview-eventual-consistency
  type: quiz
  chapter: iam/overview
  topic: iam/overview/what-is-iam
  question: { ko: "배포 스크립트가 새 IAM 역할을 만들고 정책을 붙인 직후, 같은 스크립트에서 그 역할로 Lambda 함수를 만들다가 간헐적으로 실패한다. 가장 알맞은 설명과 대응은?" }
  choices:
    - { id: a, text: { ko: "IAM은 리전 서비스이므로 역할을 함수와 같은 리전에 다시 만든다" } }
    - { id: b, text: { ko: "IAM은 최종 일관성을 따르므로 변경이 퍼지기 전에 쓴 것이다. IAM 변경은 별도 설정 단계에서 하고 전파를 확인한 뒤 의존 작업을 진행한다" } }
    - { id: c, text: { ko: "역할에 붙인 정책이 인라인 정책이라 즉시 반영되지 않는다. 관리형 정책으로 바꾸면 해결된다" } }
    - { id: d, text: { ko: "IAM API에는 요청 수 제한이 없으므로 원인은 Lambda 쪽이다" } }
  answer: b
  explanation: { ko: "IAM은 전 세계 여러 서버에 데이터를 복제하므로 변경이 모든 곳에 퍼지기까지 시간이 걸린다. AWS는 IAM 변경을 핵심 경로에 넣지 말고 드물게 도는 설정 단계에서 한 뒤 전파를 확인하라고 권한다. IAM은 전역 서비스라 리전에 묶이지 않는다(a). 정책 종류와 전파 지연은 관계가 없다(c). d는 원인을 엉뚱한 곳에 돌린 것이다." }
  facts: []

- id: iam.q.overview-group-principal
  type: quiz
  chapter: iam/overview
  topic: iam/overview/identities-and-access
  question: { ko: "S3 버킷 정책의 Principal에 넣을 수 없는 것은?" }
  choices:
    - { id: a, text: { ko: "같은 계정의 IAM 사용자 ARN" } }
    - { id: b, text: { ko: "다른 계정의 IAM 역할 ARN" } }
    - { id: c, text: { ko: "IAM 사용자 그룹 ARN" } }
    - { id: d, text: { ko: "다른 AWS 계정 전체(계정 루트 ARN)" } }
  answer: c
  explanation: { ko: "그룹은 권한을 묶어 주는 자격 증명일 뿐 인증되는 엔터티가 아니다. 위탁자는 인증된 엔터티여야 하므로 그룹은 Principal이 될 수 없다. 사용자(a)와 역할(b)은 엔터티이고, 계정 전체(d)도 리소스 기반 정책에서 위탁자로 지정할 수 있다." }
  facts: []

- id: iam.q.overview-scp-allow
  type: quiz
  chapter: iam/overview
  topic: iam/overview/identity-center-organizations
  question: { ko: "AWS Organizations의 멤버 계정에서 IAM 역할에 s3:DeleteBucket을 허용하는 정책을 붙였다. 그 계정에 걸린 SCP는 s3:DeleteBucket을 허용하지 않는다(명시적 거부도 없다). 역할로 버킷을 지우면?" }
  choices:
    - { id: a, text: { ko: "IAM 정책이 명시적으로 허용했으므로 성공한다" } }
    - { id: b, text: { ko: "SCP가 허용하지 않으므로 거부된다" } }
    - { id: c, text: { ko: "SCP는 사용자에게만 적용되고 역할에는 적용되지 않으므로 성공한다" } }
    - { id: d, text: { ko: "명시적 거부가 없으므로 SCP는 무시되고 성공한다" } }
  answer: b
  explanation: { ko: "SCP는 권한을 주지 않고 허용될 수 있는 최대 범위를 정한다. SCP가 있으면 IAM 정책의 허용과 SCP의 허용이 함께 있어야 통과한다. 하나라도 허용하지 않으면 묵시적으로 거부된다. 그래서 a, d는 틀렸다. SCP는 멤버 계정의 사용자와 역할 모두에 걸린다(c는 틀림)." }
  facts: []

# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: iam.q.best-practices-key-rotation
  type: quiz
  chapter: iam/best-practices
  topic: iam/best-practices/credentials
  question: { ko: "온프레미스 배치 서버가 IAM 사용자의 액세스 키 하나로 S3에 쓴다. 서비스를 멈추지 않고 키를 교체하려 한다. 새 키를 만들어 서버 설정을 바꾼 다음, 옛 키에 대해 할 일로 맞는 순서는?" }
  choices:
    - { id: a, text: { ko: "곧바로 옛 키를 지운다. 사용자당 키 수가 제한돼 있어 빨리 자리를 비워야 한다" } }
    - { id: b, text: { ko: "마지막 사용 정보를 확인하고, 옛 키를 비활성화한 뒤 새 키로 동작을 확인하고, 충분히 기다린 뒤 지운다" } }
    - { id: c, text: { ko: "옛 키와 새 키를 계속 함께 활성으로 둔다. 키가 둘이면 하나가 새어도 다른 하나로 일할 수 있다" } }
    - { id: d, text: { ko: "계정 암호 정책에 만료 기간을 설정해 옛 키가 자동으로 만료되게 한다" } }
  answer: b
  explanation: { ko: "문서의 교체 절차는 새 키 생성, 애플리케이션 교체, 옛 키의 마지막 사용 확인, 비활성화, 새 키로만 동작 확인, 삭제 순서다. 마지막 사용 기록이 없어 보여도 바로 지우지 말고 먼저 비활성화하라고 한다. 놓친 도구가 있으면 다시 활성화할 수 있기 때문이다(a는 틀림). 사용자당 키를 {{fact:iam.access-keys.per-user}}까지 두는 것은 교체 중의 겹침을 위한 것이지, 둘 다 계속 쓰라는 뜻이 아니다(c). 암호 정책은 콘솔 암호에만 걸리고 액세스 키에는 적용되지 않는다(d)." }
  facts: [iam.access-keys.per-user]

- id: iam.q.best-practices-root-mfa
  type: quiz
  chapter: iam/best-practices
  topic: iam/best-practices/root-user
  question: { ko: "회사 정책상 루트 사용자 로그인에는 반드시 두 명이 함께 있어야 한다. 또 MFA 장치 하나를 잃어버려도 루트에 들어갈 수 있어야 한다. AWS 문서의 권장과 맞는 구성은?" }
  choices:
    - { id: a, text: { ko: "루트 암호는 관리자 그룹 A가, MFA 장치들은 그룹 B가 보관한다. 루트에 MFA 장치를 여러 개 등록한다" } }
    - { id: b, text: { ko: "루트 액세스 키를 만들어 두 사람이 나눠 보관한다. 콘솔이 막히면 키로 작업한다" } }
    - { id: c, text: { ko: "한 사람이 암호와 MFA를 모두 갖되, 루트 이메일을 그 사람 개인 주소로 바꿔 책임을 분명히 한다" } }
    - { id: d, text: { ko: "루트 MFA를 해제하고 계정 암호 정책의 최소 길이를 최대로 늘린다" } }
  answer: a
  explanation: { ko: "문서는 다중 승인 방식으로 암호를 가진 그룹과 MFA를 가진 그룹을 나누고, 루트에 MFA를 여러 개 등록해 장치 하나를 잃어도 다른 장치로 로그인하라고 권한다. 루트 액세스 키는 만들지 말라고 한다(b). 루트 이메일은 개인 주소가 아니라 회사가 관리하는 그룹 주소를 쓴다(c). 루트 MFA는 모든 계정 유형에서 필수이고, 계정 암호 정책은 루트 암호에 적용되지 않는다(d)." }
  facts: [iam.mfa.devices.max]

- id: iam.q.best-practices-managed-policy
  type: quiz
  chapter: iam/best-practices
  topic: iam/best-practices/least-privilege
  question: { ko: "새 팀에 직무용 AWS 관리형 정책을 붙여 일을 시작하게 했다. 몇 달 뒤 최소 권한으로 옮기려 한다. 문서가 권하는 다음 단계는?" }
  choices:
    - { id: a, text: { ko: "AWS 관리형 정책은 AWS가 관리하므로 이미 최소 권한이다. 그대로 둔다" } }
    - { id: b, text: { ko: "SCP를 붙여 팀에 권한을 준 뒤 관리형 정책을 뗀다" } }
    - { id: c, text: { ko: "마지막 액세스 정보와 Access Analyzer 정책 생성으로 실제 쓴 서비스·작업을 찾아 고객 관리형 정책을 만들고, 관리형 정책을 그것으로 바꾼다" } }
    - { id: d, text: { ko: "관리형 정책을 인라인 정책으로 복사해 붙인다. 인라인 정책은 자동으로 최소 권한이 된다" } }
  answer: c
  explanation: { ko: "AWS 관리형 정책은 모든 고객이 쓰도록 만들어져 특정 사용 사례에는 최소 권한이 아닐 수 있다(a). 문서는 관찰 기간이 지나면 실제로 쓴 서비스만 담은 고객 관리형 정책을 만들어 바꾸라고 한다. SCP는 권한을 주지 않고 상한만 정한다(b). 정책을 인라인으로 옮겨도 권한 범위는 그대로다(d)." }
  facts: []

- id: iam.d.best-practices-new-account
  type: design
  chapter: iam/best-practices
  topic: iam/best-practices/root-user
  scenario: { ko: "다섯 명짜리 스타트업이 Organizations 없이 AWS 계정 하나를 새로 만들었다. 지금은 창업자가 루트 사용자로 로그인해 콘솔과 CLI(루트 액세스 키)로 모든 일을 한다. EC2 웹 서버도 그 루트 키를 설정 파일에 넣어 S3에 접근한다. 요구 사항은 (가) 루트를 일상에서 쓰지 않을 것, (나) 사람과 서버 모두 장기 자격 증명을 줄일 것, (다) 한 사람의 실수나 퇴사로 계정을 잃지 않을 것, (라) 권한을 필요한 만큼으로 줄여 갈 것이다. 알맞은 조치를 모두 고르라." }
  choices:
    - { id: a, text: { ko: "루트 액세스 키를 지우고, 루트에 보안 키 MFA를 여러 개 등록한다. 루트 이메일을 회사 그룹 메일로 바꾸고, 암호·MFA·복구 전화번호를 서로 다른 사람이 관리하게 한다" } }
    - { id: b, text: { ko: "IAM Identity Center(또는 단일 계정이면 IAM 역할)로 관리 사용자와 팀원용 접근을 만들어 임시 자격 증명으로 일하게 하고, 팀원에게는 직무용 관리형 정책으로 시작한다" } }
    - { id: c, text: { ko: "웹 서버에는 필요한 버킷 권한만 가진 역할을 인스턴스 프로파일로 붙이고, 설정 파일의 키를 없앤다" } }
    - { id: d, text: { ko: "몇 달 뒤 마지막 액세스 정보와 Access Analyzer 정책 생성으로 쓰지 않는 권한을 찾아 고객 관리형 정책으로 좁히고, 쓰지 않는 자격 증명을 지운다" } }
    - { id: e, text: { ko: "팀원마다 AdministratorAccess를 붙인 IAM 사용자와 액세스 키를 만들고, 계정 암호 정책으로 키를 주기적으로 만료시킨다" } }
    - { id: f, text: { ko: "루트 액세스 키는 그대로 두되 키를 주기적으로 교체하고 CloudTrail로 감시한다" } }
    - { id: g, text: { ko: "루트 암호를 같은 계정의 AWS Secrets Manager에만 보관해 관리자들이 꺼내 쓰게 한다" } }
  answer_set: [a, b, c, d]
  rubric:
    ko:
      - "a, b, c, d를 모두 고르면 정답이다."
      - "a: 루트 액세스 키는 만들지 않는 것이 권장이므로 지운다. MFA를 여러 개 두면 하나를 잃어도 로그인할 수 있다. 그룹 메일과 역할 분리(암호·MFA·복구 수단)는 요구 (다)를 지킨다."
      - "b: 일상 작업은 관리 사용자로 하고, 사람은 임시 자격 증명을 쓰게 해 요구 (가)·(나)를 지킨다. 관리형 정책으로 시작하는 것은 문서가 권하는 출발점이다."
      - "c: 워크로드는 역할의 임시 자격 증명을 쓴다. 설정 파일의 루트 키를 없애야 요구 (나)가 끝난다."
      - "d: 관찰 뒤 실제 사용을 근거로 권한을 줄이고 쓰지 않는 자격 증명을 지우는 것이 요구 (라)의 흐름이다."
      - "e는 감점: 모두에게 관리자 권한과 장기 키를 주어 (나)·(라)를 어긴다. 암호 정책은 액세스 키에 적용되지 않는다."
      - "f는 감점: 교체해도 루트 장기 키가 남는다. 문서는 루트 키를 만들지 말라고 한다."
      - "g는 감점: 루트 암호를 그 계정에 의존하는 도구에만 두면, 암호를 잃었을 때 그 도구에도 들어갈 수 없다. 문서가 피하라고 하는 보관 방식이다."
  facts: [iam.mfa.devices.max]

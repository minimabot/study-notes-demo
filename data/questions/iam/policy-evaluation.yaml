# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: iam.q.policy-evaluation-same-account-rbp
  type: quiz
  chapter: iam/policy-evaluation
  topic: iam/policy-evaluation/resource-based
  question: { ko: "같은 계정의 IAM 사용자 carlos에게는 자격 증명 기반 정책이 하나도 없고 권한 경계도 없다. S3 버킷 정책은 Principal에 carlos의 사용자 ARN을 적고 s3:GetObject를 허용한다. 조직의 SCP는 S3를 허용한다. carlos가 이 버킷의 객체를 읽으면?" }
  choices:
    - { id: a, text: { ko: "허용된다. 같은 계정에서는 리소스 기반 정책이 사용자 ARN을 직접 허용하면 충분하다" } }
    - { id: b, text: { ko: "거부된다. 자격 증명 기반 정책이 없으면 항상 묵시적 거부다" } }
    - { id: c, text: { ko: "거부된다. 버킷 정책은 다른 계정의 보안 주체에게만 권한을 준다" } }
    - { id: d, text: { ko: "SCP가 S3를 허용하므로 버킷 정책과 상관없이 허용된다" } }
  answer: a
  explanation: { ko: "같은 계정에서는 자격 증명 기반 정책과 리소스 기반 정책 중 하나만 허용해도 된다. 리소스 기반 정책이 사용자 ARN을 직접 허용하면 자격 증명 기반 정책의 묵시적 거부는 판정에 영향을 주지 않는다(b는 틀림). 버킷 정책은 같은 계정 보안 주체에게도 권한을 줄 수 있다. 같은 계정에 권한을 못 주는 것은 ACL이다(c). SCP는 상한일 뿐 권한을 주지 않는다. 결과는 같지만 이유가 틀렸다(d)." }
  facts: []

- id: iam.q.policy-evaluation-cross-account
  type: quiz
  chapter: iam/policy-evaluation
  topic: iam/policy-evaluation/cross-account
  question: { ko: "계정 B의 버킷 정책이 계정 A의 역할 Demo를 Principal로 적고 s3:PutObject를 허용한다. 계정 A에서 Demo 역할의 권한 정책에는 S3 관련 문이 전혀 없다. Demo 역할 세션으로 B의 버킷에 객체를 올리면?" }
  choices:
    - { id: a, text: { ko: "허용된다. 리소스 기반 정책이 보안 주체를 직접 허용했다" } }
    - { id: b, text: { ko: "거부된다. 계정 A의 평가에서 자격 증명 기반 정책이 허용하지 않아 묵시적 거부가 난다" } }
    - { id: c, text: { ko: "거부된다. 버킷 정책에는 역할 ARN을 Principal로 쓸 수 없다" } }
    - { id: d, text: { ko: "계정 B의 SCP가 허용하면 허용된다" } }
  answer: b
  explanation: { ko: "교차 계정 요청은 보안 주체 계정(A)과 리소스 계정(B)을 따로 평가하고 둘 다 허용해야 한다. B의 버킷 정책은 허용하지만, A에서는 자격 증명 기반 정책이 그 작업을 허용해야 하는데 문이 없으니 묵시적 거부다. 리소스 기반 정책만으로 충분한 것은 같은 계정일 때다(a는 틀림). 역할 ARN은 Principal에 쓸 수 있다(c). SCP는 보안 주체가 속한 계정에 적용되는 상한이며 권한을 주지 않는다(d)." }
  facts: []

- id: iam.q.policy-evaluation-scp
  type: quiz
  chapter: iam/policy-evaluation
  topic: iam/policy-evaluation/order
  question: { ko: "멤버 계정의 개발자 역할에 AdministratorAccess가 붙어 있다. 이 계정이 속한 OU의 SCP는 ap-northeast-2 밖의 리전 요청을 Deny 문으로 막는다. 개발자가 us-west-2에 EC2 인스턴스를 만들려고 하면?" }
  choices:
    - { id: a, text: { ko: "AdministratorAccess가 모든 작업을 허용하므로 만들어진다" } }
    - { id: b, text: { ko: "SCP의 명시적 거부로 거부된다" } }
    - { id: c, text: { ko: "SCP는 루트 사용자에게만 적용되므로 만들어진다" } }
    - { id: d, text: { ko: "역할에 권한 경계가 없으므로 SCP는 평가되지 않는다" } }
  answer: b
  explanation: { ko: "평가의 첫 단계는 SCP를 포함한 모든 적용 정책에서 맞는 Deny 문을 찾는 것이다. 찾으면 다른 정책의 Allow와 상관없이 거부된다(a는 틀림). SCP는 멤버 계정의 모든 IAM 사용자·역할과 루트 사용자에게 적용된다(c). SCP 평가는 권한 경계 유무와 관계없다(d)." }
  facts: []

- id: iam.d.policy-evaluation-delegate-roles
  type: design
  chapter: iam/policy-evaluation
  topic: iam/policy-evaluation/boundaries-delegation
  scenario: { ko: "중앙 보안팀이 애플리케이션 팀 리더(역할 AppLead)에게 Lambda 실행 역할을 직접 만들고 권한 정책을 붙이는 일을 맡기려 한다. 요구는 이렇다. AppLead가 만든 역할은 보안팀이 만든 고객 관리형 정책 AppWorkloadBoundary 범위를 넘는 권한을 가질 수 없어야 한다. AppLead가 이 제한을 스스로 풀 수 없어야 한다. AppLead는 역할마다 필요한 권한 정책을 자유롭게 붙일 수 있어야 한다. 알맞은 조치를 모두 고르라." }
  choices:
    - { id: a, text: { ko: "AppLead에게 iam:CreateRole, iam:AttachRolePolicy, iam:PutRolePolicy, iam:PutRolePermissionsBoundary를 허용하되, iam:PermissionsBoundary 조건 키가 AppWorkloadBoundary의 ARN과 같을 때만 허용한다" } }
    - { id: b, text: { ko: "AppWorkloadBoundary와 AppLead에게 붙은 고객 관리형 정책에 대해 iam:CreatePolicyVersion, iam:SetDefaultPolicyVersion, iam:DeletePolicy, iam:DeletePolicyVersion을 명시적으로 거부한다" } }
    - { id: c, text: { ko: "iam:DeleteRolePermissionsBoundary를 명시적으로 거부한다" } }
    - { id: d, text: { ko: "AppWorkloadBoundary에 필요한 서비스 권한을 모두 넣었으니, 새 역할에는 권한 정책을 따로 붙이지 않아도 된다고 안내한다" } }
    - { id: e, text: { ko: "AppLead에게 AdministratorAccess를 주고, 만든 역할을 보안팀이 사후에 검토한다" } }
    - { id: f, text: { ko: "새 역할에 경계를 붙였으니 같은 계정의 리소스 기반 정책이 그 역할 세션 ARN을 허용해도 경계 밖 권한은 생기지 않는다고 본다" } }
  answer_set: [a, b, c]
  rubric:
    ko:
      - "a, b, c를 모두 고르면 정답이다."
      - "a: iam:PermissionsBoundary 조건으로 역할을 만들거나 정책을 붙일 때 반드시 정해진 경계를 쓰게 한다. 경계 없이 만들려 하면 요청이 거부된다. 실제 권한은 붙인 권한 정책과 경계의 교집합이 된다."
      - "b: 경계 정책 내용을 바꾸면 제한이 풀린다. 정책 버전을 만들거나 기본 버전을 바꾸는 작업을 모두 막아야 한다(CreatePolicyVersion만 막으면 부족하다)."
      - "c: 경계를 떼어 낼 수 있으면 제한이 사라진다. 문서의 위임 예에서도 경계 삭제 작업을 명시적으로 거부한다."
      - "d는 감점: 권한 경계는 최대 권한만 정하고 권한을 주지 않는다. 역할에 권한 정책이 없으면 아무 작업도 할 수 없다."
      - "e는 감점: 위임의 목적(권한 상승 방지)을 사전에 강제하지 못한다. 사후 검토로는 그 사이의 위험을 막지 못한다."
      - "f는 감점: 같은 계정에서 리소스 기반 정책이 역할 세션 ARN에 직접 준 권한은 권한 경계의 묵시적 거부로 제한되지 않는다. 경계의 명시적 거부만 막는다."
  facts: []

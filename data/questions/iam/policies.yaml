# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: iam.q.policies-boundary-no-grant
  type: quiz
  chapter: iam/policies
  topic: iam/policies/types
  question: { ko: "IAM 사용자 Shirley에게 권한 경계로 \"s3:*, cloudwatch:*, ec2:* 허용\" 정책을 지정했다. 권한 정책으로는 \"iam:CreateUser 허용\" 정책 하나만 붙였다. 다른 정책은 없다. Shirley가 할 수 있는 일은?" }
  choices:
    - { id: a, text: { ko: "IAM 사용자 생성과 S3·CloudWatch·EC2 작업을 모두 할 수 있다" } }
    - { id: b, text: { ko: "S3·CloudWatch·EC2 작업만 할 수 있다" } }
    - { id: c, text: { ko: "IAM 사용자 생성만 할 수 있다" } }
    - { id: d, text: { ko: "아무 작업도 할 수 없다" } }
  answer: d
  explanation: { ko: "실제 권한은 자격 증명 기반 정책과 권한 경계의 교집합이다. 권한 경계는 상한일 뿐 권한을 주지 않으므로 S3·CloudWatch·EC2 권한은 생기지 않는다(a, b는 틀림). iam:CreateUser는 권한 정책이 허용해도 경계 밖이라 막힌다(c는 틀림). 두 정책이 겹치는 작업이 없어 아무것도 할 수 없다." }
  facts: []

- id: iam.q.policies-rollback
  type: quiz
  chapter: iam/policies
  topic: iam/policies/variables-versions
  question: { ko: "여러 역할에 붙어 있는 고객 관리형 정책을 고쳐 저장했더니, 곧바로 일부 사용자가 S3 콘솔을 쓰지 못한다고 알려 왔다. 직전 내용은 잘 작동했다. 가장 빠르고 안전하게 되돌리는 방법은?" }
  choices:
    - { id: a, text: { ko: "직전 버전을 기본 버전으로 다시 지정한다" } }
    - { id: b, text: { ko: "정책을 지우고 기억나는 대로 새 정책을 만들어 다시 붙인다" } }
    - { id: c, text: { ko: "각 역할에 같은 내용의 인라인 정책을 넣는다" } }
    - { id: d, text: { ko: "정책의 Version 요소를 2008-10-17로 바꾼다" } }
  answer: a
  explanation: { ko: "고객 관리형 정책은 고칠 때마다 새 버전이 생기고(최대 {{fact:iam.policy.versions.max}}), 적용되는 것은 기본 버전이다. 이전 버전을 기본으로 지정하면 붙어 있는 모든 역할에 즉시 되돌아간다. b는 시간이 걸리고 실수 위험이 있다. c는 관리 지점이 흩어지고 되돌리기와 관계없다. Version 요소는 정책 언어 버전이지 정책 버전이 아니며, 예전 값을 쓰면 정책 변수 같은 기능만 잃는다(d)." }
  facts: [iam.policy.versions.max]

- id: iam.q.policies-notaction-allow
  type: quiz
  chapter: iam/policies
  topic: iam/policies/json-elements
  question: { ko: "어떤 사용자에게 아래 문 하나만 담긴 정책이 붙어 있다. \"Effect\": \"Allow\", \"NotAction\": \"iam:*\", \"Resource\": \"*\". 이 사용자에 대한 설명으로 맞는 것은?" }
  choices:
    - { id: a, text: { ko: "IAM 작업만 허용된다" } }
    - { id: b, text: { ko: "IAM 작업만 명시적으로 거부되고, 다른 작업은 아무것도 허용되지 않는다" } }
    - { id: c, text: { ko: "IAM을 뺀 모든 서비스의 모든 작업이 허용된다" } }
    - { id: d, text: { ko: "Allow와 NotAction은 함께 쓸 수 없어 정책이 저장되지 않는다" } }
  answer: c
  explanation: { ko: "NotAction은 적은 작업을 뺀 나머지 전부와 맞는다. Allow와 함께 쓰면 IAM 밖의 모든 작업이 허용된다. a는 Action과 혼동한 것이다. NotAction은 적은 작업을 거부하지 않는다. IAM 작업은 허용되지 않을 뿐(묵시적 거부) 명시적으로 거부되는 것은 아니다(b는 틀림). 두 요소는 함께 쓸 수 있고, 생각보다 넓게 허용될 수 있어 주의하라고 문서가 경고한다(d)." }
  facts: []

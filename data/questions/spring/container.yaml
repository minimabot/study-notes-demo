# 퀴즈. 정답은 보기 ID로 지정한다.
- id: spring.q.container-definition-vs-instance
  type: quiz
  chapter: spring/container
  topic: spring/container/registry-dlbf
  question: { ko: "new DefaultListableBeanFactory()를 만들고 registerBeanDefinition(\"greeter\", new RootBeanDefinition(Greeter.class))를 호출한 직후 containsSingleton(\"greeter\")를 부르면 무엇이 나오며, 그 이유는?" }
  choices:
    - { id: a, text: { ko: "true. 등록하는 순간 싱글톤을 만든다" } }
    - { id: b, text: { ko: "false. 등록한 것은 설계도(빈 정의)뿐이고 객체는 getBean이나 싱글톤 미리 만들기 단계에서 생긴다" } }
    - { id: c, text: { ko: "예외가 난다. refresh()를 부르기 전에는 정의를 등록할 수 없다" } }
    - { id: d, text: { ko: "false. 프로토타입이 기본 스코프라서 싱글톤으로 보관하지 않는다" } }
  answer: b
  explanation: { ko: "레지스트리는 정의를 beanDefinitionMap에 넣을 뿐 객체를 만들지 않는다. 객체는 getBean을 처음 부를 때, 또는 컨텍스트라면 refresh()의 finishBeanFactoryInitialization 단계에서 만들어진다(a는 틀림). DefaultListableBeanFactory는 refresh()가 없는 단순 공장이라 등록에 제약이 없다(c). 스코프 기본값은 빈 문자열이고 싱글톤으로 다룬다(d)." }
  facts: []

- id: spring.q.container-boot-override
  type: quiz
  chapter: spring/container
  topic: spring/container/annotation-registration
  question: { ko: "프레임워크 단독 예제에서는 잘 돌던 코드를 Spring Boot 앱으로 옮겼다. 서로 다른 @Configuration 클래스 두 곳에 같은 이름의 @Bean 메서드 auditClient()가 있다. Boot 앱을 시작하면 어떻게 되는가?" }
  choices:
    - { id: a, text: { ko: "나중에 등록된 정의가 앞의 것을 조용히 덮어쓴다" } }
    - { id: b, text: { ko: "두 빈이 모두 등록되고, 주입할 때 어느 것을 쓸지 모호하다는 오류가 난다" } }
    - { id: c, text: { ko: "시작이 실패한다. Boot는 같은 이름 덮어쓰기를 기본으로 막아 두 번째 등록에서 BeanDefinitionOverrideException이 난다" } }
    - { id: d, text: { ko: "먼저 등록된 정의가 이기고 두 번째 정의는 무시된다" } }
  answer: c
  explanation: { ko: "빈 정의는 이름을 키로 저장되므로 같은 이름 두 개는 공존할 수 없다(b는 틀림). 덮어쓰기 허용 여부는 프레임워크 기본값이 {{fact:spring.override.framework.default}}, Boot 기본값이 {{fact:spring.override.boot.default}}다. Boot는 컨텍스트 준비 중에 이 값을 공장에 넣으므로 a처럼 조용히 덮어쓰지 않고 예외로 시작을 멈춘다. 먼저 것을 남기고 무시하는 동작(d)은 없다." }
  facts: [spring.override.framework.default, spring.override.boot.default]

- id: spring.q.container-plain-factory
  type: quiz
  chapter: spring/container
  topic: spring/container/beanfactory-vs-context
  question: { ko: "테스트를 가볍게 하려고 ApplicationContext 대신 DefaultListableBeanFactory에 빈 정의를 직접 등록했다. 빈은 잘 만들어지는데 @Autowired 필드가 null이고 @PostConstruct 메서드도 불리지 않는다. 원인은?" }
  choices:
    - { id: a, text: { ko: "애너테이션을 처리하는 BeanPostProcessor가 등록되지 않았다. 단순 공장은 후처리기를 자동으로 찾아 등록하지 않는다" } }
    - { id: b, text: { ko: "DefaultListableBeanFactory는 리플렉션을 쓰지 않아 애너테이션을 읽을 수 없다" } }
    - { id: c, text: { ko: "빈 정의의 스코프가 비어 있어 프로토타입으로 만들어졌기 때문이다" } }
    - { id: d, text: { ko: "@PostConstruct는 Spring Boot에서만 동작한다" } }
  answer: a
  explanation: { ko: "@Autowired는 AutowiredAnnotationBeanPostProcessor, @PostConstruct는 CommonAnnotationBeanPostProcessor가 처리한다. ApplicationContext는 이런 후처리기를 자동으로 등록하지만 단순 공장은 하지 않는다. 공식 문서의 기능 비교표가 이 차이를 보여 준다. 공장도 리플렉션으로 생성자를 부른다(b는 틀림). 빈 스코프는 싱글톤으로 다뤄지며 애너테이션 처리와 관계없다(c). @PostConstruct는 프레임워크 기능이다(d)." }
  facts: []

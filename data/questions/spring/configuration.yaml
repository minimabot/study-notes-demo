# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다.
- id: spring.q.configuration-lite-call
  type: quiz
  chapter: spring/configuration
  topic: spring/configuration/full-vs-lite
  question: { ko: "@Configuration(proxyBeanMethods = false)인 AppConfig에서 orderService()와 invoiceService()가 각각 본문에서 rateLimiter()를 직접 호출해 생성자에 넘긴다. rateLimiter()도 @Bean이다. 컨테이너에 올라간 결과는?" }
  choices:
    - { id: a, text: { ko: "세 곳 모두 같은 RateLimiter 인스턴스를 쓴다. @Bean 메서드는 언제나 싱글톤을 돌려준다" } }
    - { id: b, text: { ko: "orderService와 invoiceService는 각자 새 RateLimiter를 받는다. 컨테이너의 rateLimiter 빈과도 다른 객체다" } }
    - { id: c, text: { ko: "시작이 실패한다. 라이트 모드에서는 @Bean 메서드를 호출할 수 없다" } }
    - { id: d, text: { ko: "orderService만 컨테이너의 빈을 받고, 나중에 만들어지는 invoiceService는 새 객체를 받는다" } }
  answer: b
  explanation: { ko: "같은 싱글톤이 나오는 것은 풀 모드에서 CGLIB 하위 클래스의 BeanMethodInterceptor가 호출을 가로채 컨테이너의 빈을 돌려주기 때문이다. proxyBeanMethods = false면 하위 클래스가 없어 rateLimiter()는 평범한 자바 메서드 호출이 되고, 호출마다 new가 실행된다(a는 풀 모드에서만 맞음). 호출 자체는 문법상 문제가 없다(c). 생성 순서와 관계없이 둘 다 새 객체를 받는다(d). 라이트 모드에서는 필요한 빈을 매개변수로 받는다." }
  facts: [spring.configuration.proxy-bean-methods.default]

- id: spring.q.configuration-deferred
  type: quiz
  chapter: spring/configuration
  topic: spring/configuration/auto-configuration
  question: { ko: "앱 개발자가 JsonCodec 인터페이스의 자기 구현 MyJsonCodec에 @Component를 붙였다. 라이브러리 자동 구성의 @ConditionalOnMissingBean(JsonCodec.class) 메서드는 이 사용자 빈을 보고 물러난다. 이것이 보장되는 내부 이유는?" }
  choices:
    - { id: a, text: { ko: "자동 구성 빈은 사용자 빈보다 나중에 객체로 만들어지기 때문이다" } }
    - { id: b, text: { ko: "AutoConfigurationImportSelector가 DeferredImportSelector라서, 사용자 설정과 컴포넌트 스캔을 모두 파싱한 뒤에 자동 구성 클래스를 처리하고 조건을 평가하기 때문이다" } }
    - { id: c, text: { ko: "@ConditionalOnMissingBean은 모든 정의 등록이 끝난 뒤 한꺼번에 평가되기 때문이다" } }
    - { id: d, text: { ko: "@AutoConfiguration이 proxyBeanMethods = false라서 사용자 빈이 우선하기 때문이다" } }
  answer: b
  explanation: { ko: "조건은 정의 단계에서 '지금까지 등록된 정의'만 보고 평가된다. 파서는 DeferredImportSelector를 모든 후보를 파싱한 뒤에 처리하므로, 자동 구성의 조건을 볼 때 사용자 정의가 이미 레지스트리에 있다. 객체 생성 순서(a)는 조건 평가와 무관하다. 조건은 정의를 등록하는 그때그때 평가되며 마지막에 한꺼번에 평가되지 않는다(c). 그래서 사용자 설정에서 이 조건을 쓰면 순서에 따라 결과가 달라진다. proxyBeanMethods(d)는 @Bean 메서드 간 호출 처리에 관한 것이다." }
  facts: []

- id: spring.q.configuration-debug
  type: quiz
  chapter: spring/configuration
  topic: spring/configuration/debugging
  question: { ko: "DataSource 자동 구성이 적용되지 않은 것 같다. 어떤 조건 때문에 빠졌는지 가장 직접 확인하는 방법은?" }
  choices:
    - { id: a, text: { ko: "--debug로 실행해 조건 평가 보고서의 Negative matches에서 해당 자동 구성과 이유를 찾는다" } }
    - { id: b, text: { ko: "spring.main.allow-bean-definition-overriding=true로 바꾼다" } }
    - { id: c, text: { ko: "자동 구성 클래스를 @ComponentScan 대상 패키지에 복사한다" } }
    - { id: d, text: { ko: "@Configuration 클래스에 proxyBeanMethods = true를 지정한다" } }
  answer: a
  explanation: { ko: "--debug(또는 debug=true)는 조건 평가 보고서를 출력한다. 자동 구성마다 맞은 조건과 안 맞은 조건, 그 이유가 나온다. Actuator의 conditions 엔드포인트도 같은 정보를 준다. b는 같은 이름 정의 덮어쓰기 설정으로 조건과 무관하다. c는 자동 구성을 스캔에 걸리게 해 조건 평가 순서를 깨뜨린다. d는 @Bean 메서드 호출 가로채기 설정이다." }
  facts: []

- id: spring.d.configuration-starter-backoff
  type: design
  chapter: spring/configuration
  topic: spring/configuration/auto-configuration
  scenario: { ko: "사내 감사 로그 라이브러리를 Spring Boot 스타터로 배포한다. 라이브러리는 AuditClient 인터페이스와 기본 구현 DefaultAuditClient를 제공한다. 요구: (가) 스타터를 의존성에 넣기만 하면 AuditClient 빈이 하나 생길 것, (나) 앱이 자기 AuditClient 구현을 빈으로 정의하면 라이브러리 빈은 등록되지 않을 것(빈이 둘이 되면 안 된다), (다) 같은 앱에 사내 다른 스타터의 자동 구성 TracingAutoConfiguration이 상황에 따라 AuditClient를 만들 수 있으며, 그때도 (나)가 지켜질 것, (라) 위 동작을 배포 전에 자동 테스트로 확인할 것. 알맞은 설계를 모두 고르라." }
  choices:
    - { id: a, text: { ko: "AuditAutoConfiguration을 @AutoConfiguration으로 선언하고, 클래스 이름을 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports에 적는다. 패키지는 앱의 스캔 범위에 걸리지 않는 곳에 둔다" } }
    - { id: b, text: { ko: "@Bean 메서드에 @ConditionalOnMissingBean(AuditClient.class)처럼 물러날 기준 타입을 인터페이스로 명시한다" } }
    - { id: c, text: { ko: "@ConditionalOnMissingBean만 붙이고 타입은 적지 않는다. 메서드 반환 타입은 DefaultAuditClient로 둔다" } }
    - { id: d, text: { ko: "@AutoConfiguration(after = TracingAutoConfiguration.class)로 그 자동 구성 뒤에 처리되게 한다" } }
    - { id: e, text: { ko: "AuditAutoConfiguration에 @Component를 붙여 앱의 컴포넌트 스캔으로도 잡히게 한다" } }
    - { id: f, text: { ko: "라이브러리 빈 이름을 auditClient로 정하고, 앱이 같은 이름으로 정의하면 덮어써지도록 기대한다" } }
    - { id: g, text: { ko: "ApplicationContextRunner로 사용자 설정이 있을 때와 없을 때 컨텍스트를 띄워 hasSingleBean(AuditClient.class)를 검사한다" } }
    - { id: h, text: { ko: "@Bean 메서드에 @Order(Ordered.LOWEST_PRECEDENCE)를 붙여 사용자 빈보다 뒤에 오게 한다" } }
  answer_set: [a, b, d, g]
  rubric:
    ko:
      - "a, b, d, g를 모두 고르면 정답이다."
      - "a: imports 파일에 적힌 자동 구성은 AutoConfigurationImportSelector(DeferredImportSelector)를 거쳐 사용자 설정과 스캔 결과를 모두 파싱한 뒤에 처리된다. 그래서 조건을 평가할 때 사용자 정의가 이미 보인다(요구 가, 나). 스캔 범위 밖에 두어야 이 순서를 우회하지 않는다. @AutoConfiguration은 proxyBeanMethods = false인 설정이므로 @Bean 메서드끼리 직접 부르지 말고 매개변수로 받는다."
      - "b: 앱이 정의하는 것은 AuditClient의 다른 구현일 수 있으므로 물러날 기준을 인터페이스로 적어야 요구 (나)가 지켜진다. 반환 타입은 구체 클래스로 두어 다른 조건이 쓸 타입 정보를 최대한 남기는 것이 Boot 문서의 권장이다."
      - "d: 조건은 '지금까지 처리된 정의'만 본다. 다른 자동 구성이 같은 타입을 만들 수 있으면 그 뒤에 처리되도록 순서를 정해야 요구 (다)가 지켜진다. 이 순서는 정의 등록 순서이며 객체 생성 순서가 아니다."
      - "g: ApplicationContextRunner는 작은 컨텍스트를 빠르게 띄워 사용자 설정 유무에 따른 결과를 검사한다(요구 라). 실패 시 조건 평가 보고서를 함께 출력하게 할 수 있다."
      - "c는 감점: 타입을 적지 않으면 반환 타입 DefaultAuditClient가 기준이 된다. 앱이 MyAuditClient를 정의해도 DefaultAuditClient가 없으므로 물러나지 않고 AuditClient 빈이 둘이 되어 요구 (나)를 어긴다."
      - "e는 감점: 스캔으로 등록되면 DeferredImportSelector 순서를 타지 않아 사용자 정의보다 먼저 조건이 평가될 수 있다. Boot 문서는 자동 구성이 스캔 대상이 되면 안 된다고 한다."
      - "f는 감점: Spring Boot는 같은 이름 정의 덮어쓰기를 기본으로 막아 두 번째 등록에서 시작이 실패한다({{fact:spring.override.boot.default}}). 허용하더라도 어느 정의가 이기는지가 처리 순서에 달려 요구 (나)를 보장하지 못한다."
      - "h는 감점: @Order는 같은 타입 빈 목록의 정렬에 쓰일 뿐, 정의 등록 여부나 조건 평가에 영향을 주지 않는다. 빈이 둘이 되는 문제는 그대로다."
  facts: [spring.override.boot.default]

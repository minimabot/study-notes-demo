# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다.
- id: spring.q.dependency-injection-ctor-cycle
  type: quiz
  chapter: spring/dependency-injection
  topic: spring/dependency-injection/cycles
  question: { ko: "spring.main.allow-circular-references=true로 바꿨는데도 A(B b)와 B(A a)처럼 생성자로 서로를 받는 두 빈은 여전히 BeanCurrentlyInCreationException으로 실패한다. 이유는?" }
  choices:
    - { id: a, text: { ko: "이 속성은 프로토타입 빈에만 적용되기 때문이다" } }
    - { id: b, text: { ko: "이른 참조 함수는 객체를 만든 뒤에 singletonFactories에 등록되는데, 생성자 순환에서는 어느 쪽도 객체 생성 단계에 도달하지 못해 넘겨줄 이른 참조가 없기 때문이다" } }
    - { id: c, text: { ko: "Boot가 이 속성을 무시하고 항상 false를 쓰기 때문이다" } }
    - { id: d, text: { ko: "생성자 주입은 리플렉션을 쓰지 않아 캐시를 볼 수 없기 때문이다" } }
  answer: b
  explanation: { ko: "doCreateBean은 createBeanInstance로 객체를 만든 뒤에야 addSingletonFactory로 이른 참조 함수를 등록한다. A를 만들려면 생성자 인자 B가 먼저 필요하고, B를 만들려면 A가 필요하므로 둘 다 객체가 없다. 다시 A의 생성을 시작하는 순간 beforeSingletonCreation이 '이미 만드는 중'을 보고 예외를 던진다. 속성은 싱글톤에 적용되고(a), Boot는 이 값을 공장에 넣는다(c). 생성자 호출도 리플렉션이다(d)." }
  facts: [spring.circular.boot.default, spring.singleton-registry.cache-count]

- id: spring.q.dependency-injection-name-match
  type: quiz
  chapter: spring/dependency-injection
  topic: spring/dependency-injection/resolution
  question: { ko: "PaymentGateway 타입 빈이 tossPayment, kakaoPayment 둘이고 @Primary·@Qualifier·@Priority는 어디에도 없다. 생성자 매개변수를 PaymentGateway kakaoPayment로 선언했다. 결과는?" }
  choices:
    - { id: a, text: { ko: "후보가 둘이라 NoUniqueBeanDefinitionException으로 실패한다" } }
    - { id: b, text: { ko: "등록 순서가 앞선 tossPayment가 들어간다" } }
    - { id: c, text: { ko: "매개변수 이름과 같은 이름의 빈 kakaoPayment가 들어간다" } }
    - { id: d, text: { ko: "두 빈을 모두 감싼 복합 프록시가 들어간다" } }
  answer: c
  explanation: { ko: "determineAutowireCandidate는 @Primary 후보가 없으면 주입 지점의 이름(매개변수·필드 이름)과 같은 빈 이름을 찾는다. kakaoPayment가 맞으므로 그 빈이 들어간다. 이름도 맞지 않았다면 @Priority를 보고, 그래도 못 고르면 a처럼 실패한다. 등록 순서로 고르지 않고(b), 단일 주입 지점에 복합 프록시를 만들지 않는다(d). 조용히 동작하므로 의도를 @Qualifier로 드러내는 편이 낫다." }
  facts: []

- id: spring.d.dependency-injection-order-payment-cycle
  type: design
  chapter: spring/dependency-injection
  topic: spring/dependency-injection/pitfalls
  scenario: { ko: "OrderService는 주문 확정 때 PaymentService.charge()를 부른다. PaymentService는 결제 승인 뒤 주문 상태를 바꾸려고 OrderService.markPaid()를 부른다. 둘 다 생성자 주입이고 @Transactional 메서드가 있다. Spring Boot 4.1.2 앱이 '...form a cycle' 오류로 뜨지 않는다. 시작 문제를 풀면서 구조도 건강하게 만드는 조치를 모두 고르라." }
  choices:
    - { id: a, text: { ko: "spring.main.allow-circular-references=true로 켠다" } }
    - { id: b, text: { ko: "주문 상태 변경(markPaid)을 OrderStatusUpdater 같은 별도 빈으로 빼고, OrderService와 PaymentService가 모두 그 빈만 의존하게 해 의존 방향을 한쪽으로 만든다" } }
    - { id: c, text: { ko: "PaymentService가 OrderService를 직접 부르지 않고 결제 완료 이벤트(PaymentCompleted)를 발행하게 하고, 주문 쪽 리스너가 상태를 바꾸게 한다" } }
    - { id: d, text: { ko: "두 서비스를 필드 주입(@Autowired 필드)으로 바꾼다" } }
    - { id: e, text: { ko: "PaymentService 생성자의 OrderService 매개변수에 @Lazy를 붙이고 구조는 그대로 둔다" } }
  answer_set: [b, c]
  rubric:
    ko:
      - "b와 c 중 하나 이상을 고르고 a·d를 고르지 않으면 정답이다. 둘 다 순환 자체를 없애 의존 그래프를 한 방향으로 만든다."
      - "b: 순환은 대개 '양쪽이 다 쓰는 작은 일'이 한쪽 서비스에 들어 있어서 생긴다. 그 일을 세 번째 빈으로 빼면 어느 서비스도 상대를 알 필요가 없다."
      - "c: 결제 쪽은 '결제가 끝났다'는 사실만 알리고 주문 쪽이 반응한다. 트랜잭션 경계가 중요하면 커밋 뒤 실행되는 @TransactionalEventListener를 검토한다."
      - "a는 감점: 생성자 순환은 이 설정으로도 풀리지 않는다. 세터·필드 순환을 허용하더라도 덜 만든 빈이 주입되고, 이른 참조 훅이 없는 후처리기가 빈을 감싸면 '원본이 주입된 뒤 감싸졌다'는 오류가 난다."
      - "d는 감점: Boot 기본값에서는 필드 순환도 시작 오류다. 설정까지 바꾸면 a와 같은 문제가 남고, 필수 의존이 생성자에 드러나지 않는다."
      - "e는 정답 보기가 아니다: 시작은 되지만 순환이 지연 해석 프록시 뒤에 숨는다. 장애 대응용 임시 조치로만 쓰고 b나 c로 고칠 일정을 남긴다."
  facts: [spring.circular.boot.default, spring.circular.framework.default]

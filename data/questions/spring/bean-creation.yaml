# 퀴즈. 정답은 보기 ID로 지정한다.
- id: spring.q.bean-creation-postconstruct-proxy
  type: quiz
  chapter: spring/bean-creation
  topic: spring/bean-creation/populate-initialize
  question: { ko: "@Service 빈 CacheWarmer의 @PostConstruct 메서드가 같은 클래스의 @Transactional 메서드 load()를 부른다. load()는 트랜잭션 없이 실행된다. 가장 정확한 이유는?" }
  choices:
    - { id: a, text: { ko: "@PostConstruct는 populateBean 전에 불려 트랜잭션 관리자가 아직 주입되지 않았기 때문이다" } }
    - { id: b, text: { ko: "@PostConstruct는 initializeBean의 초기화 전 후처리기 단계에서 원본 객체에 대해 불리고, 프록시는 그 뒤 초기화 후 단계에서 만들어지기 때문이다" } }
    - { id: c, text: { ko: "@PostConstruct 메서드에서는 예외를 던질 수 없어 트랜잭션이 꺼지기 때문이다" } }
    - { id: d, text: { ko: "@Transactional은 private 필드가 있는 클래스에는 적용되지 않기 때문이다" } }
  answer: b
  explanation: { ko: "initializeBean은 Aware → 초기화 전 후처리기(여기서 @PostConstruct) → 초기화 메서드 → 초기화 후 후처리기(여기서 AOP 프록시 생성) 순서다. @PostConstruct 안의 this는 원본이고, 원본 안의 호출은 어차피 프록시를 거치지 않는다. 속성 채우기는 초기화보다 먼저 끝나므로 a는 틀리다. @PostConstruct도 예외를 던질 수 있다(c). 필드 접근 제한자는 프록시 적용과 관계없다(d)." }
  facts: [spring.initialize-bean.step-count]

- id: spring.q.bean-creation-single-ctor
  type: quiz
  chapter: spring/bean-creation
  topic: spring/bean-creation/instantiate
  question: { ko: "@Component 클래스에 매개변수가 있는 public 생성자가 둘 있고 어느 쪽에도 @Autowired가 없으며, 매개변수 없는 생성자는 없다. 시작하면 어떻게 되는가?" }
  choices:
    - { id: a, text: { ko: "매개변수가 더 많은 생성자를 골라 주입한다" } }
    - { id: b, text: { ko: "선언 순서가 앞선 생성자를 고른다" } }
    - { id: c, text: { ko: "후보 생성자를 정하지 못해 기본 생성자로 만들려다 기본 생성자가 없어 실패한다" } }
    - { id: d, text: { ko: "두 생성자를 모두 시도해 성공하는 쪽을 쓴다" } }
  answer: c
  explanation: { ko: "AutowiredAnnotationBeanPostProcessor.determineCandidateConstructors는 @Autowired 생성자가 있거나 생성자가 하나뿐일 때 후보를 돌려준다. 둘 다 아니면 후보가 없고, createBeanInstance는 마지막 단계인 기본 생성자 인스턴스화로 떨어진다. 기본 생성자가 없으므로 빈 생성이 실패한다. 하나에 @Autowired를 붙이거나 생성자를 하나로 줄인다. a, b, d 같은 추측 규칙은 없다." }
  facts: []

- id: spring.q.bean-creation-lazy
  type: quiz
  chapter: spring/bean-creation
  topic: spring/bean-creation/preinstantiate-lazy
  question: { ko: "ReportClient 클래스에 @Lazy를 붙였다. 미리 만들어지는 싱글톤 ReportService가 생성자로 ReportClient를 주입받는다(주입 지점에는 @Lazy가 없다). ReportClient는 언제 만들어지는가?" }
  choices:
    - { id: a, text: { ko: "첫 HTTP 요청에서 ReportClient의 메서드가 처음 불릴 때" } }
    - { id: b, text: { ko: "시작 중 ReportService를 만들 때, 생성자 매개변수를 해석하면서" } }
    - { id: c, text: { ko: "ApplicationReadyEvent가 나간 직후" } }
    - { id: d, text: { ko: "만들어지지 않고 ReportService에는 null이 들어간다" } }
  answer: b
  explanation: { ko: "클래스의 @Lazy는 preInstantiateSingletons가 그 빈을 미리 만들지 않게 할 뿐이다. 미리 만드는 다른 빈이 주입받으면 그 생성자 매개변수를 해석할 때 getBean이 불려 바로 만들어진다. 주입 지점까지 늦추려면 매개변수에도 @Lazy를 붙여 지연 해석 프록시를 받아야 하고, 그때 a처럼 된다. c는 근거가 없고, 필수 의존에 null을 넣지 않는다(d)." }
  facts: [spring.boot.lazy-initialization.default]

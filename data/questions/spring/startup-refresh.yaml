# 퀴즈. 정답은 보기 ID로 지정한다.
- id: spring.q.startup-refresh-static-bfpp
  type: quiz
  chapter: spring/startup-refresh
  topic: spring/startup-refresh/pitfalls
  question: { ko: "@Configuration 클래스 MyConfig에 @Value(\"${app.region}\") 필드가 있고, 같은 클래스에 static이 아닌 @Bean 메서드가 BeanFactoryPostProcessor를 돌려준다. 앱은 뜨지만 region 필드가 null이다. 가장 정확한 설명은?" }
  choices:
    - { id: a, text: { ko: "application.properties가 아직 읽히지 않은 상태에서 @Value를 처리했기 때문이다" } }
    - { id: b, text: { ko: "처리기를 만들려고 invokeBeanFactoryPostProcessors 단계에서 MyConfig 객체가 먼저 만들어졌고, @Value를 처리하는 후처리기는 그 뒤 registerBeanPostProcessors 단계에서 등록되기 때문이다" } }
    - { id: c, text: { ko: "@Configuration 클래스에는 @Value를 쓸 수 없다" } }
    - { id: d, text: { ko: "BeanFactoryPostProcessor가 MyConfig의 빈 정의를 지웠기 때문이다" } }
  answer: b
  explanation: { ko: "비정적 @Bean 메서드는 설정 클래스 인스턴스가 있어야 부를 수 있다. 처리기는 ⑤ invokeBeanFactoryPostProcessors에서 필요하므로 MyConfig가 그때 만들어진다. @Value·@Autowired를 처리하는 AutowiredAnnotationBeanPostProcessor는 ⑥ registerBeanPostProcessors에서야 등록되므로 MyConfig는 처리를 받지 못한다. 메서드를 static으로 바꾸면 MyConfig 객체 없이 처리기를 만들 수 있다. Boot는 refresh() 전에 Environment를 준비하므로 a는 원인이 아니다. 설정 클래스에서도 @Value는 정상 동작한다(c). 정의가 지워졌다면 앱이 뜨지 않거나 빈이 없었을 것이다(d)." }
  facts: []

- id: spring.q.startup-refresh-runner-timing
  type: quiz
  chapter: spring/startup-refresh
  topic: spring/startup-refresh/boot-run
  question: { ko: "Spring Boot 웹 앱에서 ApplicationRunner는 언제 실행되는가?" }
  choices:
    - { id: a, text: { ko: "refresh()의 finishBeanFactoryInitialization 도중, 러너 빈이 만들어지는 순간" } }
    - { id: b, text: { ko: "ApplicationEnvironmentPreparedEvent 직후, 컨텍스트를 만들기 전" } }
    - { id: c, text: { ko: "refresh()가 끝나고(싱글톤 생성, 웹 서버 시작, ContextRefreshedEvent 이후) ApplicationStartedEvent 다음, ApplicationReadyEvent 전" } }
    - { id: d, text: { ko: "ApplicationReadyEvent 뒤, 트래픽 수용 상태가 된 다음" } }
  answer: c
  explanation: { ko: "SpringApplication.run()은 refreshContext → listeners.started(ApplicationStartedEvent) → callRunners → listeners.ready(ApplicationReadyEvent) 순서로 진행한다. 러너 빈 자체는 refresh() 안에서 만들어지지만 run 메서드는 그때 불리지 않는다(a). 컨텍스트가 없으면 빈도 없다(b). 준비 완료 이벤트는 러너가 모두 끝난 뒤에 나간다(d)." }
  facts: []

- id: spring.q.startup-refresh-scan-phase
  type: quiz
  chapter: spring/startup-refresh
  topic: spring/startup-refresh/phases
  question: { ko: "@SpringBootApplication이 붙은 주 클래스의 @ComponentScan이 처리되어 @Service 클래스들의 빈 정의가 등록되는 것은 refresh()의 어느 단계인가?" }
  choices:
    - { id: a, text: { ko: "prepareBeanFactory" } }
    - { id: b, text: { ko: "invokeBeanFactoryPostProcessors (ConfigurationClassPostProcessor가 실행될 때)" } }
    - { id: c, text: { ko: "registerBeanPostProcessors" } }
    - { id: d, text: { ko: "finishBeanFactoryInitialization" } }
  answer: b
  explanation: { ko: "ConfigurationClassPostProcessor는 BeanDefinitionRegistryPostProcessor이자 PriorityOrdered라서 ⑤ invokeBeanFactoryPostProcessors의 첫 묶음에서 돈다. 이때 주 클래스를 읽어 컴포넌트 스캔, @Import, 자동 구성, @Bean 메서드를 정의로 등록한다. prepareBeanFactory(a)는 기본 부품만 꽂고, registerBeanPostProcessors(c)는 후처리기 객체를 만들며, finishBeanFactoryInitialization(d)은 이미 모인 정의로 싱글톤을 만든다." }
  facts: []

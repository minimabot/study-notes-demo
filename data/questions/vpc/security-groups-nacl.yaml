# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: vpc.q.security-groups-nacl-ephemeral
  type: quiz
  chapter: vpc/security-groups-nacl
  topic: vpc/security-groups-nacl/ephemeral
  question: { ko: "퍼블릭 서브넷의 웹 서버에 사용자 지정 네트워크 ACL을 붙였다. 인바운드는 규칙 100으로 TCP 443(0.0.0.0/0)을 허용하고, 아웃바운드는 규칙 100으로 TCP 443(0.0.0.0/0)만 허용한다. 보안 그룹은 인바운드 443을 허용한다. 인터넷 사용자가 접속하면 요청은 서버 로그에 찍히지만 브라우저는 응답을 받지 못한다. 원인은?" }
  choices:
    - { id: a, text: { ko: "보안 그룹 아웃바운드에 443 응답 규칙이 없다" } }
    - { id: b, text: { ko: "네트워크 ACL 아웃바운드가 클라이언트 임시 포트로 가는 응답을 허용하지 않는다" } }
    - { id: c, text: { ko: "네트워크 ACL 인바운드 규칙 번호가 너무 낮다" } }
    - { id: d, text: { ko: "인터넷 게이트웨이가 443 응답을 거부한다" } }
  answer: b
  explanation: { ko: "응답은 서버의 443에서 클라이언트가 고른 임시 포트로 간다. 네트워크 ACL은 상태를 저장하지 않으므로 아웃바운드에 임시 포트 범위(여러 클라이언트를 받는다면 {{fact:vpc.ephemeral.aws-services}})를 열어야 한다. 보안 그룹은 상태를 저장해 허용된 요청의 응답을 아웃바운드 규칙과 상관없이 내보낸다(a는 틀림). 규칙 번호가 낮은 것은 문제가 아니고(c), 인터넷 게이트웨이는 트래픽을 거르지 않는다(d)." }
  facts: [vpc.ephemeral.aws-services]

- id: vpc.q.security-groups-nacl-block-ip
  type: quiz
  chapter: vpc/security-groups-nacl
  topic: vpc/security-groups-nacl/compare
  question: { ko: "공개 웹 사이트로 특정 대역(198.51.100.0/24)에서 공격성 요청이 들어온다. 다른 사용자의 HTTPS 접속은 그대로 받아야 한다. 네트워크 ACL 인바운드에는 규칙 100으로 443 허용이 있다. 가장 알맞은 조치는?" }
  choices:
    - { id: a, text: { ko: "보안 그룹에 198.51.100.0/24 거부 규칙을 추가한다" } }
    - { id: b, text: { ko: "네트워크 ACL 인바운드에 198.51.100.0/24 거부 규칙을 규칙 200으로 추가한다" } }
    - { id: c, text: { ko: "네트워크 ACL 인바운드에 198.51.100.0/24 거부 규칙을 규칙 50으로 추가한다" } }
    - { id: d, text: { ko: "기본 보안 그룹을 웹 서버에 추가로 붙인다" } }
  answer: c
  explanation: { ko: "보안 그룹에는 거부 규칙이 없다(a는 틀림). 네트워크 ACL은 낮은 번호부터 보고 처음 맞는 규칙에서 멈춘다. 규칙 200은 규칙 100(443 허용)에 먼저 걸려 평가되지 않는다(b는 틀림). 거부 규칙은 허용 규칙보다 낮은 번호인 50에 둔다. 기본 보안 그룹을 붙이면 규칙이 더해질 뿐 막는 효과는 없다(d)." }
  facts: []

- id: vpc.q.security-groups-nacl-sg-reference
  type: quiz
  chapter: vpc/security-groups-nacl
  topic: vpc/security-groups-nacl/security-groups
  question: { ko: "앱 서버는 Auto Scaling으로 수시로 늘고 줄며 IP가 계속 바뀐다. DB 인스턴스는 앱 서버에서 오는 3306 연결만 받아야 한다. 같은 VPC다. 관리 부담이 가장 적은 방법은?" }
  choices:
    - { id: a, text: { ko: "DB 보안 그룹 인바운드 3306의 출발지를 앱 서버 보안 그룹 ID로 지정한다" } }
    - { id: b, text: { ko: "앱 서버가 생길 때마다 그 IP를 /32로 DB 보안 그룹에 추가한다" } }
    - { id: c, text: { ko: "DB 서브넷 네트워크 ACL에서 3306을 VPC 전체 CIDR에 허용하고 보안 그룹은 모두 연다" } }
    - { id: d, text: { ko: "DB 보안 그룹에 3306 거부 규칙을 넣고 앱 서버만 예외로 둔다" } }
  answer: a
  explanation: { ko: "출발지에 보안 그룹 ID를 쓰면 그 보안 그룹이 붙은 리소스의 프라이빗 IP에서 오는 트래픽을 허용한다. 앱 서버가 바뀌어도 규칙을 고칠 필요가 없다. b는 같은 효과지만 계속 손이 간다. c는 VPC 안의 다른 리소스까지 DB에 닿게 한다. 보안 그룹에는 거부 규칙이 없다(d)." }
  facts: []

- id: vpc.d.security-groups-nacl-block-range
  type: design
  chapter: vpc/security-groups-nacl
  topic: vpc/security-groups-nacl/compare
  scenario: { ko: "퍼블릭 서브넷 두 곳에 인터넷용 웹 서버(HTTPS 443)가 있다. 서브넷에는 사용자 지정 네트워크 ACL이 연결돼 있고, 인바운드는 규칙 100(TCP 443, 0.0.0.0/0 허용), 아웃바운드는 규칙 100(TCP 1024-65535, 0.0.0.0/0 허용)이다. 웹 서버 보안 그룹은 인바운드 443(0.0.0.0/0)을 허용한다. 보안팀이 203.0.113.0/24 대역에서 오는 공격성 트래픽을 찾아냈다. 이 대역은 모든 포트에서 막고, 다른 사용자의 HTTPS는 그대로 받아야 한다. 알맞은 조치를 모두 고르라." }
  choices:
    - { id: a, text: { ko: "네트워크 ACL 인바운드에 규칙 90으로 203.0.113.0/24의 모든 트래픽 거부를 추가한다" } }
    - { id: b, text: { ko: "같은 네트워크 ACL을 두 퍼블릭 서브넷 모두에 연결해 두 서브넷에 같은 차단이 적용되게 한다" } }
    - { id: c, text: { ko: "응답도 막으려고 네트워크 ACL 아웃바운드 규칙 100(TCP 1024-65535 허용)을 지운다" } }
    - { id: d, text: { ko: "웹 서버 보안 그룹에 203.0.113.0/24 거부 규칙을 추가한다" } }
    - { id: e, text: { ko: "네트워크 ACL 인바운드에 규칙 110으로 203.0.113.0/24 거부를 추가한다" } }
    - { id: f, text: { ko: "웹 서버 보안 그룹의 인바운드 0.0.0.0/0 규칙을 지운다" } }
  answer_set: [a, b]
  rubric:
    ko:
      - "a, b를 모두 고르면 정답이다."
      - "a: 네트워크 ACL은 낮은 번호부터 보고 처음 맞는 규칙에서 멈춘다. 거부 규칙을 허용 규칙(100)보다 낮은 번호에 두어야 먼저 적용된다."
      - "b: 네트워크 ACL은 서브넷 단위다. 같은 ACL을 두 서브넷에 연결하면 한 곳에서 관리하면서 두 서브넷에 같은 규칙이 적용된다."
      - "c는 감점: 네트워크 ACL은 상태를 저장하지 않는다. 아웃바운드 임시 포트 허용을 지우면 다른 사용자에게 가는 HTTPS 응답도 모두 막힌다. 인바운드에서 요청이 막히면 그 대역으로 갈 응답은 애초에 생기지 않는다."
      - "d는 감점: 보안 그룹에는 거부 규칙이 없다."
      - "e는 감점: 규칙 110은 규칙 100(443 허용)보다 뒤라서, 그 대역의 443 요청은 규칙 100에서 이미 허용되고 끝난다."
      - "f는 감점: 다른 사용자의 HTTPS까지 막혀 요구를 어긴다."
  facts: []

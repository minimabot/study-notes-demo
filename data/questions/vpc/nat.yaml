# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: vpc.q.nat-shared-az
  type: quiz
  chapter: vpc/nat
  topic: vpc/nat/ha-cost
  question: { ko: "세 가용 영역(A, B, C)의 프라이빗 서브넷이 모두 영역 A의 NAT 게이트웨이 하나로 인터넷에 나간다. 영역 A에 장애가 났다. 어떤 일이 생기는가?" }
  choices:
    - { id: a, text: { ko: "NAT 게이트웨이는 리전 단위로 중복 구현되므로 B, C의 리소스는 영향이 없다" } }
    - { id: b, text: { ko: "B, C의 리소스도 인터넷으로 나가지 못한다. 영역마다 NAT 게이트웨이를 두고 같은 영역으로 라우팅해야 막을 수 있다" } }
    - { id: c, text: { ko: "B, C의 라우팅 테이블이 다른 영역의 인터넷 게이트웨이로 자동 전환된다" } }
    - { id: d, text: { ko: "NAT 게이트웨이가 다른 영역으로 자동 이동하므로 몇 분 뒤 복구된다" } }
  answer: b
  explanation: { ko: "영역 NAT 게이트웨이는 특정 가용 영역에 만들어지고 그 영역 안에서만 중복 구현된다(a는 틀림). 영역이 멈추면 그 NAT 게이트웨이를 쓰는 다른 영역의 리소스도 나가지 못한다. 라우팅이 자동으로 바뀌거나(c) NAT 게이트웨이가 옮겨 가는(d) 동작은 없다. 영역마다 NAT 게이트웨이를 두는 것이 AWS 권장 구성이다." }
  facts: []

- id: vpc.q.nat-port-allocation
  type: quiz
  chapter: vpc/nat
  topic: vpc/nat/limits-monitoring
  question: { ko: "프라이빗 서브넷의 수많은 컨테이너가 NAT 게이트웨이 하나를 거쳐 외부 결제 API 한 곳(같은 IP, 같은 포트 443)으로 동시에 연결한다. CloudWatch의 ErrorPortAllocation이 0보다 크게 나온다. 알맞은 대응은?" }
  choices:
    - { id: a, text: { ko: "NAT 게이트웨이에 보안 그룹을 붙여 연결 수를 늘린다" } }
    - { id: b, text: { ko: "NAT 게이트웨이의 인스턴스 크기를 키운다" } }
    - { id: c, text: { ko: "NAT 게이트웨이에 보조 IPv4 주소를 더 붙인다" } }
    - { id: d, text: { ko: "네트워크 ACL에서 443 아웃바운드 규칙 번호를 낮춘다" } }
  answer: c
  explanation: { ko: "IPv4 주소 하나는 고유 목적지 하나에 동시에 {{fact:vpc.natgw.conn-per-ip}}의 연결만 맺는다. ErrorPortAllocation은 출발지 포트를 잡지 못했다는 뜻이다. 주소를 더 붙이면 주소 수만큼 한도가 늘어나고, 한 NAT 게이트웨이에 {{fact:vpc.natgw.ips.max}}까지 붙일 수 있다. NAT 게이트웨이에는 보안 그룹을 붙일 수 없고(a), 크기를 고르지 않는다(b). 규칙 번호는 연결 한도와 관계없다(d)." }
  facts: [vpc.natgw.conn-per-ip, vpc.natgw.ips.max]

- id: vpc.q.nat-instance-srcdest
  type: quiz
  chapter: vpc/nat
  topic: vpc/nat/nat-instance
  question: { ko: "비용 때문에 퍼블릭 서브넷에 NAT 인스턴스를 만들었다. 탄력적 IP를 붙였고, 프라이빗 서브넷 경로도 0.0.0.0/0 → NAT 인스턴스로 잡았으며 보안 그룹도 맞다. 그래도 프라이빗 인스턴스가 밖으로 나가지 못한다. 빠진 설정은?" }
  choices:
    - { id: a, text: { ko: "NAT 인스턴스의 소스/대상 확인을 끈다" } }
    - { id: b, text: { ko: "NAT 인스턴스에 IPv6 탄력적 IP를 추가한다" } }
    - { id: c, text: { ko: "프라이빗 서브넷 라우팅 테이블에 인터넷 게이트웨이 경로를 추가한다" } }
    - { id: d, text: { ko: "NAT 인스턴스를 프라이빗 서브넷으로 옮긴다" } }
  answer: a
  explanation: { ko: "EC2 인스턴스는 기본으로 자기가 출발지나 목적지인 트래픽만 주고받는다. NAT 인스턴스는 남의 트래픽을 전달하므로 소스/대상 확인을 꺼야 한다. IPv6 탄력적 IP는 없다(b). 프라이빗 서브넷에 인터넷 게이트웨이 경로를 넣으면 퍼블릭 서브넷이 되어 NAT의 의미가 없어진다(c). NAT 인스턴스는 인터넷에 닿아야 하므로 퍼블릭 서브넷에 있어야 한다(d)." }
  facts: []

- id: vpc.d.nat-three-az-egress
  type: design
  chapter: vpc/nat
  topic: vpc/nat/ha-cost
  scenario: { ko: "운영 VPC에 세 가용 영역의 프라이빗 서브넷이 있고, 각 영역에 앱 서버가 고르게 퍼져 있다. 서버는 매일 OS 패키지 업데이트를 인터넷에서 받고, 로그와 백업 파일을 많이 S3로 올린다. 인터넷에서 서버로 들어오는 연결은 없어야 한다. 요구는 (1) 한 가용 영역이 멈춰도 다른 영역 서버의 업데이트가 끊기지 않을 것, (2) 그 범위 안에서 비용을 줄일 것, (3) 운영 부담을 늘리지 않을 것이다. 알맞은 설계를 모두 고르라." }
  choices:
    - { id: a, text: { ko: "각 가용 영역의 퍼블릭 서브넷에 NAT 게이트웨이를 하나씩 만들고, 영역마다 프라이빗 라우팅 테이블을 두어 0.0.0.0/0을 같은 영역의 NAT 게이트웨이로 보낸다" } }
    - { id: b, text: { ko: "S3용 게이트웨이 엔드포인트를 만들어 프라이빗 라우팅 테이블에 연결한다" } }
    - { id: c, text: { ko: "비용을 줄이려고 NAT 게이트웨이를 영역 A에 하나만 두고 세 영역이 함께 쓴다" } }
    - { id: d, text: { ko: "작은 NAT 인스턴스 하나를 두고 장애가 나면 사람이 새 인스턴스를 띄운다" } }
    - { id: e, text: { ko: "프라이빗 서브넷 라우팅 테이블에 0.0.0.0/0 → 인터넷 게이트웨이를 넣고 인스턴스에 퍼블릭 IP를 준다" } }
    - { id: f, text: { ko: "NAT 게이트웨이에 보안 그룹을 붙여 인바운드를 모두 막는다" } }
  answer_set: [a, b]
  rubric:
    ko:
      - "a, b를 모두 고르면 정답이다."
      - "a: NAT 게이트웨이는 한 영역에 속한다. 영역마다 두고 같은 영역으로 라우팅해야 한 영역 장애가 다른 영역에 번지지 않는다(AWS 권장 구성). 시간 요금은 영역 수만큼 들지만 영역 간 전송 요금이 생기지 않는다."
      - "b: S3로 가는 대량 트래픽을 게이트웨이 엔드포인트로 돌리면 그만큼 NAT 게이트웨이 처리 데이터 요금이 줄어든다. 문서가 제시하는 절감 방법이다."
      - "c는 감점: 시간 요금은 줄지만 영역 A 장애 때 세 영역이 모두 끊겨 요구 (1)을 어긴다. B, C에서 오는 트래픽에는 영역 간 전송 요금도 붙는다."
      - "d는 감점: 장애 조치를 사람이 하면 요구 (1), (3)을 어긴다. NAT 인스턴스는 처리량이 인스턴스 유형에 묶이고, 패치도 직접 해야 한다."
      - "e는 감점: 서브넷이 퍼블릭이 되어 인터넷에서 들어오는 연결을 막는 구조가 사라진다."
      - "f는 감점: NAT 게이트웨이에는 보안 그룹을 붙일 수 없다. 밖에서 먼저 거는 연결은 NAT 게이트웨이가 원래 받지 않는다."
      - "참고: 리전 NAT 게이트웨이도 영역을 따라 확장하지만, 최근 추가된 기능이라 시험 범위인지 확인되지 않았다. 고르지 않아도 감점하지 않는다."
  facts: []

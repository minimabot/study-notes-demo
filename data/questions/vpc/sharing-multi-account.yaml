# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: vpc.q.sharing-multi-account-participant-natgw
  type: quiz
  chapter: vpc/sharing-multi-account
  topic: vpc/sharing-multi-account/responsibilities
  question: { ko: "앱 팀 계정이 네트워크 계정에서 공유받은 프라이빗 서브넷에 인스턴스를 띄웠다. 인스턴스가 인터넷으로 업데이트를 받아야 해서, 앱 팀이 자기 계정에서 NAT 게이트웨이를 만들고 서브넷 라우팅 테이블을 고치려 한다. 어떻게 되는가?" }
  choices:
    - { id: a, text: { ko: "참여자도 공유 서브넷에 NAT 게이트웨이를 만들 수 있으므로 그대로 진행하면 된다" } }
    - { id: b, text: { ko: "참여자는 NAT 게이트웨이를 만들거나 라우팅 테이블을 고칠 수 없다. VPC 소유자인 네트워크 계정이 NAT 게이트웨이와 경로를 구성해야 한다" } }
    - { id: c, text: { ko: "참여자가 라우팅 테이블은 고칠 수 있지만 NAT 게이트웨이는 만들 수 없다" } }
    - { id: d, text: { ko: "참여자가 자기 계정의 인터넷 게이트웨이를 공유 VPC에 붙이면 된다" } }
  answer: b
  explanation: { ko: "공유 VPC에서 서브넷, 라우팅 테이블, 네트워크 ACL, 인터넷 게이트웨이, NAT 게이트웨이는 소유자가 만들고 관리한다. 참여자는 NAT 게이트웨이를 만들 수도 조회할 수도 없고(a), 라우팅 테이블은 조회만 된다(c). 인터넷 게이트웨이를 만들거나 붙이는 것도 참여자는 할 수 없다(d). 이 NAT 게이트웨이의 요금도 소유자가 낸다." }
  facts: []

- id: vpc.q.sharing-multi-account-az-id
  type: quiz
  chapter: vpc/sharing-multi-account
  topic: vpc/sharing-multi-account/az-sg-unshare
  question: { ko: "네트워크 계정이 공유한 서브넷 중 소유자 콘솔에서 'ap-northeast-2a'로 보이는 서브넷에 데이터베이스를 두었다. 앱 계정도 자기 콘솔에서 'ap-northeast-2a'로 보이는 서브넷을 골라 앱 서버를 두었는데, 영역 간 전송 요금이 나온다. 가장 그럴듯한 원인과 대응은?" }
  choices:
    - { id: a, text: { ko: "가용 영역 이름은 계정마다 실제 위치가 다를 수 있다. 가용 영역 ID로 같은 위치인지 맞춘다" } }
    - { id: b, text: { ko: "공유 서브넷끼리는 항상 영역 간 요금이 붙으므로 피할 수 없다" } }
    - { id: c, text: { ko: "참여자가 소유자 서브넷을 쓰면 리전 간 전송으로 계산된다" } }
    - { id: d, text: { ko: "참여자 리소스는 소유자 VPC의 로컬 경로를 쓰지 못해 인터넷 게이트웨이를 거친다" } }
  answer: a
  explanation: { ko: "AWS는 가용 영역 이름을 계정마다 따로 매핑한다. 그래서 두 계정의 같은 이름이 다른 위치일 수 있다. 계정을 넘어 위치를 맞출 때는 모든 계정에서 같은 가용 영역 ID(예: apne2-az1)를 쓴다. 같은 가용 영역 안의 전송은 계정과 관계없이 무료다(b는 틀림). 공유 서브넷은 같은 리전, 같은 VPC 안이고(c), 참여자 리소스도 로컬 경로로 통신한다(d)." }
  facts: []

- id: vpc.q.sharing-multi-account-default-sg
  type: quiz
  chapter: vpc/sharing-multi-account
  topic: vpc/sharing-multi-account/responsibilities
  question: { ko: "참여자 계정이 공유 서브넷에 인스턴스를 띄우면서 VPC의 기본 보안 그룹을 고르자 실패했다. 이유는?" }
  choices:
    - { id: a, text: { ko: "공유 서브넷에는 보안 그룹을 붙일 수 없다" } }
    - { id: b, text: { ko: "기본 보안 그룹은 VPC 소유자 것이므로 참여자는 쓸 수 없다. 자기 보안 그룹을 만들거나 소유자가 공유한 보안 그룹을 쓴다" } }
    - { id: c, text: { ko: "참여자는 보안 그룹을 만들 수 없고 네트워크 ACL만 쓸 수 있다" } }
    - { id: d, text: { ko: "소유자가 기본 보안 그룹을 AWS RAM으로 공유하면 된다" } }
  answer: b
  explanation: { ko: "기본 보안 그룹은 VPC 소유자 것이라 참여자가 인스턴스에 쓸 수 없다. 참여자는 공유 VPC에 자기 보안 그룹을 만들 수 있고, 소유자가 공유한 보안 그룹도 쓸 수 있다(a, c는 틀림). 기본 보안 그룹은 공유 대상이 아니다(d)." }
  facts: []

- id: vpc.d.sharing-multi-account-ten-teams
  type: design
  chapter: vpc/sharing-multi-account
  topic: vpc/sharing-multi-account/patterns
  scenario: { ko: "한 회사가 AWS Organizations에서 앱 팀마다 계정을 나눴다. 운영 환경에 앱 팀이 {{raw:10개}} 있고, 각 팀은 자기 계정에서 EC2·RDS 같은 애플리케이션 리소스만 관리하고 싶어 한다. 중앙 네트워크 팀의 요구는 (1) 인터넷 출구, 온프레미스 연결, 경로를 한곳에서 통제할 것, (2) 앱 팀이 경로·NAT·게이트웨이를 임의로 바꾸지 못할 것, (3) 운영 앱 사이 통신은 허용하되 개발 환경과는 경로가 섞이지 않을 것, (4) 팀이 늘어도 VPC·연결 관리 부담이 크게 늘지 않을 것이다. 알맞은 설계를 모두 고르라." }
  choices:
    - { id: a, text: { ko: "네트워크 계정에 운영용 VPC를 만들고, 앱 팀별 서브넷을 AWS RAM으로 각 팀 계정(또는 운영 OU)과 공유한다. 라우팅 테이블, 네트워크 ACL, NAT 게이트웨이는 네트워크 계정이 관리한다" } }
    - { id: b, text: { ko: "네트워크 계정의 전송 게이트웨이에 운영 공유 VPC, 개발 VPC, 온프레미스 연결을 붙이고, 운영과 개발 연결을 서로 다른 전송 게이트웨이 라우팅 테이블에 연결해 경로를 나눈다" } }
    - { id: c, text: { ko: "공유 VPC 안 팀 사이의 세부 통제는 각 팀의 보안 그룹으로 하고, 다른 계정의 보안 그룹을 참조하거나 소유자가 공유한 공통 보안 그룹을 쓴다" } }
    - { id: d, text: { ko: "각 팀 계정에 VPC를 하나씩 만들고 모든 VPC 쌍을 VPC 피어링으로 잇는다" } }
    - { id: e, text: { ko: "앱 팀 계정에 공유 서브넷의 라우팅 테이블 수정 권한을 IAM으로 주어 필요할 때 직접 바꾸게 한다" } }
    - { id: f, text: { ko: "기본 VPC의 서브넷을 공유해 바로 쓰게 한다" } }
    - { id: g, text: { ko: "팀 계정마다 NAT 게이트웨이와 인터넷 게이트웨이를 따로 두어 각자 인터넷으로 나가게 한다" } }
  answer_set: [a, b, c]
  rubric:
    ko:
      - "a, b, c를 모두 고르면 정답이다."
      - "a: 공유 VPC에서 서브넷·라우팅 테이블·네트워크 ACL·NAT 게이트웨이·인터넷 게이트웨이·전송 게이트웨이 연결은 소유자만 다룬다. 참여자는 자기 애플리케이션 리소스만 관리하므로 요구 (1), (2)를 구조로 보장한다. 팀이 늘어도 서브넷 공유만 추가하면 된다(요구 4). 참여자 수 할당량은 기본 {{fact:vpc.quota.shared-participants}}다."
      - "b: 전송 게이트웨이의 라우팅 테이블은 네트워크 계정에 있으므로 환경 사이 분리를 중앙에서 정한다(요구 3). 온프레미스와 송신 경로도 같은 허브에 모인다(요구 1). 개발 쪽이 다른 계정이면 전송 게이트웨이를 AWS RAM으로 공유해 연결을 받는다."
      - "c: 공유 VPC 안의 참여자끼리는 로컬 경로로 열려 있으므로 팀 사이 세부 통제는 보안 그룹이 맡는다. 다른 계정의 보안 그룹 참조, 보안 그룹 공유로 중앙 규칙을 둘 수 있다."
      - "d는 감점: 팀 수가 늘면 피어링 연결이 쌍의 수만큼 늘고, 피어링은 전이 라우팅이 안 되어 중앙 출구·온프레미스 연결을 공유할 수 없다. 요구 (1), (4)를 어긴다."
      - "e는 감점: 참여자는 공유 서브넷의 라우팅 테이블을 IAM 권한으로도 고칠 수 없다. 설령 가능하더라도 요구 (2)에 어긋난다."
      - "f는 감점: 기본 VPC의 서브넷은 공유할 수 없다."
      - "g는 감점: 공유 VPC에서는 참여자가 NAT 게이트웨이·인터넷 게이트웨이를 만들 수 없고, 계정별 출구는 요구 (1)의 중앙 통제와도 맞지 않는다."
      - "참고: 모든 팀이 각자 VPC를 갖고 공유받은 전송 게이트웨이에 붙는 허브 방식만으로 설계해도, 라우팅 테이블 분리와 자동 수락 끄기 등 중앙 통제 근거를 대면 감점하지 않는다."
  facts: [vpc.quota.shared-participants]

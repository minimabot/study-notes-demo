# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: sqs.q.vt-expire
  type: quiz
  chapter: sqs/visibility-timeout
  topic: sqs/visibility-timeout/basics
  question: { ko: "소비자가 메시지를 받은 뒤 처리 도중 프로세스가 죽었다. 이 메시지는 어떻게 되는가?" }
  choices:
    - { id: a, text: { ko: "즉시 데드레터 큐(DLQ)로 옮겨진다" } }
    - { id: b, text: { ko: "가시성 제한 시간이 끝나면 다시 보이고, 다른 소비자가 받을 수 있다" } }
    - { id: c, text: { ko: "SQS가 자동으로 삭제한다" } }
    - { id: d, text: { ko: "같은 소비자가 재시작할 때까지 잠긴다" } }
  answer: b
  explanation: { ko: "받은 메시지는 지워지지 않고 숨겨질 뿐이다. 삭제되지 않은 채 시간이 끝나면 다시 보인다. DLQ로 옮겨지는 것은 수신 횟수가 설정한 최대 수신 횟수를 넘었을 때다." }
  facts: []

- id: sqs.q.lambda-vt
  type: quiz
  chapter: sqs/visibility-timeout
  topic: sqs/visibility-timeout/lambda
  question: { ko: "Lambda 함수 제한 시간이 {{raw:30초}}이고 배치 대기 시간이 없다. AWS 권장에 맞는 큐의 가시성 제한 시간은 최소 얼마인가?" }
  choices:
    - { id: a, text: { ko: "함수 제한 시간과 같은 값" } }
    - { id: b, text: { ko: "함수 제한 시간의 {{raw:2배}}" } }
    - { id: c, text: { ko: "함수 제한 시간의 {{fact:lambda.sqs.vt-multiplier}}" } }
    - { id: d, text: { ko: "최댓값인 {{fact:sqs.visibility.max}}" } }
  answer: c
  explanation: { ko: "권장값은 함수 제한 시간 × {{fact:lambda.sqs.vt-multiplier}} + 배치 대기 시간이다. 같은 값(a)은 최소 조건일 뿐 스로틀 재시도 여유가 없다. 최댓값(d)은 소비자 장애 때 재처리가 지나치게 늦어진다." }
  facts: [lambda.sqs.vt-multiplier, sqs.visibility.max]

- id: sqs.q.extend-limit
  type: quiz
  chapter: sqs/visibility-timeout
  topic: sqs/visibility-timeout/limits
  question: { ko: "영상 변환 작업이 길게는 하루 가까이 걸린다. 소비자가 하트비트로 가시성 제한 시간을 계속 연장하면 해결되는가?" }
  choices:
    - { id: a, text: { ko: "된다. 연장할 때마다 한도가 새로 시작된다" } }
    - { id: b, text: { ko: "안 된다. 첫 수신 시점부터의 한도를 넘을 수 없으므로 Step Functions 등으로 작업을 나눠야 한다" } }
    - { id: c, text: { ko: "된다. 큐 설정에서 최댓값을 올리면 된다" } }
    - { id: d, text: { ko: "안 된다. FIFO 큐로 바꾸면 해결된다" } }
  answer: b
  explanation: { ko: "연장해도 {{fact:sqs.visibility.max-from-first-receive}} 한도는 초기화되지 않는다. 이보다 긴 작업은 단계를 나누거나 Step Functions처럼 긴 작업용 서비스로 옮긴다." }
  facts: [sqs.visibility.max-from-first-receive]

- id: sqs.d.order-worker
  type: design
  chapter: sqs/visibility-timeout
  topic: sqs/visibility-timeout/sizing
  scenario: { ko: "주문 처리 작업자가 Standard 큐에서 메시지를 받아 결제 API를 호출한다. 처리 시간은 평소 수 초지만, 결제사가 느릴 때는 몇 분까지 걸린다. 같은 주문이 두 번 결제되면 안 된다. 큐의 가시성 제한 시간과 소비자 동작을 설계하라." }
  choices:
    - { id: a, text: { ko: "가시성 제한 시간을 최댓값으로 길게 잡는다" } }
    - { id: b, text: { ko: "평소 처리 시간에 맞춰 짧게 잡고, 처리 중에는 주기적으로 연장(하트비트)한다" } }
    - { id: c, text: { ko: "결제 API 호출에 주문 ID 기반의 멱등 키를 쓴다" } }
    - { id: d, text: { ko: "FIFO 큐로 바꾸면 중복 결제는 생기지 않으므로 다른 조치는 필요 없다" } }
  answer_set: [b, c]
  rubric:
    ko:
      - "b와 c를 모두 고르면 정답이다. 하트비트(b)는 처리 중 재노출로 생기는 중복을 줄이고, 멱등 키(c)는 그래도 생길 수 있는 중복 전달을 막는다."
      - "a는 감점: 작업자가 죽으면 그 주문은 시간이 끝날 때까지 아무도 처리하지 못한다."
      - "d는 감점: 큐 종류와 상관없이 소비자 쪽 재시도와 장애로 중복 호출은 생길 수 있다. 결제처럼 되돌리기 어려운 작업은 멱등성이 필요하다."
  facts: [sqs.visibility.max]

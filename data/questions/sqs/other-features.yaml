# 퀴즈. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: sqs.q.other-features-temp-queue
  type: quiz
  chapter: sqs/other-features
  topic: sqs/other-features/temporary-queues
  question: { ko: "Java 서비스가 요청마다 응답용 SQS 큐를 만들고 지우느라 API 호출과 비용이 늘었다. 응답 하나하나는 트래픽이 작다. 가장 알맞은 방법은?" }
  choices:
    - { id: a, text: { ko: "Temporary Queue Client로 호스트 큐 하나 위에 가상 큐를 만들어 응답을 받는다" } }
    - { id: b, text: { ko: "응답용 큐를 FIFO 큐로 바꾼다" } }
    - { id: c, text: { ko: "응답용 큐의 메시지 보존 기간을 줄인다" } }
    - { id: d, text: { ko: "요청마다 SNS 주제를 만들어 응답을 보낸다" } }
  answer: a
  explanation: { ko: "가상 큐는 클라이언트 안의 자료 구조라 만들고 지울 때 SQS API를 부르지 않고 비용도 들지 않는다. 트래픽이 작은 응답 경로 여럿을 호스트 큐 하나로 묶는 용도다. FIFO 큐(b)나 보존 기간(c)은 큐를 만들고 지우는 호출 수를 줄이지 못한다. 요청마다 SNS 주제를 만드는 것(d)도 같은 문제를 다른 서비스로 옮길 뿐이다." }
  facts: []

- id: sqs.q.other-features-trace-header
  type: quiz
  chapter: sqs/other-features
  topic: sqs/other-features/message-attributes
  question: { ko: "메시지에 사용자 정의 메시지 속성을 이미 최대 개수만큼 붙였다. 여기에 AWS X-Ray 추적 헤더도 함께 전달하려면 어떻게 하는가?" }
  choices:
    - { id: a, text: { ko: "속성 이름을 AWS.TraceHeader로 하여 메시지 속성을 하나 더 붙인다" } }
    - { id: b, text: { ko: "메시지 시스템 속성 AWSTraceHeader에 추적 헤더를 넣는다" } }
    - { id: c, text: { ko: "추적 헤더는 SQS를 통과할 수 없으므로 본문에 직접 넣어야 한다" } }
    - { id: d, text: { ko: "큐 태그에 추적 헤더를 넣는다" } }
  answer: b
  explanation: { ko: "X-Ray 추적 헤더는 메시지 시스템 속성 AWSTraceHeader로 보낸다. 시스템 속성은 사용자 정의 속성 {{fact:sqs.message.attributes.max}} 한도와 별개이고, 크기도 메시지 크기에 들어가지 않는다. 메시지 속성 이름은 AWS.로 시작할 수 없고 개수도 이미 꽉 찼다(a). 본문에 넣는 것(c)은 X-Ray가 읽지 못한다. 태그(d)는 메시지가 아니라 큐에 붙는다." }
  facts: [sqs.message.attributes.max]

- id: sqs.q.other-features-cost-tags
  type: quiz
  chapter: sqs/other-features
  topic: sqs/other-features/cost-tags
  question: { ko: "재무팀이 SQS 요금을 팀별로 나눠 보고 싶어 한다. 큐마다 Team 태그를 붙였는데 청구 보고서에 팀별 구분이 보이지 않는다. 무엇이 빠졌는가?" }
  choices:
    - { id: a, text: { ko: "태그 값을 모두 대문자로 바꿔야 한다" } }
    - { id: b, text: { ko: "결제(Billing) 쪽에서 Team 태그 키를 비용 할당에 쓰도록 설정해야 한다" } }
    - { id: c, text: { ko: "팀마다 메시지 속성에 Team 값을 넣어야 한다" } }
    - { id: d, text: { ko: "큐 하나에 태그를 {{fact:sqs.tags.recommended-max}} 넘게 붙여야 한다" } }
  answer: b
  explanation: { ko: "큐에 태그를 붙이는 것만으로는 청구서가 나뉘지 않는다. 결제 쪽에서 그 태그 키를 비용 할당에 쓰도록 설정해야 보고서에 태그 키와 값이 나온다. 태그는 대소문자를 구분할 뿐 대문자일 필요는 없다(a). 메시지 속성(c)은 요금 집계에 쓰이지 않는다. 태그를 {{fact:sqs.tags.recommended-max}}보다 많이 붙이는 것(d)은 오히려 권장하지 않는다." }
  facts: [sqs.tags.recommended-max]

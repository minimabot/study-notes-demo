# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: sqs.q.integrations-partial-batch
  type: quiz
  chapter: sqs/integrations
  topic: sqs/integrations/lambda-errors
  question: { ko: "Lambda 함수가 SQS 배치를 처리하다 한 메시지에서 예외가 나면, 이미 처리한 다른 메시지까지 다시 처리된다. 성공한 메시지는 다시 처리되지 않게 하려면 어떻게 하는가?" }
  choices:
    - { id: a, text: { ko: "배치 크기를 최댓값인 {{fact:lambda.sqs.batch.max-standard}}로 늘린다" } }
    - { id: b, text: { ko: "이벤트 소스 매핑에 ReportBatchItemFailures를 켜고, 함수가 예외를 메시지마다 잡아 실패한 메시지 ID만 batchItemFailures로 돌려준다" } }
    - { id: c, text: { ko: "함수에 비동기 호출용 DLQ를 설정한다" } }
    - { id: d, text: { ko: "함수 안에서 예외를 다시 던져 Lambda가 실패를 알게 한다" } }
  answer: b
  explanation: { ko: "부분 배치 응답을 켜면 Lambda는 목록에 없는 메시지를 지우고 실패한 메시지만 큐에 남긴다. 배치를 키우면(a) 한 건 실패로 다시 처리되는 양이 오히려 늘어난다. SQS 트리거의 재시도와 DLQ는 원본 큐의 재드라이브 정책이 맡으므로 함수의 비동기 호출 설정(c)으로는 바뀌지 않는다. 예외를 던지면(d) 응답과 상관없이 배치 전체가 실패로 처리된다." }
  facts: [lambda.sqs.batch.max-standard]

- id: sqs.q.integrations-max-concurrency
  type: quiz
  chapter: sqs/integrations
  topic: sqs/integrations/lambda-scaling
  question: { ko: "SQS 큐를 읽는 Lambda 함수가 RDS DB에 쓴다. 메시지가 몰릴 때 DB 연결이 부족해지므로 동시 실행 함수 수를 묶고 싶다. 메시지가 스로틀되어 DLQ로 가는 일은 없어야 한다. 가장 알맞은 방법은?" }
  choices:
    - { id: a, text: { ko: "함수의 예약된 동시성만 낮게 건다" } }
    - { id: b, text: { ko: "이벤트 소스 매핑의 최대 동시성(Maximum concurrency)을 DB가 감당할 수준으로 정한다" } }
    - { id: c, text: { ko: "큐의 가시성 제한 시간을 줄인다" } }
    - { id: d, text: { ko: "배치 기간을 최댓값인 {{fact:lambda.sqs.batch.window.max}}로 늘린다" } }
  answer: b
  explanation: { ko: "최대 동시성은 이벤트 소스 매핑이 띄우는 함수 수를 묶고, 처리하지 못한 메시지는 큐에서 기다린다. 예약된 동시성만 걸면(a) 폴러가 가져온 메시지의 호출이 스로틀되어 다시 큐로 돌아가고, 수신 횟수가 쌓여 DLQ로 갈 수 있다. 가시성 제한 시간을 줄이면(c) 중복 처리만 늘어난다. 배치 기간(d)은 호출당 메시지 수를 늘릴 뿐 동시 실행 수의 상한이 아니다." }
  facts: [lambda.sqs.batch.window.max]

- id: sqs.q.integrations-fanout
  type: quiz
  chapter: sqs/integrations
  topic: sqs/integrations/sns-fanout
  question: { ko: "주문 이벤트를 결제, 재고, 알림 세 서비스가 모두 받아야 한다. 한 서비스가 멈춰도 나머지 서비스는 계속 처리해야 한다. 어떤 구성이 알맞은가?" }
  choices:
    - { id: a, text: { ko: "SQS 큐 하나에 세 서비스의 Lambda 함수를 모두 이벤트 소스 매핑으로 붙인다" } }
    - { id: b, text: { ko: "SQS 큐 하나를 원본으로 EventBridge 파이프를 세 개 만든다" } }
    - { id: c, text: { ko: "SNS 주제를 만들고, 서비스마다 SQS 큐를 하나씩 두어 그 주제를 구독시킨다" } }
    - { id: d, text: { ko: "SQS 큐 하나에 이벤트 소스 매핑 필터 조건을 서비스별로 건다" } }
  answer: c
  explanation: { ko: "SNS는 구독한 큐마다 메시지를 한 부씩 넣으므로 서비스마다 자기 큐와 재시도, DLQ를 따로 가진다. 큐 하나에 함수 여러 개를 붙이면(a) 메시지 하나를 한 함수만 받는다. 파이프 여러 개(b)도 메시지를 나눠 가질 뿐이다. SQS 필터(d)는 조건에 맞지 않는 메시지를 지우므로 다른 서비스가 받지 못한다." }
  facts: []

- id: sqs.d.integrations-order-fanout
  type: design
  chapter: sqs/integrations
  topic: sqs/integrations/lambda-errors
  scenario: { ko: "주문 서비스가 주문 이벤트를 발행하면 결제, 포인트 적립, 배송 요청 세 서비스가 각자 처리한다. 세 서비스 모두 Lambda 함수로 메시지를 처리한다. 포인트 적립 함수는 연결 수가 {{raw:50개}}로 묶인 DB에 쓴다. 지금은 배치에서 한 건만 실패해도 배치 전체가 다시 처리되어 포인트가 두 번 쌓인 적이 있다. 한 서비스의 장애가 다른 서비스에 번지면 안 된다. 알맞은 설계를 모두 고르라." }
  choices:
    - { id: a, text: { ko: "SNS 주제에 서비스별 SQS 큐를 하나씩 구독시키고, 각 큐를 해당 Lambda 함수의 이벤트 소스 매핑으로 연결한다" } }
    - { id: b, text: { ko: "각 이벤트 소스 매핑에 ReportBatchItemFailures를 켜고, 함수는 실패한 메시지 ID만 batchItemFailures로 돌려준다" } }
    - { id: c, text: { ko: "포인트 적립 큐의 이벤트 소스 매핑에 최대 동시성을 DB 연결 수에 맞춰 건다" } }
    - { id: d, text: { ko: "SQS 큐 하나에 세 함수를 모두 붙이고, 예약된 동시성으로 각 함수를 묶는다" } }
    - { id: e, text: { ko: "중복 처리를 막기 위해 큐의 가시성 제한 시간을 함수 제한 시간과 같은 값으로 줄인다" } }
    - { id: f, text: { ko: "각 원본 큐에 DLQ를 두고, 함수는 주문 ID로 이미 처리했는지 확인해 멱등하게 만든다" } }
  answer_set: [a, b, c, f]
  rubric:
    ko:
      - "a, b, c, f를 모두 고르면 정답이다."
      - "a: 서비스마다 큐가 있어야 메시지를 각자 받고, 한 서비스가 멈춰도 다른 큐는 계속 처리된다. 큐 정책은 aws:SourceArn으로 그 주제만 허용한다."
      - "b: 부분 배치 응답이 있어야 한 건 실패로 성공한 메시지까지 다시 처리되지 않는다. 함수가 예외를 밖으로 던지면 효과가 없다는 점까지 쓰면 좋다."
      - "c: 최대 동시성은 매핑이 띄우는 함수 수를 묶어 DB를 보호한다. 처리하지 못한 메시지는 큐에서 기다린다."
      - "f: 부분 배치 응답이 있어도 SQS는 적어도 한 번 전달이므로 중복은 생길 수 있다. 멱등 처리와 원본 큐의 DLQ(maxReceiveCount {{fact:sqs.dlq.lambda-max-receive.recommended}})가 필요하다."
      - "d는 감점: 큐 하나에 함수 여러 개를 붙이면 메시지 하나를 한 함수만 받는다. 예약된 동시성만으로 묶으면 스로틀된 메시지가 DLQ로 갈 수 있다."
      - "e는 감점: 가시성 제한 시간을 줄이면 스로틀 재시도 여유가 없어 중복 처리가 늘어난다. 권장값은 {{ch:sqs/visibility-timeout}}에서 계산한다."
  facts: [sqs.dlq.lambda-max-receive.recommended]

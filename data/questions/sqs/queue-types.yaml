# 장 sqs/queue-types 퀴즈. 수치는 {{fact:ID}}로만 쓴다.
- id: sqs.q.queue-types-price
  type: quiz
  chapter: sqs/queue-types
  topic: sqs/queue-types/choose
  question: { ko: "상품 가격 변경 이벤트를 큐로 보내 검색 색인에 반영한다. 같은 상품의 가격이 짧은 간격으로 여러 번 바뀌면, 마지막 변경이 마지막에 반영되어야 한다. 상품 수가 많아 상품끼리는 나란히 처리하고 싶다. 가장 알맞은 설계는?" }
  choices:
    - { id: a, text: { ko: "표준 대기열을 쓰고 소비자를 늘린다" } }
    - { id: b, text: { ko: "FIFO 대기열을 쓰고 모든 메시지에 같은 메시지 그룹 ID를 넣는다" } }
    - { id: c, text: { ko: "FIFO 대기열을 쓰고 상품 ID를 메시지 그룹 ID로 넣는다" } }
    - { id: d, text: { ko: "표준 대기열을 쓰고 생산자가 메시지를 하나씩 천천히 보낸다" } }
  answer: c
  explanation: { ko: "FIFO는 같은 메시지 그룹 안에서 순서를 지키고, 다른 그룹끼리는 나란히 처리할 수 있다. 상품 ID를 그룹 ID로 쓰면 상품별 순서와 병렬 처리를 함께 얻는다. a와 d는 표준 대기열이라 순서를 보장하지 않는다. 천천히 보내도 보장은 생기지 않는다. b는 순서는 지키지만 모든 메시지가 한 줄로 서서 상품끼리 나란히 처리할 수 없다." }
  facts: []

- id: sqs.q.queue-types-convert
  type: quiz
  chapter: sqs/queue-types
  topic: sqs/queue-types/fixed
  question: { ko: "운영 중인 표준 대기열에서 순서가 필요해졌다. FIFO로 바꾸는 방법으로 옳은 것은?" }
  choices:
    - { id: a, text: { ko: "큐 속성에서 FifoQueue를 true로 바꾼다" } }
    - { id: b, text: { ko: "큐 이름 끝에 .fifo를 붙여 이름을 바꾼다" } }
    - { id: c, text: { ko: "FIFO 큐를 새로 만들고, 생산자·소비자를 새 큐로 옮기면서 메시지 그룹 ID 등을 넣도록 코드를 고친다" } }
    - { id: d, text: { ko: "콘텐츠 기반 중복 제거를 켜면 FIFO처럼 동작한다" } }
  answer: c
  explanation: { ko: "큐 종류는 만든 뒤에 바꿀 수 없다. FIFO 큐를 새로 만들고 애플리케이션을 옮겨야 한다. 이때 모든 메시지에 메시지 그룹 ID를 넣고, 메시지별 지연을 큐 단위 지연으로 바꾸는 등 코드도 고친다. a와 b는 기존 큐에 할 수 없는 변경이다. d의 콘텐츠 기반 중복 제거는 FIFO 큐의 기능이며 표준 대기열을 FIFO로 만들지 않는다." }
  facts: []

- id: sqs.q.queue-types-throughput
  type: quiz
  chapter: sqs/queue-types
  topic: sqs/queue-types/compare
  question: { ko: "로그 이벤트를 매우 많이 모아 나중에 한꺼번에 저장한다. 순서는 상관없고, 같은 이벤트가 두 번 들어와도 저장 단계에서 걸러 낼 수 있다. 처리량이 가장 중요하다. 어떤 큐가 맞는가?" }
  choices:
    - { id: a, text: { ko: "표준 대기열" } }
    - { id: b, text: { ko: "FIFO 대기열 (기본 모드)" } }
    - { id: c, text: { ko: "FIFO 대기열에 메시지 그룹 하나만 사용" } }
    - { id: d, text: { ko: "어느 쪽이든 처리량 한도는 같다" } }
  answer: a
  explanation: { ko: "표준 대기열은 API 작업별 초당 호출 수가 사실상 무제한이다. 순서와 중복을 신경 쓰지 않아도 되면 표준이 맞다. FIFO 기본 모드(b)는 파티션당 API 작업별 {{fact:sqs.fifo.tps.per-partition}} 한도가 있다. c는 그룹이 하나라 나란히 처리할 수도 없다. d는 틀렸다. 두 종류의 처리량 한도는 다르다." }
  facts: [sqs.fifo.tps.per-partition]

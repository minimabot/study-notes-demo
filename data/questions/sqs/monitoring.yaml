# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: sqs.q.mon-dlq-alarm
  type: quiz
  chapter: sqs/monitoring
  topic: sqs/monitoring/alarms-scaling
  question: { ko: "처리에 실패한 메시지가 데드레터 큐(DLQ)로 옮겨지면 바로 알림을 받고 싶다. DLQ의 어떤 지표에 CloudWatch 경보를 거는 것이 맞는가?" }
  choices:
    - { id: a, text: { ko: "`NumberOfMessagesSent`" } }
    - { id: b, text: { ko: "`ApproximateNumberOfMessagesVisible`" } }
    - { id: c, text: { ko: "`NumberOfEmptyReceives`" } }
    - { id: d, text: { ko: "`NumberOfMessagesDeleted`" } }
  answer: b
  explanation: { ko: "AWS는 DLQ 상태를 `ApproximateNumberOfMessagesVisible`로 보라고 권한다. 값이 0보다 커지면 DLQ에 메시지가 있다는 뜻이다(b). `NumberOfMessagesSent`(a)는 직접 보낸 메시지만 세고, 최대 수신 횟수를 넘어 자동으로 옮겨진 메시지는 세지 않는다. `NumberOfEmptyReceives`(c)는 빈 수신 호출 수이고, `NumberOfMessagesDeleted`(d)는 지운 메시지 수라서 DLQ로 들어온 것을 알려 주지 못한다." }
  facts: []

- id: sqs.q.mon-empty-queue
  type: quiz
  chapter: sqs/monitoring
  topic: sqs/monitoring/troubleshooting
  question: { ko: "소비자가 계속 빈 응답만 받는다. 큐가 정말 비었는지 CloudWatch 지표로 확인하려면 어떻게 판단하는가?" }
  choices:
    - { id: a, text: { ko: "`NumberOfEmptyReceives`가 높으면 비었다고 본다" } }
    - { id: b, text: { ko: "`ApproximateNumberOfMessagesVisible`이 0이면 바로 비었다고 본다" } }
    - { id: c, text: { ko: "`ApproximateNumberOfMessagesVisible`, `ApproximateNumberOfMessagesNotVisible`, `ApproximateNumberOfMessagesDelayed`가 몇 분 동안 모두 0이면 비었다고 본다" } }
    - { id: d, text: { ko: "`NumberOfMessagesSent`와 `NumberOfMessagesDeleted`가 같으면 비었다고 본다" } }
  answer: c
  explanation: { ko: "받을 수 있는 메시지, 처리 중인 메시지, 지연 중인 메시지가 몇 분 동안 모두 0이어야 빈 큐로 본다(c). a는 짧은 폴링이나 빠른 소비자 때문에도 높아지므로 큐 상태를 정확히 보여 주지 않는다. b는 처리 중이거나 지연 중인 메시지를 놓친다. d의 두 지표는 재시도와 중복 삭제까지 세므로 고유 메시지 수와 맞지 않는다." }
  facts: []

- id: sqs.q.mon-cloudtrail-data
  type: quiz
  chapter: sqs/monitoring
  topic: sqs/monitoring/cloudtrail
  question: { ko: "감사팀이 어떤 IAM 역할이 특정 큐에 `SendMessage`를 호출했는지 기록으로 남기길 원한다. 아무 설정도 하지 않은 계정에서 필요한 조치는?" }
  choices:
    - { id: a, text: { ko: "필요 없다. CloudTrail 이벤트 기록에 {{fact:cloudtrail.event-history.retention}} 동안 남는다" } }
    - { id: b, text: { ko: "CloudTrail 추적을 만들고, 고급 이벤트 선택기로 `AWS::SQS::Queue` 데이터 이벤트를 기록하게 한다" } }
    - { id: c, text: { ko: "CloudWatch의 `NumberOfMessagesSent` 지표를 본다" } }
    - { id: d, text: { ko: "큐에 AWS X-Ray 추적 헤더를 켠다" } }
  answer: b
  explanation: { ko: "`SendMessage`는 데이터 이벤트다. 데이터 이벤트는 기본으로 기록되지 않고 이벤트 기록에도 나오지 않는다. 추적이나 이벤트 데이터 스토어에서 고급 이벤트 선택기로 켜야 한다(b). a의 이벤트 기록은 관리 이벤트만 보여 준다. c는 보낸 개수만 알려 주고 누가 보냈는지는 알려 주지 않는다. d는 요청 흐름과 지연을 보는 도구이지 감사 기록이 아니다." }
  facts: [cloudtrail.event-history.retention]

- id: sqs.d.mon-falling-behind
  type: design
  chapter: sqs/monitoring
  topic: sqs/monitoring/alarms-scaling
  scenario: { ko: "이미지 변환 작업자가 EC2 Auto Scaling 그룹에서 돌며 Standard 큐의 메시지를 처리한다. 업로드가 몰리는 시간에는 처리가 밀려 사용자가 결과를 늦게 받는다. 작업자는 지금 짧은 폴링으로 메시지를 하나씩 받아 하나씩 지운다. 처리 지연을 알아차리고, 작업자 수를 부하에 맞추고, 같은 인스턴스로 더 많이 처리하도록 설계하라. 맞는 것을 모두 고른다." }
  choices:
    - { id: a, text: { ko: "`ApproximateAgeOfOldestMessage`에 경보를 걸어, 가장 오래된 메시지가 허용 지연을 넘으면 알림을 받는다" } }
    - { id: b, text: { ko: "인스턴스당 백로그(받을 수 있는 메시지 수 ÷ `InService` 인스턴스 수)를 지표 수학으로 계산해 목표 추적 조정 정책의 지표로 쓴다. 목표값은 허용 지연 ÷ 메시지당 평균 처리 시간이다" } }
    - { id: c, text: { ko: "긴 폴링으로 바꾸고, `ReceiveMessage` 한 번에 최대 {{fact:sqs.batch.max-messages}}까지 받아 `DeleteMessageBatch`로 지운다" } }
    - { id: d, text: { ko: "`ApproximateNumberOfMessagesVisible` 값 자체를 목표 추적의 목표값으로 삼는다" } }
    - { id: e, text: { ko: "`NumberOfMessagesSent`가 늘면 인스턴스를 늘리는 단계 조정 정책을 만든다" } }
    - { id: f, text: { ko: "빈 응답을 줄이려고 폴링 간격을 더 짧게 하고 스레드 하나로 여러 큐를 돌게 한다" } }
  answer_set: [a, b, c]
  rubric:
    ko:
      - "a, b, c를 모두 고르면 정답이다. a는 사용자가 느끼는 지연을 직접 잡아낸다. b는 AWS Auto Scaling 문서가 안내하는 방식으로, 인스턴스 수를 고려해 백로그에 비례하게 늘리고 줄인다. c는 빈 응답과 요청 수를 줄이고 왕복 한 번에 더 많은 메시지를 처리한다."
      - "d는 감점: 큐 길이만 목표로 삼으면 인스턴스 수를 고려하지 못해, 큐가 줄어드는 동안에도 인스턴스를 필요 이상으로 더할 수 있다."
      - "e는 감점: 보낸 양은 들어오는 양일 뿐 쌓인 일과 처리 속도를 보여 주지 않는다. 소비자가 따라잡고 있어도 늘리고, 밀려도 보낸 양이 그대로면 늘리지 않는다."
      - "f는 감점: 짧은 폴링을 더 자주 하면 빈 응답과 비용이 는다. 스레드 하나로 여러 큐를 긴 폴링하면 한 큐에서 기다리는 동안 다른 큐의 메시지를 처리하지 못한다. AWS는 큐마다 스레드를 따로 두라고 권한다."
      - "a 없이 b, c만 고르면 부분 점수: 스케일링이 최대 용량에 닿거나 작업자에 오류가 나도 지연을 알아차리지 못한다."
  facts: [sqs.batch.max-messages]

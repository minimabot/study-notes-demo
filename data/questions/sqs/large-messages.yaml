# 퀴즈와 설계 과제. 정답은 보기 ID로 지정한다. 수치는 {{fact:ID}}로만 쓴다.
- id: sqs.q.large-over-limit
  type: quiz
  chapter: sqs/large-messages
  topic: sqs/large-messages/claim-check
  question: { ko: "메시지 최대 크기를 넘는 데이터를 SQS로 소비자에게 넘겨야 한다. AWS가 안내하는 방법은?" }
  choices:
    - { id: a, text: { ko: "큐 속성 MaximumMessageSize를 기본값보다 크게 올린다" } }
    - { id: b, text: { ko: "본문은 S3에 저장하고, 큐에는 S3 객체의 참조만 보낸다" } }
    - { id: c, text: { ko: "FIFO 큐로 바꾸면 더 큰 메시지를 보낼 수 있다" } }
    - { id: d, text: { ko: "메시지 속성에 본문을 나눠 담는다" } }
  answer: b
  explanation: { ko: "큰 본문은 S3에 두고 참조만 보내는 것이 AWS 안내다. 확장 클라이언트 라이브러리가 이 일을 대신해 준다. a는 틀리다. 기본값이 이미 최댓값 {{fact:sqs.message.max-size}}이고 더 줄일 수만 있다. c도 틀리다. 크기 한도는 큐 종류와 상관없다. d도 틀리다. 메시지 속성도 메시지 크기에 함께 계산된다." }
  facts: [sqs.message.max-size]

- id: sqs.q.large-cli-consumer
  type: quiz
  chapter: sqs/large-messages
  topic: sqs/large-messages/extended-client
  question: { ko: "생산자는 Java 확장 클라이언트 라이브러리로 큰 메시지를 보낸다. 운영자가 AWS CLI로 같은 큐의 메시지를 받아 보면 무엇이 보이는가?" }
  choices:
    - { id: a, text: { ko: "S3에서 자동으로 가져온 원래 본문" } }
    - { id: b, text: { ko: "S3 객체를 가리키는 참조 정보" } }
    - { id: c, text: { ko: "아무 메시지도 받을 수 없다" } }
    - { id: d, text: { ko: "본문의 앞부분만 잘린 채로 보인다" } }
  answer: b
  explanation: { ko: "확장 클라이언트는 해당 SDK와 함께 쓸 때만 S3에서 본문을 꺼내 온다. CLI, 콘솔, HTTP API, 다른 SDK는 큐에 실제로 들어 있는 참조만 본다. 그래서 a는 틀리다. 메시지는 보통 메시지라 받을 수는 있으므로 c도 틀리다. SQS가 본문을 잘라 주지는 않으므로 d도 틀리다." }
  facts: []

- id: sqs.q.large-orphan
  type: quiz
  chapter: sqs/large-messages
  topic: sqs/large-messages/cleanup
  question: { ko: "확장 클라이언트로 큰 메시지를 보내는 큐가 있다. 일부 메시지가 처리되지 못하고 보관 기간을 넘겨 만료되었다. S3에 있던 본문은 어떻게 되는가?" }
  choices:
    - { id: a, text: { ko: "SQS가 만료와 함께 S3 객체도 지운다" } }
    - { id: b, text: { ko: "S3 객체는 남는다. 수명 주기 규칙 같은 정리 수단이 필요하다" } }
    - { id: c, text: { ko: "S3 객체가 자동으로 DLQ로 옮겨진다" } }
    - { id: d, text: { ko: "확장 클라이언트가 만료를 감지해 지운다" } }
  answer: b
  explanation: { ko: "SQS는 S3 객체를 모른다. 객체를 지우는 것은 확장 클라이언트로 메시지를 삭제할 때뿐이다. 그래서 a와 d는 틀리다. 만료처럼 삭제 호출 없이 메시지가 사라지면 객체만 남는다. DLQ는 메시지를 옮기는 기능이고 S3 객체와는 관계없으므로 c도 틀리다. 버킷에 수명 주기 규칙을 걸어 둔다." }
  facts: []

- id: sqs.d.large-documents
  type: design
  chapter: sqs/large-messages
  topic: sqs/large-messages/claim-check
  scenario: { ko: "계약 서비스가 '계약 체결' 이벤트를 Standard 큐로 보낸다. 이벤트마다 수 MB 크기의 PDF 문서가 붙고, 큰 것은 {{raw:50MB}}에 이른다. 소비자는 Java로 만든 문서 보관 서비스와 Python으로 만든 알림 서비스다. 처리하지 못한 메시지는 DLQ로 보내고 원인을 고친 뒤 다시 처리한다. 저장 요금이 계속 쌓이지 않아야 한다. 문서를 어떻게 전달할지 설계하라." }
  choices:
    - { id: a, text: { ko: "문서를 S3에 저장하고 메시지에는 버킷과 키만 담는다(직접 구현하거나 Java·Python 확장 클라이언트 라이브러리를 쓴다)" } }
    - { id: b, text: { ko: "문서를 메시지 최대 크기보다 작은 조각으로 나눠 여러 메시지로 보내고, 소비자가 다시 이어 붙인다" } }
    - { id: c, text: { ko: "S3 버킷에 수명 주기 만료 규칙을 걸고, 그 기간을 원본 큐와 DLQ에서 메시지가 머물 수 있는 시간보다 길게 잡는다" } }
    - { id: d, text: { ko: "소비자 하나가 처리를 마치면 바로 S3 객체를 지운다" } }
    - { id: e, text: { ko: "두 소비자의 실행 역할에 해당 버킷 객체의 읽기 권한을 준다" } }
  answer_set: [a, c, e]
  rubric:
    ko:
      - "a, c, e를 모두 고르면 정답이다. a는 문서를 큐 밖에 두어 크기 한도({{fact:sqs.message.max-size}})와 요청 요금 문제를 함께 피한다. 확장 클라이언트는 Java와 Python을 모두 지원하므로 두 소비자가 같은 방식으로 읽을 수 있다."
      - "c는 만료되거나 DLQ에 남았다 버려진 메시지 때문에 S3에 남는 객체를 정리한다. 기간이 큐 보관 기간보다 짧으면 DLQ에서 다시 처리할 때 문서가 이미 없다."
      - "e는 클레임 체크 방식의 전제다. 소비자가 S3를 읽지 못하면 참조만 받고 처리에 실패한다."
      - "b는 감점: Standard 큐는 순서를 보장하지 않고 중복 전달도 있어서 조각을 모으는 코드가 복잡해진다. 조각 하나만 DLQ로 가도 문서 전체를 다시 맞춰야 하고, 요청 수도 늘어난다."
      - "d는 감점: 이 큐에는 소비자가 둘이다. 먼저 끝난 쪽이 객체를 지우면 다른 쪽이 문서를 읽지 못한다. 또 메시지가 다시 보여 재처리될 때도 문서가 없다. 객체를 지우는 일은 모든 처리가 끝난 뒤, 또는 수명 주기 규칙에 맡긴다."
  facts: [sqs.message.max-size, sqs.extended.max-payload]

            ko: 고가용성을 위해 전송 게이트웨이를 더 만들 필요는 없고, 재해 복구를 위해 리전마다 하나씩 둔다
          source: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-best-design-practices.html
          checked: 2026-11-02
        - claim:
            ko: 전송 게이트웨이를 여러 개 쓰면 각각 고유한 ASN을 쓴다
          source: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-best-design-practices.html

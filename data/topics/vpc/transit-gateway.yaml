# 장: 전송 게이트웨이
chapter:
  id: vpc/transit-gateway
  title:
    ko: 전송 게이트웨이(Transit Gateway)
  track: exam-core
  doc_source: https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html
  topics:
    - id: vpc/transit-gateway/concepts
      title:
        ko: 허브와 연결(attachment)
      exam_tags:
        - SAA-C03#3.4
        - SAP-C03#1.3
        - SAP-C03#1.4
        - SOA-C03#5.1
      recommended:
        - claim:
            ko: VPC 연결에는 여러 가용 영역을 켠다
          source: https://docs.aws.amazon.com/vpc/latest/tgw/how-transit-gateways-work.html
          checked: 2026-11-02
        - claim:
            ko: 전송 게이트웨이 VPC 연결마다 작은 CIDR의 전용 서브넷을 쓰고, 그 서브넷의 네트워크 ACL은 열어 둔다
          source: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-best-design-practices.html
          checked: 2026-11-02
        - claim:
            ko: VPC 피어링에서 옮길 때는 MTU 차이로 인한 패킷 손실을 피하려고 두 VPC를 동시에 옮긴다
          source: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-best-design-practices.html
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html
        - https://docs.aws.amazon.com/vpc/latest/tgw/how-transit-gateways-work.html
        - https://docs.aws.amazon.com/vpc/latest/tgw/tgw-vpc-attachments.html
    - id: vpc/transit-gateway/routing
      title:
        ko: 라우팅 테이블, association, propagation, 분리
      exam_tags:
        - SAA-C03#1.2
        - SAP-C03#1.4
        - SOA-C03#5.3
      recommended:
        - claim:
            ko: 설계에 꼭 필요하지 않다면 전송 게이트웨이 라우팅 테이블 수를 늘리지 않는다
          source: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-best-design-practices.html
          checked: 2026-11-02
        - claim:
            ko: Direct Connect 게이트웨이 연결과 BGP Site-to-Site VPN 연결에는 경로 전파를 켠다
          source: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-best-design-practices.html
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/vpc/latest/tgw/how-transit-gateways-work.html
        - https://docs.aws.amazon.com/vpc/latest/tgw/tgw-route-tables.html
        - https://docs.aws.amazon.com/vpc/latest/tgw/tgw-transit-gateways.html

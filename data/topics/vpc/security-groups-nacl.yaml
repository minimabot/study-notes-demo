    - id: vpc/security-groups-nacl/compare
      title:
        ko: 둘의 비교와 함께 쓰기
      exam_tags:
        - SAA-C03#1.2
        - SOA-C03#5.3
        - DOP-C02#6.2
      recommended:
        - claim:
            ko: 보안 그룹과 비슷한 규칙의 네트워크 ACL을 만들어 VPC에 보안 계층을 하나 더한다
          source: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
          checked: 2026-11-02
        - claim:
            ko: SSH(22)·RDP(3389) 인바운드는 특정 IP 주소 대역에만 허용하고, 넓은 포트 범위를 열지 않는다
          source: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
          checked: 2026-11-02
        - claim:
            ko: 보안 그룹을 만들고 수정하는 권한은 특정 IAM 주체에게만 준다
          source: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
          checked: 2026-11-02

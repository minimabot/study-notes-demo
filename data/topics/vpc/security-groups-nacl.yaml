    - id: vpc/security-groups-nacl/nacl
      title:
        ko: 네트워크 ACL
      exam_tags:
        - SAA-C03#1.2
        - SOA-C03#5.1
        - DOP-C02#6.2
      recommended:
        - claim:
            ko: 네트워크 ACL 규칙 번호는 10이나 100 간격으로 매겨 나중에 규칙을 끼워 넣을 수 있게 한다
          source: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html

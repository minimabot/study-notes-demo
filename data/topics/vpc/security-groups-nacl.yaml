      exam_tags:
        - SAA-C03#1.2
        - SOA-C03#5.1
        - DOP-C02#6.2
      recommended:
        - claim:
            ko: 기본 보안 그룹 대신 리소스나 리소스 묶음별 보안 그룹을 만들어 쓴다
          source: https://docs.aws.amazon.com/vpc/latest/userguide/default-security-group.html
          checked: 2026-11-02
        - claim:
            ko: 보안 그룹은 필요한 최소 개수로 만들고, 기능과 보안 요구가 비슷한 리소스끼리 묶는다
          source: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html

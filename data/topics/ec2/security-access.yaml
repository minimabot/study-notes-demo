      exam_tags:
        - SAA-C03#1.2
        - SOA-C03#4.2
      exam_unknown: false
      recommended:
        - claim:
            ko: 보안 그룹을 네트워크 접근 제어의 주된 수단으로 쓰고, 네트워크 ACL은 특정 트래픽 거부나 서브넷 안전망 같은 보조 수단으로 아껴 쓴다
          source: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/infrastructure-security.html
          checked: 2026-11-03
        - claim:
            ko: Amazon Inspector로 EC2 인스턴스의 소프트웨어 취약점과 의도하지 않은 네트워크 노출을 자동으로 검사한다
          source: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-best-practices.html
          checked: 2026-11-03
        - claim:
            ko: EBS 볼륨과 스냅샷을 암호화한다
          source: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-best-practices.html
          checked: 2026-11-03

            ko: 일관된 스냅샷을 위해 스냅샷 전에 볼륨 쓰기를 멈추고, 그럴 수 없으면 볼륨을 마운트 해제한다
          source: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-creating-snapshot.html
          checked: 2026-11-03
        - claim:
            ko: 루트 볼륨의 스냅샷은 인스턴스를 중지하고 만든다

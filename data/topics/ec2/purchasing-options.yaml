  track: exam-core
  doc_source: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html
  topics:
    - id: ec2/purchasing-options/on-demand
      title:
        ko: 온디맨드 인스턴스와 vCPU 할당량
      exam_tags:
        - SAA-C03#4.2
        - SAP-C03#3.1
      exam_unknown: false
      recommended:
        - claim:
            ko: 짧고 불규칙하며 중단되면 안 되는 워크로드에는 온디맨드 인스턴스를 쓴다
          source: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-on-demand-instances.html
          checked: 2026-11-03
      sources:
        - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-on-demand-instances.html
        - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html
    - id: ec2/purchasing-options/savings-plans-ri
      title:
        ko: Savings Plans와 예약 인스턴스
      exam_tags:
        - SAA-C03#4.2
        - SAP-C03#3.1

        - SAA-C03#4.2
        - SAP-C03#3.1
      exam_unknown: false
      sources:
        - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html
        - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-instance.html
    - id: ec2/purchasing-options/capacity
      title:
        ko: 온디맨드 용량 예약과 ML용 용량 블록
      exam_tags:
        - SAP-C03#3.1
      exam_unknown: false
      recommended:
        - claim:
            ko: 중요한 워크로드에 엄격한 용량 보장이 필요하면 온디맨드 용량 예약을 만든다
          source: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-reservations.html
          checked: 2026-11-03
        - claim:
            ko: 며칠~몇 주 동안 GPU가 필요하고 쓰지 않는 동안 예약 비용을 내고 싶지 않으면 용량 블록을 쓴다
          source: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-capacity-blocks.html

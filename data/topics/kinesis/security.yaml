      exam_tags:
        - SAA-C03#1.3
      sources:
        - https://docs.aws.amazon.com/streams/latest/dev/controlling-access.html
        - https://docs.aws.amazon.com/streams/latest/dev/resource-based-policy-examples.html
    - id: kinesis/security/vpc
      title:
        ko: "인터페이스 VPC 엔드포인트"
      exam_tags:
        - SAA-C03#1.3
      sources:
        - https://docs.aws.amazon.com/streams/latest/dev/vpc.html
    - id: kinesis/security/best-practices
      title:
        ko: "보안 모범 사례, 복원력, 규정 준수"
      exam_tags:
        - SAA-C03#1.3
      recommended:
        - claim:
            ko: "최소 권한으로 권한을 준다"
          source: https://docs.aws.amazon.com/streams/latest/dev/security-best-practices.html
          checked: 2026-11-02
        - claim:
            ko: "장기 자격 증명을 앱이나 S3에 저장하지 말고 IAM 역할의 임시 자격 증명을 쓴다"
          source: https://docs.aws.amazon.com/streams/latest/dev/security-best-practices.html
          checked: 2026-11-02
        - claim:
            ko: "CloudTrail로 API 호출을 모니터링한다"
          source: https://docs.aws.amazon.com/streams/latest/dev/security-best-practices.html
          checked: 2026-11-02
        - claim:
            ko: "소비자 EC2 인스턴스를 Auto Scaling 그룹에서 실행한다"
          source: https://docs.aws.amazon.com/streams/latest/dev/disaster-recovery-resiliency.html
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/streams/latest/dev/security-best-practices.html
        - https://docs.aws.amazon.com/streams/latest/dev/disaster-recovery-resiliency.html
        - https://docs.aws.amazon.com/streams/latest/dev/compliance-validation.html

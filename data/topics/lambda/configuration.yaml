          checked: 2026-11-03
        - claim:
            ko: EFS는 성능과 복원력을 위해 가용 영역 둘 이상에 마운트 대상을 둔다
          source: https://docs.aws.amazon.com/lambda/latest/dg/configuration-filesystem-efs.html
          checked: 2026-11-03
      sources:
        - https://docs.aws.amazon.com/lambda/latest/dg/configuration-timeout.html

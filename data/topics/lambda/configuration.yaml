  track: exam-core
  doc_source: https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html
  topics:
    - id: lambda/configuration/memory-architecture
      title:
        ko: 메모리와 CPU, 아키텍처(arm64·x86_64)
      exam_tags:
        - DVA-C03#1.2
        - DVA-C03#4.3
        - SAA-C03#3.2
        - SAA-C03#4.2
      exam_unknown: false
      recommended:
        - claim:
            ko: 최소 메모리 설정은 이벤트를 변환·전달하는 단순한 함수에만 쓴다
          source: https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html
          checked: 2026-11-03
        - claim:
            ko: arm64로 옮길 때는 의존성 확인, 테스트, 성능 비교 뒤 별칭 라우팅 등으로 단계적으로 배포한다
          source: https://docs.aws.amazon.com/lambda/latest/dg/foundation-arch.html
          checked: 2026-11-03
      sources:
        - https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html
        - https://docs.aws.amazon.com/lambda/latest/dg/foundation-arch.html
    - id: lambda/configuration/timeout-storage

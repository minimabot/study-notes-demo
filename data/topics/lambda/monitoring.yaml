    - id: lambda/monitoring/troubleshooting
      title:
        ko: 흔한 문제 해결 (제한 시간·메모리·권한·VPC)
      exam_tags:
        - DVA-C03#4.1
        - SOA-C03#1.2
        - DVA-C03#1.2
      exam_unknown: false
      recommended:
        - claim:
            ko: 하위 서비스에 기대는 함수는 오류 처리와 재시도 로직을 넣고, 중요한 하위 서비스의 실패는 지표나 로그로 남겨 경보를 건다
          source: https://docs.aws.amazon.com/lambda/latest/dg/troubleshooting-execution.html
          checked: 2026-11-03
        - claim:
            ko: 시험할 때는 작업량에서 합리적으로 예상되는 상한 크기의 데이터를 쓴다
          source: https://docs.aws.amazon.com/lambda/latest/dg/troubleshooting-configuration.html
          checked: 2026-11-03
      sources:
        - https://docs.aws.amazon.com/lambda/latest/dg/lambda-troubleshooting.html
        - https://docs.aws.amazon.com/lambda/latest/dg/troubleshooting-configuration.html
        - https://docs.aws.amazon.com/lambda/latest/dg/troubleshooting-invocation.html

    - id: lambda/monitoring/logs
      title:
        ko: CloudWatch Logs와 고급 로깅 제어 (JSON 형식·로그 수준·로그 그룹)
      exam_tags:
        - DVA-C03#4.2
        - DVA-C03#4.1
        - SOA-C03#1.1
        - DOP-C02#4.1
        - DOP-C02#4.2
      exam_unknown: false
      recommended:
        - claim:
            ko: 기존 도구가 일반 텍스트 로그에 기대지 않는다면 로그 형식으로 JSON을 고른다
          source: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-logformat.html
          checked: 2026-11-03
        - claim:
            ko: EMF 로그를 쓰는 Node.js 함수를 JSON 형식으로 바꿀 때는 Powertools·EMF 라이브러리를 최신으로 올리고 지표 인식을 시험한다
          source: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-logformat.html
          checked: 2026-11-03
      sources:
        - https://docs.aws.amazon.com/lambda/latest/dg/monitoring-logs.html
        - https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-logformat.html
        - https://docs.aws.amazon.com/lambda/latest/dg/monitoring-cloudwatchlogs-log-level.html

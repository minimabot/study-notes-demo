      recommended:
        - claim:
            ko: 대부분의 경우 긴 폴링 대기 시간을 최댓값으로 둔다. 너무 길면 줄이되 최소값 이상으로 둔다
          source: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/best-practices-setting-up-long-polling.html
          checked: 2026-11-01
        - claim:
            ko: HTTP 응답 시간 제한을 WaitTimeSeconds보다 길게 잡는다
          source: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/best-practices-setting-up-long-polling.html
          checked: 2026-11-01
      sources:

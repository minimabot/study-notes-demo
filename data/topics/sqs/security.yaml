# 장: 보안
chapter:
  id: sqs/security
  title:
    ko: 보안 (IAM, 큐 정책, 암호화, 네트워크)
  track: exam-core
  doc_source: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/security.html
  topics:
    - id: sqs/security/access-policies
      title:
        ko: IAM 정책과 큐 정책
      exam_tags:
        - SAA-C03#1.3
      sources:
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-overview-of-managing-access.html
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-configure-add-permissions.html
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-policies.html
    - id: sqs/security/least-privilege
      title:
        ko: 최소 권한과 혼동된 대리자
      exam_tags:
        - SAA-C03#1.3
      recommended:
        - claim:
            ko: 큐 정책의 Principal을 와일드카드로 두지 않아 큐를 공개하지 않는다
          source: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-security-best-practices.html#ensure-queues-not-publicly-accessible
          checked: 2026-11-01
        - claim:
            ko: 관리자·생산자·소비자에게 필요한 작업만 허용한다 (최소 권한)
          source: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-security-best-practices.html#implement-least-privilege-access
          checked: 2026-11-01
        - claim:
            ko: 애플리케이션과 AWS 서비스는 저장된 자격 증명 대신 IAM 역할의 임시 자격 증명을 쓴다
          source: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-security-best-practices.html#use-iam-roles-for-applications-aws-services-which-require-access
          checked: 2026-11-01
      sources:
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-security-best-practices.html
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-abac.html
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-access-policy-aws-managed-policies.html
    - id: sqs/security/encryption-at-rest
      title:
        ko: 저장 데이터 암호화 (SSE-SQS와 SSE-KMS)
      exam_tags:
        - SAA-C03#1.3
        - DVA-C03#2.2
        - SOA-C03#4.2
      recommended:
        - claim:
            ko: 데이터 유출에 대비해 서버 측 암호화(SSE)로 저장 메시지를 암호화한다
          source: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-security-best-practices.html#implement-server-side-encryption
          checked: 2026-11-01
      sources:
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-server-side-encryption.html
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-key-management.html
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-release-notes.html
    - id: sqs/security/transit-network
      title:
        ko: 전송 중 암호화와 VPC 엔드포인트
      exam_tags:
        - SAA-C03#1.3
        - DVA-C03#2.2
        - SOA-C03#4.2
      recommended:
        - claim:
            ko: 큐 정책의 aws:SecureTransport 조건으로 HTTPS(TLS) 요청만 허용한다
          source: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-security-best-practices.html#enforce-encryption-data-in-transit
          checked: 2026-11-01
        - claim:
            ko: 인터넷에 노출되면 안 되는 큐는 VPC 엔드포인트와 큐 정책으로 특정 VPC에서만 쓰게 한다
          source: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-security-best-practices.html#consider-using-vpc-endpoints-access-sqs
          checked: 2026-11-01
      sources:
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/infrastructure-security.html
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-internetwork-traffic-privacy.html
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-creating-custom-policies-access-policy-examples.html

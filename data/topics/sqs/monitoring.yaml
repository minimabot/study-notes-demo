      exam_tags:
        - SOA-C03#1.1
        - DOP-C02#4.2
      sources:
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/monitoring-using-cloudwatch.html
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-available-cloudwatch-metrics.html
    - id: sqs/monitoring/alarms-scaling
      title:
        ko: 경보와 소비자 스케일링
      exam_tags:
        - SOA-C03#1.1
        - SOA-C03#1.2
        - SAA-C03#3.2
        - DOP-C02#3.2
        - SAP-C03#5.4
      recommended:
        - claim:
            ko: 데드레터 큐의 상태는 ApproximateNumberOfMessagesVisible 지표로 감시한다
          source: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-available-cloudwatch-metrics.html#dlq-cloudwatch-metrics
          checked: 2026-11-01
        - claim:
            ko: ApproximateNumberOfMessagesNotVisible에 경보를 걸 때는 값 하나가 아니라 연속된 여러 데이터 포인트로 판단한다
          source: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-available-cloudwatch-metrics.html
          checked: 2026-11-01
        - claim:
            ko: 큐를 기준으로 Auto Scaling 그룹을 조정할 때는 큐 길이 자체가 아니라 인스턴스당 백로그를 목표 추적의 지표로 쓰고, 사용자 지정 지표 대신 지표 수학으로 계산한다
          source: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html
          checked: 2026-11-01
      sources:
        - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-available-cloudwatch-metrics.html
        - https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html

# 장: 트랜잭션과 동시성 제어
chapter:
  id: dynamodb/transactions
  title:
    ko: 트랜잭션·조건부 쓰기·낙관적 잠금
  track: exam-core
  doc_source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transactions.html
  topics:
    - id: dynamodb/transactions/apis
      title:
        ko: 트랜잭션 API와 한도
      exam_tags:
        - DVA-C03#1.3
        - SAA-C03#3.3
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transactions.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis-iam.html
    - id: dynamodb/transactions/idempotency-conflicts
      title:
        ko: 멱등성 토큰과 충돌 처리
      exam_tags:
        - DVA-C03#1.3
        - SAP-C03#1.1
      recommended:
        - claim:
            ko: AWS SDK를 쓰지 않으면 TransactWriteItems 호출에 ClientRequestToken을 넣어 요청을 멱등적으로 만든다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html#transaction-best-practices
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html#transaction-apis-txwriteitems-idempotency
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html#transaction-conflict-handling
    - id: dynamodb/transactions/isolation-capacity
      title:
        ko: 격리 수준, 용량, 전파
      exam_tags:
        - DVA-C03#1.3
        - SAA-C03#3.3
      recommended:
        - claim:
            ko: 꼭 필요한 작업만 한 트랜잭션에 묶고, 나눌 수 있으면 작은 트랜잭션으로 나눈다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html#transaction-best-practices
          checked: 2026-11-02
        - claim:
            ko: 대량 적재에는 트랜잭션 대신 BatchWriteItem을 쓴다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html#transaction-best-practices
          checked: 2026-11-02
        - claim:
            ko: 트랜잭션의 항목마다 필요한 두 번의 읽기·쓰기를 감당하도록 Auto Scaling을 켜거나 용량을 넉넉히 둔다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html#transaction-best-practices
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html#transaction-isolation
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html#transaction-capacity-handling
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transaction-apis.html#transaction-integration
    - id: dynamodb/transactions/conditional-writes
      title:
        ko: 조건부 쓰기와 원자성 카운터
      exam_tags:
        - DVA-C03#1.3
      recommended:
        - claim:
            ko: "과다·과소 집계를 허용할 수 없는 값(예: 은행 잔액)에는 원자성 카운터 대신 조건부 업데이트를 쓴다"
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html#WorkingWithItems.AtomicCounters
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html#WorkingWithItems.ConditionalUpdate
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html#WorkingWithItems.AtomicCounters
    - id: dynamodb/transactions/concurrency
      title:
        ko: 동시 갱신 전략 고르기 (낙관적 잠금)
      exam_tags:
        - DVA-C03#1.3
        - SAP-C03#1.1
      recommended:
        - claim:
            ko: 충돌이 드물고 재시도가 싸며 항목 하나를 고칠 때는 버전 속성과 조건부 쓰기로 낙관적 잠금을 쓴다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/BestPractices_ImplementingVersionControl.html
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/BestPractices_ImplementingVersionControl.html

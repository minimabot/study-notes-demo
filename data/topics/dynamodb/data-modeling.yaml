# 장: 데이터 모델링
chapter:
  id: dynamodb/data-modeling
  title:
    ko: 데이터 모델링 (접근 패턴에서 키 설계까지)
  track: exam-core
  doc_source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/data-modeling.html
  topics:
    - id: dynamodb/data-modeling/access-patterns
      title:
        ko: 접근 패턴에서 시작하기, 테이블은 몇 개로
      exam_tags:
        - DVA-C03#1.3
        - SAA-C03#3.3
        - SAP-C03#1.5
      recommended:
        - claim:
            ko: 스키마를 설계하기 전에 애플리케이션이 던질 질문(접근 패턴)을 먼저 파악한다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-general-nosql-design.html
          checked: 2026-11-02
        - claim:
            ko: 테이블 수는 가능한 한 적게 유지하고, 대부분의 경우 단일 테이블을 고려한다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-table-design.html
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-general-nosql-design.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/data-modeling-foundations.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-relational-modeling.html
    - id: dynamodb/data-modeling/sort-keys
      title:
        ko: 항목 컬렉션과 정렬 키 패턴
      exam_tags:
        - DVA-C03#1.3
      recommended:
        - claim:
            ko: 큰 문서는 같은 파티션 키 아래 정렬 키 접두어로 구분한 여러 작은 항목으로 나눈다(수직 분할)
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/data-modeling-blocks.html
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItemCollections.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-sort-keys.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/data-modeling-blocks.html
    - id: dynamodb/data-modeling/relationships
      title:
        ko: 다대다 관계, GSI 오버로딩, 희소 인덱스
      exam_tags:
        - DVA-C03#1.3
        - SAP-C03#1.5
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-adjacency-graphs.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-gsi-overloading.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/data-modeling-blocks.html
    - id: dynamodb/data-modeling/time-series-large
      title:
        ko: 시계열 데이터와 큰 항목
      exam_tags:
        - DVA-C03#1.3
        - SAA-C03#3.3
        - SAP-C03#3.4
      recommended:
        - claim:
            ko: 대량 시계열 데이터는 기간마다 테이블을 하나씩 두고, 지난 기간 테이블의 용량을 낮춘다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-time-series.html
          checked: 2026-11-02
        - claim:
            ko: TTL 삭제는 무료이므로 오래된 데이터를 테이블에서 지우는 데 TTL을 쓴다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/data-modeling-blocks.html
          checked: 2026-11-02
        - claim:
            ko: 쓰기에 ReturnConsumedCapacity를 써서 최대 항목 크기에 가까워지는 항목을 감시하고 경보를 건다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-use-s3-too.html
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-time-series.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-use-s3-too.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/data-modeling-blocks.html
    - id: dynamodb/data-modeling/order-example
      title:
        ko: "따라 하기: 주문 시스템 키 설계"
      exam_tags:
        - DVA-C03#1.3
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-modeling-nosql.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/data-modeling-online-shop.html

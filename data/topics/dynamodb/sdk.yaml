          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Programming.SDKOverview.html#Programming.SDKs.endpoints
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Programming.SDKOverview.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Programming.SDKs.Interfaces.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/sdk-general-information-section.html
    - id: dynamodb/sdk/java-clients
      title:
        ko: Java SDK 2.x의 클라이언트 종류
      exam_tags:
        - DVA-C03#1.1
      exam_unknown: false
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ProgrammingWithJava.html
    - id: dynamodb/sdk/errors-retries
      title:
        ko: 예외 처리와 재시도 설정
      exam_tags:
        - DVA-C03#1.1
      exam_unknown: false
      recommended:
        - claim:
            ko: Java SDK 2.x에서는 대부분의 경우 StandardRetryStrategy를 쓴다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ProgrammingWithJava.html#RetryPolicies
          checked: 2026-11-02
        - claim:
            ko: 지연을 예측할 수 있어야 하는 경우 adaptive 재시도 모드를 쓰지 않는다
          source: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ProgrammingWithJava.html#RetryMode
          checked: 2026-11-02
      sources:
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Programming.Errors.html
        - https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ProgrammingWithJava.html

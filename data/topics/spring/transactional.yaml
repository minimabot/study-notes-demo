          checked: 2026-11-03
      sources:
        - https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html
        - https://github.com/spring-projects/spring-framework/blob/v7.0.8/spring-tx/src/main/java/org/springframework/transaction/support/AbstractPlatformTransactionManager.java#L426
